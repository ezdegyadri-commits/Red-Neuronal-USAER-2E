<!doctype html><html lang="es"><meta charset="utf-8"><title>Prueba ficticia de guardado USAER</title>
<style>body{font:16px Arial;margin:24px;background:#f3f7f8}label{margin-right:24px}iframe{width:100%;border:1px solid #ccc;background:white}button{margin:14px;padding:8px}#estado{padding:14px;background:#dfefe9}</style>
<h1>Prueba de formato y guardado · datos ficticios</h1>
<p>Sin conexión a Google Sheets, Gemini ni cuentas reales.</p>
<label><input id="fallo" type="checkbox">Simular fallo de guardado</label>
<label><input id="lento" type="checkbox">Simular confirmación lenta (17 segundos)</label>
<button id="reabrir">Reabrir versión confirmada</button>
<p id="estado" role="status">Versiones confirmadas: 0 · Sin cambios</p>
<iframe id="editor" title="Formato ficticio" src="/editor/index.html" height="220"></iframe>
<script>
const frame=document.getElementById('editor'),estado=document.getElementById('estado');let version=0,received='',confirmed='',nonce='',pending=false;const seen=new Set();
function hoja(){const c0={id:'c0',value:received,label:'Actividades',editable:true},c1={id:'c1',value:'Sin valorar',label:'Valoración',editable:true,opciones:['Sin valorar','Logrado con autonomía']};return {documento:'ficticio',cache_id:'prueba-local-ficticia',huella:received||'base',titulo:'Guía de Planeación Grupal · ejemplo ficticio',grupal:true,colaborativa:false,header:[['Escuela ficticia · 5° A','Maestro regular ficticio']],tables:[{id:'guia',headers:['Actividades','Valoración'],rows:[[c0,c1]]}],textos:[],cells:{c0:{...c0,target:['guia',0,'Actividades']},c1:{...c1,target:['escala',0,'Valoración']}},firma:'Maestra ficticia',vobo:'Dirección ficticia'}}
function render(){frame.contentWindow.postMessage({type:'streamlit:render',args:{hoja:hoja(),aceptado_nonce:nonce,guardado:pending?'':'confirmado-local'}},location.origin)}
function receive(value){received=value.cambios.c0??received;nonce=value.nonce;pending=document.getElementById('fallo').checked;if(!pending){confirmed=received;version++}estado.textContent='Versiones confirmadas: '+version+' · '+(pending?'Pendiente; texto recibido sin respaldo confirmado':'Guardado confirmado: '+confirmed);render()}
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.origin!==location.origin)return;const m=event.data;if(m.type==='streamlit:componentReady')render();if(m.type==='streamlit:setFrameHeight')frame.height=m.height;if(m.type==='streamlit:setComponentValue'){const v=m.value;if(seen.has(v.nonce))return;seen.add(v.nonce);if(document.getElementById('lento').checked)setTimeout(()=>receive(v),17000);else receive(v)}});
document.getElementById('fallo').addEventListener('change',event=>{if(!event.target.checked&&pending){pending=false;confirmed=received;version++;estado.textContent='Versiones confirmadas: '+version+' · Recuperado: '+confirmed;render()}});
document.getElementById('reabrir').addEventListener('click',()=>{received=confirmed;pending=false;frame.src='/editor/index.html';estado.textContent='Versiones confirmadas: '+version+' · Reabierto: '+confirmed});
</script></html>
