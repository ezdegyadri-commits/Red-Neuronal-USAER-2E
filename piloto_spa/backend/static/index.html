<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USAER 02-E · Sistema Integral SPA 2.0</title>
  <!-- Tailwind CSS -->

  <!-- React 18 & ReactDOM -->


  <!-- Babel Standalone para JSX -->

  <style>
    :root {
      --primary: #0F172A;
      --accent: #D97706;
      --bg: #F8FAFC;
    }
    body {
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-saving {
      animation: pulse-subtle 1.2s infinite ease-in-out;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    import { abrirBoveda } from "./boveda.js";
    const { useState, useEffect, useRef, useCallback } = React;

    const API_BASE = window.location.origin;

    // Cliente API seguro con Bearer Token y manejo de sesión
    async function apiRequest(endpoint, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        'X-USAER-Client': 'browser',
        ...options.headers,
      };
      const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
      if (res.status === 401) {
        window.dispatchEvent(new Event('auth_expired'));
        throw new Error('Sesión expirada o credenciales inválidas');
      }
      if (!res.ok) {
        const errorText = await res.text();
        throw new Error(errorText || `Error ${res.status}`);
      }
      return await res.json();
    }

    // =============================================================
    // COMPONENTE: PANTALLA DE INICIO DE SESIÓN (LOGIN REAL)
    // =============================================================
    async function descargarArchivo(endpoint, nombre) {
      try {
          const response = await fetch(`${API_BASE}${endpoint}`);
        if (!response.ok) throw new Error(`Descarga rechazada (HTTP ${response.status})`);
        const url = URL.createObjectURL(await response.blob());
        const enlace = document.createElement('a');
        enlace.href = url;
        enlace.download = nombre;
        enlace.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (error) {
        alert(error.message);
      }
    }

    function LoginScreen({ onLoginSuccess }) {
      const [usuario, setUsuario] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        if (e) e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-USAER-Client': 'browser' },
            body: JSON.stringify({ usuario, password })
          });
          if (!res.ok) {
            throw new Error('Usuario o contraseña incorrectos.');
          }
          const data = await res.json();
          onLoginSuccess(data.user);
        } catch (err) {
          setError(err.message || 'Error de conexión');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-slate-900 px-4 py-12">
          <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 space-y-6">
            <div className="text-center space-y-2">
              <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-amber-500/10 text-amber-600 font-black text-3xl mb-2">
                ◈
              </div>
              <h1 className="text-2xl font-black tracking-tight text-slate-900">USAER 02-E · 2.0</h1>
              <p className="text-xs text-slate-500 font-medium">Plataforma Pedagógica y Administrativa Desacoplada</p>
            </div>

            {error && (
              <div className="p-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-xs font-semibold">
                ⚠️ {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Usuario</label>
                <input
                  type="text"
                  required
                  value={usuario}
                  onChange={(e) => setUsuario(e.target.value)}
                  className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/30 focus:border-amber-500"
                  autoComplete="username"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Contraseña</label>
                <input
                  type="password"
                  required
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/30 focus:border-amber-500"
                  placeholder="••••••••"
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold text-sm shadow-md transition flex items-center justify-center space-x-2 disabled:opacity-50"
              >
                {loading ? <span>Iniciando sesión...</span> : <span>Entrar al Sistema →</span>}
              </button>
            </form>


          </div>
        </div>
      );
    }

    // =============================================================
    // COMPONENTE PRINCIPAL (APP CON NAVEGACIÓN SPA)
    // =============================================================
    const borradoresCeldas = new Map();

    function App() {
      const [user, setUser] = useState(null);
      const [boveda, setBoveda] = useState(null);
      const [cargandoSesion, setCargandoSesion] = useState(true);

      useEffect(() => {
        apiRequest('/api/me').then(setUser).catch(() => {}).finally(() => setCargandoSesion(false));
      }, []);

      const [currentView, setCurrentView] = useState('mis_documentos'); // 'mis_documentos' | 'editor' | 'expedientes' | 'informes' | 'visitas' | 'estadisticas'
      const [activeDocId, setActiveDocId] = useState(null);
      const [activeAlumnoId, setActiveAlumnoId] = useState(null);
      const [metrics, setMetrics] = useState({ latency: 12, requests: 1 });

      useEffect(() => {
        const handleAuthExpired = () => {
          borradoresCeldas.clear();
          setBoveda(null);
          setUser(null);
        };
        window.addEventListener('auth_expired', handleAuthExpired);
        return () => window.removeEventListener('auth_expired', handleAuthExpired);
      }, []);

      const handleLogout = async () => {
        borradoresCeldas.clear();
        setBoveda(null);
        try {
          await apiRequest('/api/auth/logout', { method: 'POST' });
          setUser(null);
        } catch (error) {
          alert(error.message);
        }
      };

      if (cargandoSesion) return <p role="status">Comprobando sesión…</p>;

      if (!user) {
        return <LoginScreen onLoginSuccess={setUser} />;
      }

      return (
        <div className="flex flex-col min-h-screen">
          {/* Barra de Navegación Superior Inmediata */}
          <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
              <div
                className="flex items-center space-x-3 cursor-pointer"
                onClick={() => setCurrentView('mis_documentos')}
              >
                <span className="text-amber-500 font-black text-xl">◈</span>
                <span className="font-bold tracking-tight text-slate-100 text-lg">USAER 02-E</span>
                <span className="bg-slate-800 text-slate-400 text-xs px-2 py-0.5 rounded font-semibold hidden sm:inline">
                  Zona 001 · SPA 2.0
                </span>
              </div>

              {/* Pestañas de Acceso Rápido (1 Clic) */}
              <nav className="hidden md:flex items-center space-x-1 text-sm font-medium">
                <button
                  onClick={() => setCurrentView('mis_documentos')}
                  className={`px-3 py-1.5 rounded-lg transition ${
                    currentView === 'mis_documentos' ? 'bg-slate-800 text-amber-400 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  📁 Mis Documentos
                </button>
                <button
                  onClick={() => setCurrentView('expedientes')}
                  className={`px-3 py-1.5 rounded-lg transition ${
                    currentView === 'expedientes' ? 'bg-slate-800 text-amber-400 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  👤 Alumnos y Expedientes
                </button>
                <button onClick={() => { setActiveAlumnoId(null); setCurrentView('informes'); }}
                  className={`px-3 py-1.5 rounded-lg transition ${currentView === 'informes' ? 'bg-slate-800 text-amber-400 font-bold' : 'text-slate-400 hover:text-slate-200'}`}>
                  📝 Informes
                </button>
                {user.director && <>
                <button
                  onClick={() => setCurrentView('visitas')}
                  className={`px-3 py-1.5 rounded-lg transition ${
                    currentView === 'visitas' ? 'bg-slate-800 text-amber-400 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  📋 Actas y Oficios
                </button>
                </>}
                <button
                  onClick={() => setCurrentView('estadisticas')}
                  className={`px-3 py-1.5 rounded-lg transition ${
                    currentView === 'estadisticas' ? 'bg-slate-800 text-amber-400 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  📊 Estadísticas
                </button>
              </nav>

              <div className="flex items-center space-x-3">
                <div className="hidden sm:flex items-center space-x-1.5 text-xs bg-slate-800/80 px-2.5 py-1 rounded border border-slate-700/50">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="text-slate-400">Latencia:</span>
                  <strong className="text-emerald-300 font-mono">{metrics.latency} ms</strong>
                </div>

                <div className="flex items-center space-x-2">
                  <div className="text-right text-xs hidden lg:block">
                    <div className="font-semibold text-slate-200">{user.nombre}</div>
                    <div className="text-slate-400">{user.rol}</div>
                  </div>
                  <button
                    onClick={handleLogout}
                    className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded border border-slate-700 transition"
                    title="Cerrar sesión"
                  >
                    Salir
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* Área de Contenido SPA */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
            {currentView === 'mis_documentos' && (
              <MisDocumentosView
                onOpenDoc={(id) => {
                  setActiveDocId(id);
                  setCurrentView('editor');
                }}
                onOpenExpediente={(id) => {
                  setActiveAlumnoId(id);
                  setCurrentView('expedientes');
                }}
                setMetrics={setMetrics}
              />
            )}

            {currentView === 'editor' && (
              <PlaneacionEditorView
                docId={activeDocId}
                cuenta={user.id_usuario} boveda={boveda} setBoveda={setBoveda}
                onBack={() => setCurrentView('mis_documentos')}
                setMetrics={setMetrics}
              />
            )}

            {currentView === 'expedientes' && (
              <ExpedientesView
                initialAlumnoId={activeAlumnoId}
                onOpenInformes={id => { setActiveAlumnoId(id); setCurrentView('informes'); }}
                onBack={() => setCurrentView('mis_documentos')}
                setMetrics={setMetrics}
              />
            )}

            {currentView === 'informes' && (
              <InformesView initialAlumnoId={activeAlumnoId}
                onBack={() => setCurrentView(activeAlumnoId ? 'expedientes' : 'mis_documentos')} />
            )}

            {currentView === 'visitas' && (
              <ActasYOficiosView
                onBack={() => setCurrentView('mis_documentos')}
                setMetrics={setMetrics}
              />
            )}

            {currentView === 'estadisticas' && (
              <EstadisticasView
                director={user.director}
                onBack={() => setCurrentView('mis_documentos')}
                setMetrics={setMetrics}
              />
            )}
          </main>

          <footer className="border-t border-slate-200 bg-white py-3 text-center text-xs text-slate-400">
            USAER 02-E · Sistema Pedagógico Integrado 2.0 · React SPA + FastAPI + PostgreSQL (Cero Recargas)
          </footer>
        </div>
      );
    }

    // =============================================================
    // VISTA 1: MIS DOCUMENTOS (HUB CENTRAL EN 1 CLIC)
    // =============================================================
    function CrearPlaneacion({ alumnos, onOpenDoc, onCancel }) {
      const [modalidad, setModalidad] = useState('individual');
      const [formato, setFormato] = useState('XXIII');
      const [seleccion, setSeleccion] = useState('');
      const [ciclo, setCiclo] = useState(2026);
      const [error, setError] = useState('');
      const [enviando, setEnviando] = useState(false);
      const grupos = new Map();
      for (const alumno of alumnos) {
        if (!alumno.grado || !alumno.grupo || !alumno.id_escuela) continue;
        const clave = JSON.stringify([alumno.id_escuela, alumno.grado, alumno.grupo]);
        if (!grupos.has(clave)) grupos.set(clave, { ids: [], nombre: `${alumno.escuela || alumno.id_escuela} · ${alumno.grado} ${alumno.grupo}` });
        grupos.get(clave).ids.push(alumno.id);
      }
      async function crear(event) {
        event.preventDefault();
        setEnviando(true);
        setError('');
        try {
          const ids = modalidad === 'grupal' ? grupos.get(seleccion).ids : [seleccion];
          const doc = await apiRequest('/api/planeaciones/nueva', {
            method: 'POST', body: JSON.stringify({ modalidad, formato, alumnos: ids, ciclo_inicio: Number(ciclo) })
          });
          onOpenDoc(doc.id);
        } catch (err) {
          setError(err.message);
        } finally {
          setEnviando(false);
        }
      }
      return (
        <form onSubmit={crear} className="bg-white p-4 border rounded space-y-2">
          <h2 className="font-bold">Crear planeación</h2>
          <label className="block">Modalidad <select value={modalidad} onChange={e => {
            setModalidad(e.target.value); setSeleccion(''); setFormato('XXIII');
          }}><option value="individual">Individual</option><option value="grupal">Grupal anual</option></select></label>
          <label className="block">{modalidad === 'grupal' ? 'Grupo' : 'Alumno'} <select aria-label={modalidad === 'grupal' ? 'Grupo' : 'Alumno'} required value={seleccion} onChange={e => setSeleccion(e.target.value)}>
            <option value="">Seleccionar</option>
            {modalidad === 'grupal'
              ? Array.from(grupos, ([id, grupo]) => <option key={id} value={id}>{grupo.nombre}</option>)
              : alumnos.map(a => <option key={a.id} value={a.id}>{a.nombre_completo}</option>)}
          </select></label>
          <label className="block">Formato <select value={formato} onChange={e => setFormato(e.target.value)}>
            {modalidad === 'individual' && <option>XXI</option>}<option>XXIII</option><option>XXV</option>
          </select></label>
          <label className="block">Año de inicio del ciclo <input type="number" min="2000" max="2100" required value={ciclo} onChange={e => setCiclo(e.target.value)} /></label>
          <button type="submit" disabled={enviando} className="px-3 py-2 bg-slate-800 text-white rounded">Crear documento</button>
          <button type="button" onClick={onCancel} className="px-3">Cancelar</button>
          {error && <p role="alert">{error}</p>}
        </form>
      );
    }

    function MisDocumentosView({ onOpenDoc, onOpenExpediente, setMetrics }) {
      const [planeaciones, setPlaneaciones] = useState([]);
      const [alumnos, setAlumnos] = useState([]);
      const [creando, setCreando] = useState(false);
      const [loading, setLoading] = useState(true);
      const [busqueda, setBusqueda] = useState('');
      const [modalAlumno, setModalAlumno] = useState(false);
      const [deleteTargetId, setDeleteTargetId] = useState(null);

      // Estado para nuevo alumno
      const [nuevoNombre, setNuevoNombre] = useState('');
      const [nuevoCURP, setNuevoCURP] = useState('');
      const [nuevoGrado, setNuevoGrado] = useState('2');
      const [nuevoGrupo, setNuevoGrupo] = useState('A');
      const [nuevaEscuela, setNuevaEscuela] = useState('ESC-001');
      const [nuevaCondicion, setNuevaCondicion] = useState('TDAH');

      const loadHub = useCallback(async () => {
        const t0 = performance.now();
        try {
          const [planesData, alumnosData] = await Promise.all([
            apiRequest('/api/planeaciones'),
            apiRequest('/api/alumnos')
          ]);
          setPlaneaciones(planesData);
          setAlumnos(alumnosData);
          const t1 = performance.now();
          setMetrics(m => ({ latency: Math.round(t1 - t0), requests: m.requests + 2 }));
        } catch (e) {
          console.error("Error cargando hub:", e);
        } finally {
          setLoading(false);
        }
      }, [setMetrics]);

      useEffect(() => {
        loadHub();
      }, [loadHub]);

      const handleCrearAlumno = async (e) => {
        e.preventDefault();
        try {
          await apiRequest('/api/alumnos', {
            method: 'POST',
            body: JSON.stringify({
              nombre_completo: nuevoNombre,
              curp: nuevoCURP,
              grado: nuevoGrado,
              grupo: nuevoGrupo,
              id_escuela: nuevaEscuela,
              condicion_discapacidad: nuevaCondicion
            })
          });
          setModalAlumno(false);
          setNuevoNombre('');
          setNuevoCURP('');
          loadHub();
        } catch (err) {
          alert(`Error al crear alumno: ${err.message}`);
        }
      };

      const handleConfirmarEliminar = async () => {
        if (!deleteTargetId) return;
        try {
          await apiRequest(`/api/planeaciones/${deleteTargetId}`, { method: 'DELETE' });
          setPlaneaciones(prev => prev.filter(p => p.id !== deleteTargetId));
          setDeleteTargetId(null);
        } catch (err) {
          alert(`Error al eliminar: ${err.message}`);
        }
      };

      const planesFiltrados = planeaciones.filter(p => {
        const q = busqueda.toLowerCase();
        return (p.metadatos?.titulo || '').toLowerCase().includes(q) ||
               (p.datos?.Escuela || '').toLowerCase().includes(q) ||
               (p.id || '').toLowerCase().includes(q);
      });

          if (creando) return <CrearPlaneacion alumnos={alumnos} onOpenDoc={onOpenDoc} onCancel={() => setCreando(false)} />;

      return (
        <div className="space-y-6">
          {/* Encabezado y Acciones Rápidas */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-bold tracking-tight text-slate-900">Mis Documentos de Trabajo</h1>
              <p className="text-sm text-slate-500">Acceso directo a tus planeaciones activas y expedientes de alumnos</p>
            </div>
            <div className="flex items-center space-x-3">
              <button
                onClick={() => setModalAlumno(true)}
                className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl font-semibold text-sm transition"
              >
                + Alta Rápida de Alumno
              </button>
              <button
                onClick={() => setCreando(true)}
                className="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-semibold shadow-sm text-sm transition flex items-center space-x-2"
              >
                <span>+</span>
                <span>Nueva Planeación (Anexo XXIII)</span>
              </button>
            </div>
          </div>

          {/* Barra de Búsqueda Instantánea en Memoria */}
          <div className="relative">
            <input
              type="text"
              value={busqueda}
              onChange={(e) => setBusqueda(e.target.value)}
              placeholder="Buscar documento por alumno, escuela, grado o aprendizaje esperado..."
              className="w-full pl-4 pr-10 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 shadow-sm"
            />
          </div>

          {/* Sección de Planeaciones Recientes */}
          <div className="space-y-3">
            <h2 className="text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center space-x-2">
              <span>📝 Planeaciones y Planes de Intervención</span>
              <span className="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full">{planesFiltrados.length}</span>
            </h2>

            {loading ? (
              <div className="text-center py-12 bg-white rounded-xl border border-slate-200">
                <div className="inline-block animate-spin text-amber-600 text-2xl mb-2">◈</div>
                <p className="text-sm text-slate-500">Cargando documentos desde PostgreSQL...</p>
              </div>
            ) : planesFiltrados.length === 0 ? (
              <div className="text-center py-8 bg-white rounded-xl border border-slate-200 text-slate-500 text-sm">
                No hay planeaciones que coincidan con la búsqueda.
              </div>
            ) : (
              <div className="grid gap-3">
                {planesFiltrados.map((plan) => (
                  <div
                    key={plan.id}
                    className="bg-white p-4 rounded-xl border border-slate-200 hover:border-amber-500/50 hover:shadow-md transition flex flex-col sm:flex-row sm:items-center justify-between gap-3 group"
                  >
                    <div
                      className="space-y-1 cursor-pointer flex-1"
                      onClick={() => onOpenDoc(plan.id)}
                    >
                      <div className="flex items-center space-x-2">
                        <span className="font-bold text-slate-900 group-hover:text-amber-700 transition">
                          {plan.metadatos?.titulo || `Planeación Anexo ${plan.formato}`}
                        </span>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider ${
                          plan.estado === 'APROBADO' || plan.estado === 'AUTORIZADA' ? 'bg-emerald-100 text-emerald-800' :
                          plan.estado === 'REVISIÓN' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800'
                        }`}>
                          {plan.estado}
                        </span>
                      </div>
                      <div className="text-xs text-slate-500 flex items-center space-x-3">
                        <span>🏫 {plan.datos?.Escuela || 'Primaria Oficial'}</span>
                        <span>•</span>
                        <span>Grado: {plan.datos?.Grado_Grupo || '2° A'}</span>
                        <span>•</span>
                        <span>Guardado: {plan.guardado_en || 'Reciente'}</span>
                      </div>
                    </div>

                    <div className="flex items-center space-x-3">
                      {plan.observaciones_director && (
                        <span className="text-xs bg-slate-100 text-slate-700 px-2.5 py-1 rounded-md border border-slate-200 font-medium hidden sm:inline">
                          💬 Con Vo. Bo.
                        </span>
                      )}
                      <button
                        onClick={() => onOpenDoc(plan.id)}

    // =============================================================
    // VISTA 2: EDITOR DE PLANEACIÓN INDIVIDUAL (ANEXO XXIII)

    function PropuestasLocales({ doc, mutarDoc }) {
      const [enfoque, setEnfoque] = useState('');
      const [referentes, setReferentes] = useState([]);
      const [pdaId, setPdaId] = useState('');
      const [neeId, setNeeId] = useState('');
      const [campo, setCampo] = useState('Lenguajes');
      const necesidades = doc.editor.nee_confirmadas;
      const [resultado, setResultado] = useState(null);
      const [error, setError] = useState('');
      const [consultando, setConsultando] = useState(false);
      const [aplicadas, setAplicadas] = useState([]);
      const base = `/api/planeaciones/${doc.id}`;

      useEffect(() => {
        apiRequest(base + '/referentes?campo=' + encodeURIComponent(campo)).then(setReferentes).catch(e => setError(e.message));
      }, [base, campo]);

      async function preparar() {
        setConsultando(true);
        setError('');
        setResultado(null);
        setAplicadas([]);
        try {
          const propuesta = await apiRequest(base + '/propuesta', {
            method: 'POST', body: JSON.stringify({ enfoque, pda_id: pdaId, nee_id: neeId, campo })
          });
          setResultado({ ...propuesta, pdaId, campo });
        } catch (e) {
          setError(e.message);
        } finally {
          setConsultando(false);
        }
      }

      return (
        <section className="border rounded p-3 space-y-2">
          <h3 className="font-bold">Propuesta pedagógica para revisión docente</h3>
          <p>Motor local basado en reglas y fuentes del expediente.</p>
          {necesidades && <label className="block">NEE confirmada <select aria-label="NEE confirmada"
            className="max-w-full border" value={neeId} onChange={e => setNeeId(e.target.value)}>
            <option value="">Elegir NEE vigente</option>
            {necesidades.map(nee => <option key={nee.id} value={nee.id}>{nee.texto}</option>)}
          </select></label>}
          <label className="block">Campo formativo <select className="border" value={campo} onChange={e => {
            setCampo(e.target.value); setPdaId(''); setReferentes([]);
          }}>
            {['Lenguajes', 'Saberes y Pensamiento Científico', 'Ética, Naturaleza y Sociedades',
              'De lo Humano y lo Comunitario'].map(c => <option key={c}>{c}</option>)}
          </select></label>
          <label className="block">Orientación docente <input className="border" value={enfoque} onChange={e => setEnfoque(e.target.value)} /></label>
          <label className="block">PDA del catálogo <select aria-label="PDA del catálogo" className="max-w-full border" value={pdaId} onChange={e => setPdaId(e.target.value)}>
            <option value="">Sin PDA seleccionado</option>
            {referentes.map(r => <option key={r.id} value={r.id}>{r.grado}° · {r.pda}</option>)}
          </select></label>
          <button disabled={consultando} className="underline" onClick={preparar}>Preparar propuestas</button>
          {error && <p role="alert">{error}</p>}
          {resultado?.propuestas.map((p, i) => <div key={p.id} className="border rounded p-2">
            <p>{p.nombre} · {p.orientacion}</p>
            {p.pda && <p>PDA de referencia: {p.pda}</p>}
            {p.nee && <p>{p.nee}</p>}
            {p.nee && [['descriptor', 'Descriptor de logro'], ['apoyos', 'Apoyos y ajustes'],
              ['temporalidad', 'Temporalidad'], ['recursos', 'Materiales'], ['evaluacion', 'Evaluación']].map(([k, etiqueta]) =>
              <label key={k} className="block">{etiqueta}<textarea aria-label={etiqueta} className="block w-full border rounded" value={p[k]}
                onChange={e => {
                  const texto = e.target.value;
                  setResultado(r => ({ ...r, propuestas: r.propuestas.map((v, j) => i === j ? { ...v, [k]: texto } : v) }));
                }} /></label>)}
            <textarea aria-label="Actividad propuesta" className="block w-full border rounded" rows="4" value={p.actividad}
              onChange={e => {
                const actividad = e.target.value;
                setResultado(r => ({ ...r, propuestas: r.propuestas.map((v, j) => i === j ? { ...v, actividad } : v) }));
              }} />
            <button className="underline" disabled={aplicadas.includes(p.id) || doc.revision !== resultado.revision} onClick={() => {
              mutarDoc(d => {
                const tablas = { ...d.tablas };
                const textos = { ...d.textos };
                const agregar = (tabla, fila) => { tablas[tabla] = [...(tablas[tabla] || []), fila]; };
                if (d.formato === 'XXI') {
                  if (p.nee) agregar('necesidades', {
                    NEE: p.nee, 'Aprendizajes y/u Objetivos': p.pda, 'Descriptor de Logro': p.descriptor,
                    'Apoyos o ajustes': p.apoyos, Temporalidad: p.temporalidad,
                    'Tipo de registro': p.evaluacion, Seguimiento: p.actividad + '\nMateriales: ' + p.recursos
                  });
                  else agregar('barreras', { 'Acciones para minimizarla o eliminarla': p.actividad });
                } else {
                  agregar('dosificacion', { Actividades: p.actividad + (p.apoyos ? '\nApoyos: ' + p.apoyos : ''),
                    Contextos: p.contexto, Recursos: p.recursos, Temporalidad: p.temporalidad || '', Fecha: p.temporalidad || '',
                    _alumnos_locales: [p.alumno], _actividad_local: p.id });
                  if (d.formato === 'XXIII' && p.nee) agregar('aprendizajes', {
                    'Necesidades educativas específicas': p.nee, 'Aprendizaje y/u objetivo': p.pda, 'Descriptor de logro': p.descriptor
                  });
                  if (p.evaluacion) {
                    const clave = d.formato === 'XXV' ? 'Resultados obtenidos en los diferentes contextos' : 'Evaluación';
                    textos[clave] = [textos[clave], p.evaluacion].filter(Boolean).join('\n\n');
                  }
                }
                return { ...d, tablas, textos, metadatos: { ...d.metadatos,
                  spa_pda_id: resultado.pdaId || d.metadatos.spa_pda_id || '',
                  spa_campo_pda: resultado.pdaId ? resultado.campo : d.metadatos.spa_campo_pda || 'Lenguajes' } };
              });
              setAplicadas(ids => [...ids, p.id]);
            }}>Incorporar propuesta revisada</button>
          </div>)}
          {resultado && <details><summary>Revisión de los 14 indicadores</summary>
            <ol className="list-decimal pl-5">{resultado.indicadores.map(r => <li key={r.Número}>
              {r.Indicador} · {r['Comprobación estructural']}
            </li>)}</ol>
          </details>}
        </section>
      );
    }

    function CeldaCompartida({ doc, fila, tabla, campo, editable, boveda }) {
      const inicial = fila[campo] || '';
      const version = doc.metadatos.revisiones_celda?.[tabla]?.[fila.ID_Alumno]?.[campo] || '';
      const clave = JSON.stringify([doc.id, tabla, fila.ID_Alumno, campo]);
      const [confirmado, confirmar] = useState(() => borradoresCeldas.get(clave)?.confirmado || { texto: inicial, revision: version });
      const [texto, setTexto] = useState(() => borradoresCeldas.get(clave)?.texto ?? inicial);
      const [ocupado, setOcupado] = useState(false);
      const [error, setError] = useState('');
      const [conflicto, setConflicto] = useState(null);
      const [online, setOnline] = useState(navigator.onLine);
      const pendiente = texto !== confirmado.texto;

      const [vaultLeida, setVaultLeida] = useState(null);
      const [copia, setCopia] = useState('');
      const [errorCopia, setErrorCopia] = useState('');
      const pendienteRef = useRef(pendiente);
      pendienteRef.current = pendiente;

      useEffect(() => {
        if (!editable || !boveda) return;
        let activa = true;
        setErrorCopia('');
        boveda.leer(clave).then(recuperado => {
          if (!activa) return;
          if (recuperado) {
            if (pendienteRef.current) {
              setErrorCopia('Hay una copia anterior y un cambio abierto. Reabre la guía para revisar la copia.');
              return;
            }
            confirmar(recuperado.confirmado);
            setTexto(recuperado.texto);
            setCopia('Borrador cifrado recuperado');
          }
          setVaultLeida(boveda);
        }).catch(e => { if (activa) setErrorCopia(e.message); });
        return () => { activa = false; };
      }, [boveda, clave, editable]);

      useEffect(() => {
        if (!editable || !boveda || vaultLeida !== boveda) return;
        let activa = true;
        if (pendiente) setCopia('');
        const operacion = pendiente ? boveda.guardar(clave, { texto, confirmado }) : boveda.borrar(clave);
        operacion.then(() => {
          if (activa) setCopia(pendiente ? 'Copia cifrada disponible' : '');
        }).catch(e => { if (activa) setErrorCopia(e.message); });
        return () => { activa = false; };
      }, [boveda, clave, editable, vaultLeida, pendiente, texto, confirmado]);

      useEffect(() => {
        if (editable && pendiente) borradoresCeldas.set(clave, { texto, confirmado });
        else borradoresCeldas.delete(clave);
      }, [clave, editable, pendiente, texto, confirmado]);

      useEffect(() => {
        const actualizar = () => setOnline(navigator.onLine);
        window.addEventListener('online', actualizar);
        window.addEventListener('offline', actualizar);
        return () => {
          window.removeEventListener('online', actualizar);
          window.removeEventListener('offline', actualizar);
        };
      }, []);

      useEffect(() => {
        if (!pendiente) return;
        const avisar = event => { event.preventDefault(); event.returnValue = ''; };
        window.addEventListener('beforeunload', avisar);
        return () => window.removeEventListener('beforeunload', avisar);
      }, [pendiente]);

      useEffect(() => {
        if (!editable || !pendiente || ocupado || !online || conflicto || error) return;
        const timer = setTimeout(async () => {
          setOcupado(true);
          try {
            const acuse = await apiRequest(`/api/planeaciones/${doc.id}/celda`, {
              method: 'PATCH',
              body: JSON.stringify({ tabla, alumno: fila.ID_Alumno, campo, revision: confirmado.revision, texto })
            });
            confirmar(acuse);
          } catch (e) {
            let detalle;
            try { detalle = JSON.parse(e.message).detail; } catch (_) {}
            if (detalle && typeof detalle === 'object' && 'revision' in detalle) setConflicto(detalle);
            else setError(typeof detalle === 'string' ? detalle : e.message);
          } finally {
            setOcupado(false);
          }
        }, 1500);
        return () => clearTimeout(timer);
      }, [editable, pendiente, ocupado, online, conflicto, error, doc.id, tabla, fila.ID_Alumno, campo, confirmado.revision, texto]);

      return <div className="mb-2">
        <label className="block">{campo}
          <textarea readOnly={!editable} className="block w-full border rounded" value={editable ? texto : inicial}
            onChange={event => setTexto(event.target.value)} />
        </label>
        {editable && (pendiente || confirmado.revision !== version) && <p role="status" className="text-xs text-slate-600">
          {conflicto ? 'Esta celda tiene un conflicto.' : ocupado ? 'Guardando aporte…' : pendiente ?
            (online ? 'Aporte pendiente' : 'Aporte pendiente, sin conexión') : 'Aporte guardado'}
        </p>}
        {pendiente && copia && <p className="text-xs" role="status">{copia}</p>}
        {errorCopia && <p className="text-xs" role="alert">{errorCopia}</p>}
        {error && <p role="alert">{error} <button type="button" className="underline" onClick={() => setError('')}>Reintentar</button></p>}
        {conflicto && <div className="border p-2 text-sm">
          <p>Texto guardado por otra persona</p>
          <p className="whitespace-pre-wrap">{conflicto.texto || '(vacío)'}</p>
          <p>Tu propuesta sigue en el cuadro. Puedes editarla para conciliar los textos.</p>
          <button type="button" className="underline mr-3" onClick={() => {
            confirmar(conflicto); setTexto(conflicto.texto); setConflicto(null);
          }}>Usar texto guardado</button>
          <button type="button" className="underline" onClick={() => {
            confirmar(conflicto); setConflicto(null);
          }}>Guardar mi propuesta revisada</button>
        </div>}
      </div>;
    }

    function CamposPlaneacion({ doc, mutarDoc, actualizarMatricula, saveStatus, cuenta, boveda, setBoveda }) {
      const coordina = doc.editor.coordina !== false;
      const editables = doc.editor.columnas_editables;
      const columnas = doc.editor.columnas_grupales?.slice(2) || [];
      const guia = doc.metadatos.guia_grupal_manual;
      const [historial, setHistorial] = useState(null);

      const [estadoBoveda, setEstadoBoveda] = useState('');
      async function desbloquearBoveda(event) {
        event.preventDefault();
        const campo = event.currentTarget.elements.frase;
        const frase = campo.value;
        campo.value = '';
        try {
          setBoveda(await abrirBoveda(cuenta, frase));
          setEstadoBoveda('');
        } catch (error) {
          setEstadoBoveda(error.message);
        }
      }

      async function abrirHistorial() {
        try {
          setHistorial(await apiRequest(`/api/planeaciones/${doc.id}/historial`));
        } catch (error) {
          alert(error.message);
        }
      }

      return (
        <div className="space-y-4 bg-white p-4 rounded border">
          <p>{doc.datos['Escuela regular']} · {doc.datos['Curso escolar']}</p>
          <p>{doc.datos.Alumnos.map(a => a['Nombre del alumno']).join(', ')}</p>
          {Object.entries(doc.editor.tablas).map(([tabla, campos]) => (
            <section key={tabla} className="space-y-2 border-t pt-2">
              <h3 className="font-bold">{tabla.replaceAll('_', ' ')}</h3>
              {(doc.tablas[tabla] || []).map((fila, indice) => (
                <fieldset key={indice} disabled={!coordina} className="grid md:grid-cols-3 gap-2 border p-2">
                  {campos.map(campo => <label key={campo}>{campo}<textarea className="block w-full border rounded"
                    value={fila[campo] || ''} onChange={event => {
                      const value = event.target.value;
                      mutarDoc(d => ({ ...d, tablas: { ...d.tablas, [tabla]:
                        d.tablas[tabla].map((r, i) => i === indice ? { ...r, [campo]: value } : r) } }));
                    }} /></label>)}
                  <button onClick={() => mutarDoc(d => ({ ...d, tablas: { ...d.tablas,
                    [tabla]: d.tablas[tabla].filter((_, i) => i !== indice) } }))}>Quitar fila</button>
                </fieldset>
              ))}
              <button disabled={!coordina} onClick={() => mutarDoc(d => ({ ...d, tablas: { ...d.tablas,
                [tabla]: [...(d.tablas[tabla] || []), {}] } }))}>Agregar fila</button>
            </section>
          ))}
          {Object.entries(doc.textos).map(([campo, value]) => <label key={campo} className="block">{campo}
            <textarea readOnly={!coordina} className="block w-full border rounded" value={value} onChange={event => {
              const texto = event.target.value;
              mutarDoc(d => ({ ...d, textos: { ...d.textos, [campo]: texto } }));
            }} /></label>)}
          {guia && <section className="space-y-2">
            <h3 className="font-bold">Guía grupal anual · Anexo XIX</h3>
            {editables && <details className="border p-2 rounded">
              <summary>Recuperación de borradores en este navegador</summary>
              {boveda ? <p>Bóveda abierta. La copia cifrada caduca para recuperación en 24 horas.</p> :
                <form onSubmit={desbloquearBoveda} className="space-y-2">
                  <p>Usa una frase distinta a tu contraseña. Se necesita la misma cuenta, navegador y frase para recuperar.</p>
                  <label>Frase de recuperación <input name="frase" type="password" autoComplete="off" className="border" required /></label>
                  <button type="submit" className="underline ml-2">Abrir bóveda</button>
                </form>}
              {estadoBoveda && <p role="alert">{estadoBoveda}</p>}
            </details>}
            {editables && coordina && <button className="underline" disabled={saveStatus !== 'saved'}
              onClick={actualizarMatricula}>Actualizar matrícula</button>}
            {guia.filas.map((fila, i) => <fieldset key={fila.ID_Alumno} className="border p-2">
              <legend>{fila['Nombre alumno']}</legend>
              {columnas.map(campo => editables
                ? <CeldaCompartida key={campo} doc={doc} fila={fila} tabla="filas" campo={campo} boveda={boveda} editable={editables.includes(campo)} />
                : <label key={campo} className="block">{campo}
                <textarea readOnly={editables && !editables.includes(campo)} className="block w-full border rounded" value={fila[campo] || ''} onChange={event => {
                  const texto = event.target.value;
                  mutarDoc(d => {
                    const actual = d.metadatos.guia_grupal_manual;
                    return { ...d, metadatos: { ...d.metadatos, guia_grupal_manual: { ...actual,
                      filas: actual.filas.map((r, j) => j === i ? { ...r, [campo]: texto } : r) } } };
                  });
                }} /></label>)}
            </fieldset>)}
          </section>}
          {!!guia?.as?.length && doc.editor.columnas_as && <section className="space-y-2">
            <h3 className="font-bold">Guía para aptitudes sobresalientes · Anexo XX</h3>
            {guia.as.map((fila, i) => <fieldset key={fila.ID_Alumno || i} className="border p-2">
              <legend>{fila['Nombre alumno']}</legend>
              {doc.editor.columnas_as.slice(1).map(campo => editables && fila.ID_Alumno
                ? <CeldaCompartida key={campo} doc={doc} fila={fila} tabla="as" campo={campo} boveda={boveda} editable={coordina} />
                : <label key={campo} className="block">{campo}
                <textarea readOnly={!coordina || !fila.ID_Alumno} className="block w-full border rounded"
                  value={fila[campo] || ''} onChange={event => {
                    const texto = event.target.value;
                    mutarDoc(d => {
                      const actual = d.metadatos.guia_grupal_manual;
                      return { ...d, metadatos: { ...d.metadatos, guia_grupal_manual: { ...actual,
                        as: actual.as.map((r, j) => j === i ? { ...r, [campo]: texto } : r) } } };
                    });
                  }} /></label>)}
            </fieldset>)}
          </section>}
          <button className="underline" onClick={abrirHistorial}>Ver historial</button>
          {historial && <ul>{historial.map(({ revision, autor, fecha, documento }) =>
            <li key={revision}>{fecha} · {autor} {!editables && <button className="underline" onClick={() => {
              if (confirm('¿Recuperar esta versión como una nueva revisión?')) {
                mutarDoc(d => ({ ...d, tablas: documento.tablas, textos: documento.textos, metadatos: documento.metadatos }));
              }
            }}>Recuperar</button>}</li>)}</ul>}
        </div>
      );
    }

    function PlaneacionEditorView({ docId, onBack, setMetrics, cuenta, boveda, setBoveda }) {
      const [doc, setDoc] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('aprendizajes'); // 'aprendizajes' | 'dosificacion' | 'evaluacion' | 'firmas'
      const [saveStatus, setSaveStatus] = useState('saved'); // 'saved' | 'saving' | 'dirty' | 'offline' | 'error'
      const [assistantOpen, setAssistantOpen] = useState(false);
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const enCurso = useRef(false);
      const sincronizandoMatricula = useRef(false);
      const cambios = useRef(0);
      const [saveError, setSaveError] = useState('');

      useEffect(() => {
        const protegerSalida = (event) => {
          if (saveStatus !== 'saved') event.preventDefault();
        };
        window.addEventListener('beforeunload', protegerSalida);
        return () => window.removeEventListener('beforeunload', protegerSalida);
      }, [saveStatus]);

      useEffect(() => {
        const handleOnline = () => {
          setIsOnline(true);
          setSaveStatus(status => status === 'offline' ? 'dirty' : status);
        };
        const handleOffline = () => {
          setIsOnline(false);
        };
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      // Cargar documento completo
      useEffect(() => {
        let mounted = true;
        const fetchDoc = async () => {
          const t0 = performance.now();
          try {
            const data = await apiRequest(`/api/planeaciones/${docId}`);
            if (mounted) {
              setDoc(data);
              const t1 = performance.now();
              setMetrics(m => ({ latency: Math.round(t1 - t0), requests: m.requests + 1 }));
            }
          } catch (e) {
            console.error("Error abriendo planeación:", e);
          } finally {
            if (mounted) setLoading(false);
          }
        };
        fetchDoc();
        return () => { mounted = false; };
      }, [docId, setMetrics]);

      // Guardar con debounce
      const persistir = useCallback(async (docActual) => {
        if (!navigator.onLine) {
          setSaveStatus('offline');
          return;
        }
        if (enCurso.current) return;
        enCurso.current = true;
        const version = cambios.current;
        setSaveError('');
        setSaveStatus('saving');
        const t0 = performance.now();
        try {
          const res = await apiRequest('/api/planeaciones', {
            method: 'POST',
            body: JSON.stringify(docActual)
          });
          setSaveStatus(cambios.current === version ? 'saved' : 'dirty');
          const t1 = performance.now();
          setMetrics(m => ({ latency: Math.round(t1 - t0), requests: m.requests + 1 }));
          setDoc(d => ({ ...d, revision: res.revision, guardado_en: res.guardado_en, firmas_resueltas: res.firmas }));
        } catch (e) {
          console.error("Error al persistir:", e);
          setSaveError(e.message);
          setSaveStatus('error');
        } finally {
          enCurso.current = false;
        }
      }, [setMetrics]);

      // Detectar cambios y programar autoguardado a 1.5s
      const mutarDoc = (updater) => {
        if (sincronizandoMatricula.current) return;
        cambios.current += 1;
        setDoc(prev => typeof updater === 'function' ? updater(prev) : { ...prev, ...updater });
        if (!enCurso.current) setSaveStatus('dirty');
      };

      useEffect(() => {
        if (saveStatus !== 'dirty' || !isOnline) return;
        const timer = setTimeout(() => persistir(doc), 1500);
        return () => clearTimeout(timer);
      }, [doc, saveStatus, isOnline, persistir]);

      if (!loading && !doc) {
        return <div role="alert">La planeación no está disponible. <button onClick={onBack}>Volver</button></div>;
      }

      if (loading || !doc) {
        return (
          <div className="text-center py-24 bg-white rounded-xl border border-slate-200">
            <div className="inline-block animate-spin text-amber-600 text-3xl mb-3">◈</div>
            <p className="text-slate-600 text-sm font-medium">Abriendo planeación oficial...</p>
          </div>
        );
      }

      return (
        <div className="space-y-4">
          {/* Cabecera del Editor */}
          <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div className="flex items-center space-x-3">
              <button
                onClick={() => { if (saveStatus === 'saved' || confirm('Hay cambios sin confirmar. ¿Salir?')) onBack(); }}
                className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-700 text-xs font-semibold transition"
              >
                ← Volver a Mis Documentos
              </button>
              <div>
                <input
                  type="text"
                  readOnly={doc.editor?.coordina === false}
                  value={doc.metadatos?.titulo || ''}
                  onChange={(e) => mutarDoc(d => ({ ...d, metadatos: { ...d.metadatos, titulo: e.target.value } }))}
                  className="font-bold text-slate-900 text-base md:text-lg border-b border-transparent hover:border-slate-300 focus:border-amber-500 focus:outline-none px-1 w-full max-w-lg"
                  placeholder="Título del Plan de Intervención"
                />
                <div className="text-xs text-slate-500 px-1 flex items-center space-x-2">
                  <span>Escuela: {doc.datos?.Escuela || 'Primaria Oficial'}</span>
                  <span>•</span>
                  <span>Anexo {doc.formato}</span>
                  <span>•</span>
                  <span>Revisión: {doc.revision}</span>
                </div>
              </div>
            </div>

            <div className="flex items-center space-x-2.5">
              {/* Indicador de Guardado */}
              <div className="text-xs font-medium px-3 py-1.5 rounded-lg border bg-slate-50 border-slate-200 flex items-center space-x-2">
                {saveStatus === 'saved' && (
                  <>
                    <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span className="text-slate-600">Guardado confirmado</span>
                  </>
                )}
                {saveStatus === 'saving' && (
                  <>
                    <span className="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                    <span className="text-amber-700 font-semibold animate-saving">Guardando cambios...</span>
                  </>
                )}
                {saveStatus === 'dirty' && (
                  <>
                    <span className="w-2 h-2 rounded-full bg-amber-400"></span>
                    <span className="text-slate-500">Cambios pendientes</span>
                  </>
                )}
                {saveStatus === 'offline' && (
                  <>
                    <span className="w-2 h-2 rounded-full bg-slate-400"></span>
                    <span className="text-slate-600">Sin conexión (esperando red)</span>
                  </>
                )}
                {saveStatus === 'error' && (
                  <>
                    <span className="w-2 h-2 rounded-full bg-red-500"></span>
                    <span className="text-red-600 font-bold">Error de guardado</span>
                  </>
                )}
              </div>

              {saveStatus !== 'saved' && (
                <button disabled={saveStatus === 'saving'} onClick={() => persistir(doc)} title={saveError}>
                  Guardar ahora
                </button>
              )}
              <button
                onClick={() => descargarArchivo(`/api/planeaciones/${doc.id}/pdf`, 'Planeacion.pdf')}
                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-bold transition flex items-center space-x-1.5"
              >
                <span>Descargar PDF Oficial</span>
                <span>📄</span>
              </button>

              <button
                onClick={() => setAssistantOpen(!assistantOpen)}
                className={`px-3.5 py-1.5 rounded-lg text-xs font-bold shadow-sm transition flex items-center space-x-1.5 ${
                  assistantOpen ? 'bg-amber-600 text-white ring-2 ring-amber-400' : 'bg-amber-50 text-amber-800 border border-amber-300 hover:bg-amber-100'
                }`}
              >
                <span>{doc.editor ? 'Propuestas pedagógicas' : 'Asistente pedagógico · ejemplos locales'}</span>
              </button>
            </div>
          </div>

          {saveStatus === 'error' && saveError && <p role="alert" className="text-red-700">{saveError}</p>}
          {doc.editor ? <>
            <CamposPlaneacion doc={doc} mutarDoc={mutarDoc} saveStatus={saveStatus} cuenta={cuenta} boveda={boveda} setBoveda={setBoveda}
              actualizarMatricula={async () => {
                if (enCurso.current) return;
                enCurso.current = true;
                sincronizandoMatricula.current = true;
                setSaveStatus('saving');
                try {
                  await apiRequest(`/api/planeaciones/${doc.id}/matricula`, {
                    method: 'POST', body: JSON.stringify({ revision: doc.revision })
                  });
                  setDoc(await apiRequest(`/api/planeaciones/${doc.id}`));
                  setSaveStatus('saved');
                } catch (e) {
                  setSaveStatus('error');
                  setSaveError(e.message);
                } finally {
                  enCurso.current = false;
                  sincronizandoMatricula.current = false;
                }
              }} />
            {assistantOpen && doc.editor.coordina !== false && <PropuestasLocales doc={doc} mutarDoc={mutarDoc} />}
          </> : <>
          {/* Navegación por Pestañas del Formato Oficial */}
          <div className="flex border-b border-slate-200 space-x-1 text-sm font-semibold">
            {[
              { id: 'aprendizajes', label: '1. NEE y Descriptores Observables' },
              { id: 'dosificacion', label: '2. Dosificación y Actividades' },
              { id: 'evaluacion', label: '3. Evaluación Formativa' },
              { id: 'firmas', label: '4. Firmas y Vo. Bo. Oficial' },
            ].map((tab) => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-4 py-2.5 border-b-2 font-bold transition text-xs sm:text-sm ${
                  activeTab === tab.id
                    ? 'border-amber-600 text-amber-700 bg-amber-50/50'
                    : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* Contenedor Principal: Editor + Drawer IA */}
          <div className="flex gap-4 items-start">
            <div className="flex-1 bg-white p-5 rounded-xl border border-slate-200 shadow-sm min-h-[420px]">
              {/* TAB 1: NEE, BAP y Descriptores Observables */}
              {activeTab === 'aprendizajes' && (
                <div className="space-y-4">
                  <div className="flex items-center justify-between">

                      <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wide">

                        Indicador 5: Redactar con <strong>Sujeto + Verbo en Presente + Complemento Observable</strong>.
                      </p>

                    <button
                      onClick={() => {
                        const nuevaFila = {

                          descriptor: '',
                          apoyos: ''

                        }));
                      }}
                      className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-lg text-xs font-semibold"
                    >
                      + Agregar Alumno a Planeación

                  <div className="overflow-x-auto">
                    <table className="w-full text-xs text-left border-collapse">

                        <tr className="bg-slate-50 text-slate-600 border-b border-slate-200 font-bold">

                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {(doc.tablas?.nee || []).map((row, idx) => (
                          <tr key={idx} className="hover:bg-slate-50/70 transition">
                            <td className="p-2">
                              <input
                                type="text"

                              />

                            </td>

                                  }));

                          </tr>

                      </tbody>
                    </table>
                  </div>
                </div>

              {/* TAB 2: Dosificación de Actividades */}
              {activeTab === 'dosificacion' && (

                    <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wide">Secuencia Didáctica y Modalidad</h3>
                    <button
                      onClick={() => {
                        mutarDoc(d => ({
                          ...d,
                          tablas: {
                            ...d.tablas,
                            dosificacion: [
                              ...(d.tablas?.dosificacion || []),
                              { semana: '', actividad: '', recursos: '', modalidad: '' }

                      }}
                      className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-lg text-xs font-semibold"
                    >
