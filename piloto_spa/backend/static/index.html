        </div>
      );
    }

    // =============================================================
    // VISTA 12: DOCENTES REGULARES (71 MAESTROS DE PRIMARIA)
    // =============================================================
    function DocentesRegularesView({ onBack, setMetrics }) {
      const [docentes, setDocentes] = useState([]);
      const [busqueda, setBusqueda] = useState('');
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        apiRequest('/api/docentes-regulares')
          .then(data => { setDocentes(data); setLoading(false); })
          .catch(() => setLoading(false));
      }, []);

      const filtrados = docentes.filter(d => {
        const nom = (d.nombre_docente || d.Nombre_Docente || d.Nombre || d.Docente || '').toLowerCase();
        const esc = (d.nombre_escuela || d.Nombre_Escuela || d.Escuela || '').toLowerCase();
        const q = busqueda.toLowerCase();
        return nom.includes(q) || esc.includes(q);
      });

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <button onClick={onBack} className="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-700 font-semibold transition">
                ← Volver
              </button>
              <h1 className="text-2xl font-bold tracking-tight text-slate-900">Directorio de Maestros de Primaria (7 Escuelas)</h1>
            </div>
            <span className="text-xs bg-amber-50 text-amber-800 font-bold px-3 py-1 rounded-full border border-amber-200">
              {filtrados.length} maestros
            </span>
          </div>

          <input
            type="text"
            placeholder="Buscar por nombre de maestro o escuela primaria..."
            value={busqueda}
            onChange={e => setBusqueda(e.target.value)}
            className="w-full text-xs p-3 rounded-xl border border-slate-200 bg-white shadow-sm"
          />

          {loading ? (
            <div className="text-center py-12 bg-white rounded-xl border border-slate-200 text-slate-500 text-xs">Cargando directorio docente...</div>
          ) : filtrados.length === 0 ? (
            <div className="text-center py-12 bg-white rounded-xl border border-slate-200 text-slate-500 text-xs">
              No se encontraron docentes regulares con ese criterio.
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
              {filtrados.map((d, i) => (
                <div key={i} className="p-3.5 bg-white rounded-xl border border-slate-200 text-xs space-y-1 shadow-sm hover:border-amber-400 transition">
                  <div className="font-bold text-slate-900 text-sm">{d.nombre_docente || d.Nombre_Docente || d.Nombre || d.Docente}</div>
                  <div className="text-slate-600">Escuela: {d.nombre_escuela || d.Nombre_Escuela || d.Escuela}</div>
                  <div className="text-slate-500">
                    <span>Grado y Grupo: <strong>{d.grado || d.Grado} {d.grupo || d.Grupo}</strong></span>
                    {(d.turno || d.Turno) && <span className="ml-2">• {d.turno || d.Turno}</span>}
                  </div>
                  {(d.telefono || d.Telefono) && <div className="text-slate-400 text-[11px]">📞 {d.telefono || d.Telefono}</div>}
                  {(d.email || d.Email) && <div className="text-slate-400 text-[11px]">✉️ {d.email || d.Email}</div>}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // =============================================================
    // VISTA 13: NOVEDADES DE SUPERVISIÓN (111 DOCUMENTOS ZONA 001)
    // =============================================================
    function NovedadesView({ onBack, setMetrics }) {
      const [novedades, setNovedades] = useState([]);
      const [busqueda, setBusqueda] = useState('');
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        apiRequest('/api/novedades')
          .then(data => { setNovedades(data); setLoading(false); })
          .catch(() => setLoading(false));
      }, []);

      const filtradas = novedades.filter(n => {
        const tit = (n.Nombre || n.nombre || n.Titulo || n.asunto || n.Asunto || '').toLowerCase();
        const ext = (n.Extracto || n.extracto || n.Descripcion || '').toLowerCase();
        const q = busqueda.toLowerCase();
        return tit.includes(q) || ext.includes(q);
      });

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <button onClick={onBack} className="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-700 font-semibold transition">
                ← Volver
              </button>
              <h1 className="text-2xl font-bold tracking-tight text-slate-900">Novedades de Supervisión · ATP Zona 001</h1>
            </div>
            <span className="text-xs bg-amber-50 text-amber-800 font-bold px-3 py-1 rounded-full border border-amber-200">
              {filtradas.length} documentos oficiales
            </span>
          </div>

          <input
            type="text"
            placeholder="Buscar en circulares y documentos oficiales..."
            value={busqueda}
            onChange={e => setBusqueda(e.target.value)}
            className="w-full text-xs p-3 rounded-xl border border-slate-200 bg-white shadow-sm"
          />

          {loading ? (
            <div className="text-center py-12 bg-white rounded-xl border border-slate-200 text-slate-500 text-xs">Cargando circulares oficiales...</div>
          ) : filtradas.length === 0 ? (
            <div className="text-center py-12 bg-white rounded-xl border border-slate-200 text-slate-500 text-xs">
              No se encontraron novedades o circulares con ese criterio.
            </div>
          ) : (
            <div className="grid gap-2.5">
              {filtradas.map((n, i) => (
                <div key={i} className="p-4 bg-white rounded-xl border border-slate-200 text-xs flex justify-between items-center shadow-sm hover:border-amber-400 transition">
                  <div className="space-y-1">
                    <div className="font-bold text-slate-900 text-sm">{n.Nombre || n.nombre || n.Titulo || n.asunto || n.Asunto}</div>
                    <div className="text-slate-500">{n.Extracto || n.extracto || n.Descripcion || 'Circular oficial emitida por la Supervisión Escolar Zona 001.'}</div>
                  </div>
                  {(n.Enlace || n.enlace) && (
                    <a
                      href={n.Enlace || n.enlace}
                      target="_blank"
                      rel="noreferrer"
                      className="text-xs font-bold text-amber-700 bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-lg border border-amber-200 whitespace-nowrap ml-4 transition"
                    >
                      Ver Documento ↗
                    </a>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // =============================================================
    // VISTA 14: JUNTAS ACADÉMICAS Y RELATORÍAS
    // =============================================================
    function JuntasView({ onBack, setMetrics }) {
      const [juntas, setJuntas] = useState(null);

      useEffect(() => {
        apiRequest('/api/juntas').then(setJuntas);
      }, []);

      if (!juntas) return <div className="text-center py-16 text-slate-500 text-sm">Cargando catálogo metodológico...</div>;

      return (
        <div className="space-y-6">
          <div className="flex items-center space-x-3">
            <button onClick={onBack} className="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-700 font-semibold transition">
              ← Volver
            </button>
            <h1 className="text-2xl font-bold tracking-tight text-slate-900">Juntas Académicas y Catálogo de Metodologías</h1>
          </div>

          <div className="bg-white p-5 rounded-xl border border-slate-200 space-y-4">
            <h3 className="font-bold text-slate-800 text-sm">Catálogo Oficial de Metodologías Pedagógicas</h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
              {Object.entries(juntas.catalogo_metodologias || {}).map(([clave, desc]) => (
                <div key={clave} className="p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-1">
                  <div className="font-bold text-amber-800">{clave}</div>
                  <div className="text-slate-600">{desc}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // =============================================================
    // VISTA 15: METAS PERSONALES
    // =============================================================
    function MetasView({ onBack, setMetrics }) {
      const [metas, setMetas] = useState([]);

      useEffect(() => {
        apiRequest('/api/metas').then(setMetas);
      }, []);

      return (
        <div className="space-y-6">
          <div className="flex items-center space-x-3">
            <button onClick={onBack} className="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-700 font-semibold transition">
              ← Volver
            </button>
            <h1 className="text-2xl font-bold tracking-tight text-slate-900">Metas Personales Trimestrales</h1>
          </div>

          <div className="grid gap-3">
            {metas.map((m, i) => (
              <div key={i} className="p-4 bg-white rounded-xl border border-slate-200 text-xs space-y-2">
                <div className="flex justify-between items-center font-bold text-slate-900">
                  <span className="text-sm">{m.Docente || m.Especialista}</span>
                  <span className="text-slate-400 font-normal">{m.Ciclo || '2026-2027'}</span>
                </div>
                <div><strong>Meta:</strong> {m.Meta || m.Descripcion}</div>
                {m.Avance && <div className="text-emerald-700"><strong>Avance Reportado:</strong> {m.Avance}</div>}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // =============================================================
    // VISTA 16: TRÁMITES
    // =============================================================
    function TramitesView({ onBack, setMetrics }) {
      const [tramites, setTramites] = useState([]);

      useEffect(() => {
        apiRequest('/api/tramites').then(setTramites);
      }, []);

      return (
        <div className="space-y-6">
          <div className="flex items-center space-x-3">
            <button onClick={onBack} className="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-700 font-semibold transition">
              ← Volver
            </button>
            <h1 className="text-2xl font-bold tracking-tight text-slate-900">Trámites y Solicitudes Administrativas</h1>
          </div>

          <div className="grid gap-3">
            {tramites.map((t, i) => (
              <div key={i} className="p-4 bg-white rounded-xl border border-slate-200 text-xs space-y-1">
                <div className="flex justify-between items-center font-bold text-slate-900">
                  <span className="text-sm">{t.Tipo || t.Asunto}</span>
                  <span className="text-slate-400 font-normal">{t.Fecha}</span>
                </div>
                <div>Solicitante: {t.Solicitante} • Estatus: <strong className="text-amber-800">{t.Estatus || 'En Proceso'}</strong></div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // =============================================================
    // VISTA 17: INFORMES
    // =============================================================
    function InformesView({ onBack, setMetrics }) {
      const [informes, setInformes] = useState([]);

      useEffect(() => {
        apiRequest('/api/informes').then(setInformes);
      }, []);

      return (
        <div className="space-y-6">
          <div className="flex items-center space-x-3">
            <button onClick={onBack} className="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-700 font-semibold transition">
              ← Volver
            </button>
            <h1 className="text-2xl font-bold tracking-tight text-slate-900">Informes y Documentos Pedagógicos</h1>
          </div>

          <div className="grid gap-3">
            {informes.map((inf, i) => (
              <div key={i} className="p-4 bg-white rounded-xl border border-slate-200 text-xs space-y-1">
                <div className="flex justify-between items-center font-bold text-slate-900">
                  <span className="text-sm">{inf.Titulo || inf.Asunto}</span>
                  <span className="text-slate-400 font-normal">{inf.Fecha}</span>
                </div>
                <div>Alumno / Grupo: {inf.Alumno || inf.Escuela}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // =============================================================
    // VISTA 18: ACTAS DE VISITA Y OFICIOS DE COMISIÓN
    // =============================================================
    function ActasYOficiosView({ onBack, setMetrics }) {
      const [visitas, setVisitas] = useState([]);
      const [oficios, setOficios] = useState([]);
      const [subTab, setSubTab] = useState('visitas');

      useEffect(() => {
        const t0 = performance.now();
        Promise.all([
          apiRequest('/api/visitas'),
          apiRequest('/api/oficios')
        ]).then(([v, o]) => {
          setVisitas(v);
          setOficios(o);
          const t1 = performance.now();
          setMetrics(m => ({ latency: Math.round(t1 - t0), requests: m.requests + 2 }));
        });
      }, [setMetrics]);

      return (
        <div className="space-y-6">
          <div className="flex items-center space-x-3">
            <button onClick={onBack} className="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-700 font-semibold transition">
              ← Volver
            </button>
            <h1 className="text-2xl font-bold tracking-tight text-slate-900">Actas de Visita y Oficios de Comisión</h1>
          </div>

          <div className="flex border-b border-slate-200 space-x-2 text-xs font-bold">
            <button
              onClick={() => setSubTab('visitas')}
              className={`px-4 py-2 border-b-2 transition ${
                subTab === 'visitas' ? 'border-amber-600 text-amber-800 bg-amber-50/50' : 'border-transparent text-slate-500'
              }`}
            >
              📋 Actas de Visita de Acompañamiento ({visitas.length})
            </button>
            <button
              onClick={() => setSubTab('oficios')}
              className={`px-4 py-2 border-b-2 transition ${
                subTab === 'oficios' ? 'border-amber-600 text-amber-800 bg-amber-50/50' : 'border-transparent text-slate-500'
              }`}
            >
              📜 Oficios de Comisión ({oficios.length})
            </button>
          </div>

          {subTab === 'visitas' && (
            <div className="space-y-3">
              {visitas.map((v, i) => (
                <div key={i} className="p-4 bg-white rounded-xl border border-slate-200 text-xs space-y-1 shadow-sm">
                  <div className="flex justify-between items-center">
                    <span className="font-bold text-slate-900 text-sm">Escuela: {v.Escuela}</span>
                    <span className="text-slate-400">{v.Fecha}</span>
                  </div>
                  <div><strong>Personal de Acompañamiento:</strong> {v.Personal}</div>
                  <div><strong>Motivo:</strong> {v.Motivo}</div>
                  {v.Observaciones && <div className="text-slate-600"><strong>Observaciones:</strong> {v.Observaciones}</div>}
                </div>
              ))}
            </div>
          )}

          {subTab === 'oficios' && (
            <div className="space-y-3">
              {oficios.map((o, i) => (
                <div key={i} className="p-4 bg-white rounded-xl border border-slate-200 text-xs space-y-1 shadow-sm">
                  <div className="flex justify-between items-center">
                    <span className="font-bold text-slate-900 text-sm">Folio: {o.Folio}</span>
                    <span className="text-slate-400">Emisión: {o.Fecha_Emision}</span>
                  </div>
                  <div><strong>Destino:</strong> {o.Destino} ({o.Escuela})</div>
                  <div><strong>Personal comisionado:</strong> {o.Maestra_Apoyo}</div>
                  <div><strong>Asunto:</strong> {o.Asunto}</div>
                  <div><strong>Horario:</strong> {o.Horario}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // =============================================================
    // VISTA 19: ESTADÍSTICAS INSTITUCIONALES DE ZONA
    // =============================================================
    function EstadisticasView({ onBack, setMetrics }) {
      const [stats, setStats] = useState(null);

      useEffect(() => {
        const t0 = performance.now();
        apiRequest('/api/estadisticas/zona').then(data => {
          setStats(data);
          const t1 = performance.now();
          setMetrics(m => ({ latency: Math.round(t1 - t0), requests: m.requests + 1 }));
        });
      }, [setMetrics]);

      if (!stats) {
        return <div className="text-center py-16 text-slate-500 text-sm">Calculando indicadores relacionales...</div>;
      }

      return (
        <div className="space-y-6">
          <div className="flex items-center space-x-3">
            <button onClick={onBack} className="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-700 font-semibold transition">
              ← Volver
            </button>
            <h1 className="text-2xl font-bold tracking-tight text-slate-900">Estadísticas de Zona 001</h1>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="p-4 bg-white rounded-xl border border-slate-200 shadow-sm">
              <div className="text-slate-500 text-xs font-semibold">Total Alumnos en Padrón</div>
              <div className="text-2xl font-black text-slate-900 mt-1">{stats.total_alumnos}</div>
              <div className="text-[11px] text-emerald-600 mt-1">Activos en ciclo {stats.ciclo_activo}</div>
            </div>
            <div className="p-4 bg-white rounded-xl border border-slate-200 shadow-sm">
              <div className="text-slate-500 text-xs font-semibold">Escuelas de la Zona</div>
              <div className="text-2xl font-black text-amber-600 mt-1">{stats.total_escuelas}</div>
              <div className="text-[11px] text-slate-400 mt-1">Primarias públicas</div>
            </div>
            <div className="p-4 bg-white rounded-xl border border-slate-200 shadow-sm">
              <div className="text-slate-500 text-xs font-semibold">Cumplimiento EPP</div>
              <div className="text-2xl font-black text-emerald-600 mt-1">{stats.cumplimiento_epp}</div>
              <div className="text-[11px] text-slate-400 mt-1">Avance curricular</div>
            </div>
            <div className="p-4 bg-white rounded-xl border border-slate-200 shadow-sm">
              <div className="text-slate-500 text-xs font-semibold">Actas y Oficios</div>
              <div className="text-2xl font-black text-slate-900 mt-1">{stats.visitas_registradas + stats.oficios_emitidos}</div>
              <div className="text-[11px] text-slate-400 mt-1">Supervisión técnica</div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="p-5 bg-white rounded-xl border border-slate-200 space-y-3">
              <h3 className="font-bold text-slate-800 text-sm">Distribución por Condición o Discapacidad</h3>
              <div className="space-y-2 text-xs">
                {Object.entries(stats.distribucion_condicion || {}).map(([cond, count]) => (
                  <div key={cond} className="flex justify-between items-center py-1 border-b border-slate-100">
                    <span className="text-slate-700">{cond}</span>
                    <span className="font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded">{count}</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="p-5 bg-white rounded-xl border border-slate-200 space-y-3">
              <h3 className="font-bold text-slate-800 text-sm">Matrícula por Escuela</h3>
              <div className="space-y-2 text-xs">
                {Object.entries(stats.distribucion_escuela || {}).map(([esc, count]) => (
                  <div key={esc} className="flex justify-between items-center py-1 border-b border-slate-100">
                    <span className="text-slate-700">{esc}</span>
                    <span className="font-bold text-slate-800 bg-slate-100 px-2 py-0.5 rounded">{count}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
