<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USAER 02-E · Sistema Integral SPA 2.0</title>
  <!-- Tailwind CSS CDN -->
  <script crossorigin="anonymous" src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone para JSX -->
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.0/babel.min.js"></script>
  <style>
    :root {
      --primary: #0F172A;
      --accent: #D97706;
      --bg: #F8FAFC;
    }
    body {
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-saving {
      animation: pulse-subtle 1.2s infinite ease-in-out;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen">
  <div id="root">
    <div class="flex items-center justify-center min-h-screen bg-slate-900 text-amber-400 font-sans">
      <div class="text-center p-8 bg-slate-800/80 rounded-2xl border border-slate-700 shadow-2xl max-w-sm w-full mx-4">
        <div class="text-4xl font-black mb-3 text-amber-400 tracking-wider">USAER 02-E</div>
        <p class="text-slate-300 text-sm animate-pulse mb-4">Cargando plataforma pedagógica 2.0...</p>
        <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden">
          <div class="bg-amber-400 h-full w-2/3 animate-pulse"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      console.error("Error global frontend:", message, source, lineno, colno, error);
      const root = document.getElementById('root');
      if (root && root.innerHTML.includes('Cargando plataforma')) {
        let detalle = (error && error.message) || message || 'Hubo un retraso cargando los recursos interactivos.';
        if (detalle === 'Script error.' || !lineno) {
          detalle = 'El navegador detectó una intermitencia de red descargando librerías interactivas (React/Tailwind). Presiona Reintentar.';
        }
        const ubicacion = lineno ? ` (Línea: ${lineno}${colno ? `:${colno}` : ''})` : '';
        root.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;background:#0F172A;color:#F87171;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;">' +
          '<div style="background:#1E293B;padding:32px;border-radius:16px;border:1px solid #334155;max-width:540px;width:100%;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">' +
          '<h2 style="font-size:22px;font-weight:bold;margin-bottom:12px;color:#FBBF24;">USAER 02-E · Sistema 2.0</h2>' +
          '<p style="font-size:14px;font-weight:bold;color:#F87171;margin-bottom:8px;">⚠️ Aviso de Conexión de Plataforma</p>' +
          '<p style="color:#CBD5E1;font-size:13px;line-height:1.5;margin-bottom:20px;word-break:break-word;">' + detalle + ubicacion + '</p>' +
          '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">' +
          '<button onclick="location.reload()" style="background:#D97706;color:#FFF;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:13px;">Reintentar Carga Inmediata</button>' +
          '<button onclick="sessionStorage.clear(); localStorage.clear(); location.reload(true);" style="background:#334155;color:#E2E8F0;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:13px;">Limpiar Caché y Recargar</button>' +
          '</div>' +
          '</div>' +
          '</div>';
      }
    };
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;
    const API_BASE = window.location.origin;

    // =============================================================
    // COMPONENTE: LIMITADOR DE ERRORES (ERROR BOUNDARY) ANTI-PANTALLA BLANCA
    // =============================================================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, errorInfo: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary atrapó un error en tiempo de render:", error, errorInfo);
        this.setState({ errorInfo });
        try {
          fetch(`${API_BASE}/api/logs/frontend`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              error: String(error),
              message: error?.message,
              stack: error?.stack,
              componentStack: errorInfo?.componentStack,
              url: window.location.href,
              fecha: new Date().toISOString()
            })
          }).catch(() => {});
        } catch (_) {}
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 bg-slate-900 min-h-screen text-slate-100 flex items-center justify-center">
              <div className="bg-slate-800 border border-slate-700 max-w-lg w-full p-6 rounded-2xl shadow-2xl text-center space-y-4">
                <div className="text-3xl text-amber-400">⚠️</div>
                <h2 className="text-lg font-bold text-amber-300">Aviso de Renderizado en Módulo</h2>
                <p className="text-xs text-slate-300 leading-relaxed">
                  {this.state.error?.message || 'Ocurrió una excepción al procesar la vista interactiva.'}
                </p>
                <div className="flex justify-center gap-3 pt-2">
                  <button
                    onClick={() => { this.setState({ hasError: false, error: null }); window.location.reload(); }}
                    className="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition"
                  >
                    Reintentar y Recargar
                  </button>
                  <button
                    onClick={() => { sessionStorage.clear(); localStorage.clear(); window.location.href = '/'; }}
                    className="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold px-4 py-2 rounded-lg transition"
                  >
                    Limpiar Sesión
                  </button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Cliente API con Bearer Token y manejo de sesión
    async function apiRequest(endpoint, options = {}) {
      const token = sessionStorage.getItem('usaer_token');
      const headers = {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
        ...options.headers,
      };
      const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
      if (res.status === 401) {
        sessionStorage.removeItem('usaer_token');
        sessionStorage.removeItem('usaer_user');
        window.dispatchEvent(new Event('auth_expired'));
        throw new Error('Sesión expirada o credenciales inválidas');
      }
      if (!res.ok) {
        const errorText = await res.text();
        throw new Error(errorText || `Error ${res.status}`);
      }
      return await res.json();
    }

    // =============================================================
    // COMPONENTE: PANTALLA DE INICIO DE SESIÓN
    // =============================================================
    function LoginScreen({ onLoginSuccess }) {
      const [usuario, setUsuario] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        if (e) e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario, password })
          });
          if (!res.ok) {
            throw new Error('Usuario o contraseña incorrectos.');
          }
          const data = await res.json();
          onLoginSuccess(data.user, data.token);
        } catch (err) {
          setError(err.message || 'Error de conexión');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-slate-900 px-4 py-12">
          <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 space-y-6">
            <div className="text-center space-y-2">
              <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-amber-500/10 text-amber-600 font-black text-3xl mb-2">
                ◈
              </div>
              <h1 className="text-2xl font-black tracking-tight text-slate-900">USAER 02-E · 2.0</h1>
              <p className="text-xs text-slate-500 font-medium">Plataforma Pedagógica y Administrativa Integral</p>
            </div>

            {error && (
              <div className="p-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-xs font-semibold">
                ⚠️ {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Usuario</label>
                <input
                  type="text"
                  required
                  value={usuario}
                  onChange={(e) => setUsuario(e.target.value)}
                  className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/30 focus:border-amber-500"
                  placeholder="ej. edgar, marycruz, ceci, zuemmy"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Contraseña</label>
                <input
                  type="password"
                  required
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/30 focus:border-amber-500"
                  placeholder="Tu contraseña institucional"
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold text-sm shadow-md transition flex items-center justify-center space-x-2 disabled:opacity-50"
              >
                {loading ? <span>Iniciando sesión...</span> : <span>Entrar al Sistema →</span>}
              </button>
            </form>

            <div className="border-t border-slate-100 pt-4 text-center">
              <span className="text-[11px] text-slate-400">
                Acceso exclusivo para personal de USAER 02-E · Zona 001 Primarias
              </span>
            </div>
          </div>
        </div>
      );
    }

    // =============================================================
    // COMPONENTE PRINCIPAL (APP CON NAVEGACIÓN COMPLETA DE MÓDULOS)
    // =============================================================
    function App() {
      const [user, setUser] = useState(() => {
        try {
          const u = sessionStorage.getItem('usaer_user');
          const t = sessionStorage.getItem('usaer_token');
          return u && t ? JSON.parse(u) : null;
        } catch {
          return null;
        }
      });

      const [currentView, setCurrentView] = useState('mis_documentos');
      const [activeDocId, setActiveDocId] = useState(null);
      const [activeAlumnoId, setActiveAlumnoId] = useState(null);
      const [metrics, setMetrics] = useState({ latency: 12, requests: 1 });
      const [dropdownOpen, setDropdownOpen] = useState(false);
      const [notificacionEnVivo, setNotificacionEnVivo] = useState(null);

      // Sincronización en vivo entre sesiones concurrentes (Cero Recargas)
      useEffect(() => {
        if (!user) return;
        let lastTs = Date.now() / 1000;
        const poller = setInterval(async () => {
          try {
            const data = await apiRequest(`/api/novedades-en-vivo?desde=${lastTs}`);
            if (data && Array.isArray(data.novedades) && data.novedades.length > 0) {
              lastTs = data.servidor_tiempo || (Date.now() / 1000);
              const ult = data.novedades[data.novedades.length - 1];
              if (ult && ult.usuario !== user.usuario) {
                setNotificacionEnVivo(`🔄 ${ult.resumen || 'Cambio registrado en plataforma'}`);
                setTimeout(() => setNotificacionEnVivo(null), 6000);
              }
            }
          } catch (_) {}
        }, 6000);
        return () => clearInterval(poller);
      }, [user]);

      useEffect(() => {
        const handleAuthExpired = () => {
          sessionStorage.clear();
          setUser(null);
        };
        window.addEventListener('auth_expired', handleAuthExpired);

        let idleTimer;
        const resetIdle = () => {
          clearTimeout(idleTimer);
          idleTimer = setTimeout(() => {
            sessionStorage.clear();
            setUser(null);
          }, 45 * 60 * 1000);
        };
        window.addEventListener('mousemove', resetIdle);
        window.addEventListener('keydown', resetIdle);
        window.addEventListener('click', resetIdle);
        resetIdle();

        return () => {
          window.removeEventListener('auth_expired', handleAuthExpired);
          clearTimeout(idleTimer);
          window.removeEventListener('mousemove', resetIdle);
          window.removeEventListener('keydown', resetIdle);
          window.removeEventListener('click', resetIdle);
        };
      }, []);

      const handleLoginSuccess = (userData, token) => {
        sessionStorage.setItem('usaer_token', token);
        sessionStorage.setItem('usaer_user', JSON.stringify(userData));
        setUser(userData);
      };

      const handleLogout = async () => {
        try {
          await apiRequest('/api/auth/logout', { method: 'POST' });
        } catch (_) {}
        sessionStorage.clear();
        setUser(null);
      };

      const navigateTo = (view) => {
        setCurrentView(view);
        setDropdownOpen(false);
      };

      if (!user) {
        return <LoginScreen onLoginSuccess={handleLoginSuccess} />;
      }

      return (
        <div className="flex flex-col min-h-screen">
          {/* Barra de Navegación Superior Inmediata */}
          <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
              <div
                className="flex items-center space-x-3 cursor-pointer"
                onClick={() => navigateTo('mis_documentos')}
              >
                <span className="text-amber-500 font-black text-xl">◈</span>
                <span className="font-bold tracking-tight text-slate-100 text-lg">USAER 02-E</span>
                <span className="bg-slate-800 text-slate-400 text-xs px-2 py-0.5 rounded font-semibold hidden sm:inline">
                  Zona 001 · SPA 2.0
                </span>
              </div>

              {/* Menú de Navegación Rápido + Menú Desplegable con Todos los Módulos */}
              <nav className="hidden md:flex items-center space-x-1 text-sm font-medium">
                <button
                  onClick={() => navigateTo('mis_documentos')}
                  className={`px-3 py-1.5 rounded-lg transition ${
                    currentView === 'mis_documentos' ? 'bg-slate-800 text-amber-400 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  📁 Mis Documentos
                </button>
                <button
                  onClick={() => navigateTo('expedientes')}
                  className={`px-3 py-1.5 rounded-lg transition ${
                    currentView === 'expedientes' ? 'bg-slate-800 text-amber-400 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  👤 Alumnos y Expedientes
                </button>
                <button
                  onClick={() => navigateTo('epp')}
                  className={`px-3 py-1.5 rounded-lg transition ${
                    currentView === 'epp' ? 'bg-slate-800 text-amber-400 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  📋 EPP
                </button>

                {/* Dropdown de Todos los Módulos */}
                <div className="relative">
                  <button
                    onClick={() => setDropdownOpen(!dropdownOpen)}
                    className="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white bg-slate-800/60 hover:bg-slate-800 transition flex items-center space-x-1"
                  >
                    <span>Todos los Módulos</span>
                    <span className="text-xs">▾</span>
                  </button>

                  {dropdownOpen && (
                    <div className="absolute left-0 mt-2 w-80 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl py-2 z-50 text-xs grid grid-cols-2 gap-1 p-2">
                      <div className="col-span-2 px-2 py-1 text-[10px] uppercase font-bold text-amber-400 tracking-wider border-b border-slate-800 mb-1">
                        Área Pedagógica y Anexos
                      </div>
                      <button onClick={() => navigateTo('anexo3')} className="p-2 text-left hover:bg-slate-800 rounded-lg text-slate-300 hover:text-amber-300 transition">
                        🚧 Anexo III BAP
                      </button>
                      <button onClick={() => navigateTo('anexo4')} className="p-2 text-left hover:bg-slate-800 rounded-lg text-slate-300 hover:text-amber-300 transition">
                        💡 Anexo IV Sugerencias
                      </button>
                      <button onClick={() => navigateTo('anexo5')} className="p-2 text-left hover:bg-slate-800 rounded-lg text-slate-300 hover:text-amber-300 transition">
                        📌 Anexo V Eventos
                      </button>
                      <button onClick={() => navigateTo('anexo7')} className="p-2 text-left hover:bg-slate-800 rounded-lg text-slate-300 hover:text-amber-300 transition">
                        📑 Anexo VII Derivación
                      </button>
                      <button onClick={() => navigateTo('informes')} className="p-2 text-left hover:bg-slate-800 rounded-lg text-slate-300 hover:text-amber-300 transition">
                        📄 Informes
                      </button>

                      <div className="col-span-2 px-2 py-1 text-[10px] uppercase font-bold text-amber-400 tracking-wider border-b border-slate-800 my-1">
                        Organización y Gestión
                      </div>
                      <button onClick={() => navigateTo('horarios')} className="p-2 text-left hover:bg-slate-800 rounded-lg text-slate-300 hover:text-amber-300 transition">
                        ⏰ Horarios de Apoyo
                      </button>
                      <button onClick={() => navigateTo('cronogramas')} className="p-2 text-left hover:bg-slate-800 rounded-lg text-slate-300 hover:text-amber-300 transition">
                        📅 Cronograma Mensual
                      </button>
                      <button onClick={() => navigateTo('calendario')} className="p-2 text-left hover:bg-slate-800 rounded-lg text-slate-300 hover:text-amber-300 transition">
                        🗓️ Calendario SEGEY
                      </button>
                      <button onClick={() => navigateTo('docentes_regulares')} className="p-2 text-left hover:bg-slate-800 rounded-lg text-slate-300 hover:text-amber-300 transition">
                        👥 Maestros Primaria
                      </button>
                      <button onClick={() => navigateTo('novedades')} className="p-2 text-left hover:bg-slate-800 rounded-lg text-slate-300 hover:text-amber-300 transition">
                        📢 Supervisión Zona 001
                      </button>
                      <button onClick={() => navigateTo('juntas')} className="p-2 text-left hover:bg-slate-800 rounded-lg text-slate-300 hover:text-amber-300 transition">
                        🤝 Juntas y Relatorías
                      </button>
                      <button onClick={() => navigateTo('metas')} className="p-2 text-left hover:bg-slate-800 rounded-lg text-slate-300 hover:text-amber-300 transition">
                        🎯 Metas Personales
                      </button>
                      <button onClick={() => navigateTo('tramites')} className="p-2 text-left hover:bg-slate-800 rounded-lg text-slate-300 hover:text-amber-300 transition">
                        📨 Trámites
                      </button>

                      <div className="col-span-2 px-2 py-1 text-[10px] uppercase font-bold text-amber-400 tracking-wider border-b border-slate-800 my-1">
                        Institucional y Dirección
                      </div>
                      <button onClick={() => navigateTo('visitas')} className="p-2 text-left hover:bg-slate-800 rounded-lg text-slate-300 hover:text-amber-300 transition">
                        📋 Actas y Oficios
                      </button>
                      <button onClick={() => navigateTo('estadisticas')} className="p-2 text-left hover:bg-slate-800 rounded-lg text-slate-300 hover:text-amber-300 transition">
                        📊 Estadísticas Zona
                      </button>
                    </div>
                  )}
                </div>
              </nav>

              <div className="flex items-center space-x-3">
                <div className="hidden sm:flex items-center space-x-1.5 text-xs bg-slate-800/80 px-2.5 py-1 rounded border border-slate-700/50">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="text-slate-400">Latencia:</span>
                  <strong className="text-emerald-300 font-mono">{metrics.latency} ms</strong>
                </div>

                <div className="flex items-center space-x-2">
                  <div className="text-right text-xs hidden lg:block">
                    <div className="font-semibold text-slate-200">{user.nombre}</div>
                    <div className="text-slate-400">{user.rol}</div>
                  </div>
                  <button
                    onClick={handleLogout}
                    className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded border border-slate-700 transition"
                    title="Cerrar sesión"
                  >
                    Salir
                  </button>
                </div>
              </div>
            </div>
          </header>

          {notificacionEnVivo && (
            <div className="bg-amber-500 text-slate-950 font-bold text-xs py-2 px-4 text-center sticky top-14 z-50 shadow-md flex items-center justify-center space-x-2">
              <span>{notificacionEnVivo}</span>
              <button onClick={() => setNotificacionEnVivo(null)} className="ml-2 underline text-[11px] font-normal hover:text-white">Cerrar</button>
            </div>
          )}

          {/* Área Principal de Contenido SPA */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6" onClick={() => dropdownOpen && setDropdownOpen(false)}>
            {currentView === 'mis_documentos' && (
              <MisDocumentosView
                onOpenDoc={(id) => {
                  setActiveDocId(id);
                  setCurrentView('editor');
                }}
                onOpenExpediente={(id) => {
                  setActiveAlumnoId(id);
                  setCurrentView('expedientes');
                }}
                setMetrics={setMetrics}
              />
            )}

            {currentView === 'editor' && (
              <PlaneacionEditorView
                docId={activeDocId}
                user={user}
                onBack={() => setCurrentView('mis_documentos')}
                setMetrics={setMetrics}
              />
            )}

            {currentView === 'expedientes' && (
              <ExpedientesView
                initialAlumnoId={activeAlumnoId}
                onBack={() => setCurrentView('mis_documentos')}
                setMetrics={setMetrics}
              />
            )}

            {currentView === 'epp' && (
              <EPPView
                onBack={() => setCurrentView('mis_documentos')}
                onOpenAlumno={(id) => {
                  setActiveAlumnoId(id);
                  setCurrentView('expedientes');
                }}
                setMetrics={setMetrics}
              />
            )}

            {currentView === 'anexo3' && (
              <Anexo3View onBack={() => setCurrentView('mis_documentos')} setMetrics={setMetrics} />
            )}

            {currentView === 'anexo4' && (
              <Anexo4View onBack={() => setCurrentView('mis_documentos')} setMetrics={setMetrics} />
            )}

            {currentView === 'anexo5' && (

            apiRequest('/api/alumnos')
          ]);
          setPlaneaciones(planesData);
          setAlumnos(alumnosData);

    // =============================================================
    // VISTA 2: EDITOR DE PLANEACIÓN COMPATIBLE CON STREAMLIT + SPA
    // =============================================================
    function PlaneacionEditorView({ docId, user, onBack, setMetrics }) {
      const [doc, setDoc] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('aprendizajes');
      const [saveStatus, setSaveStatus] = useState('saved');
      const [conflictError, setConflictError] = useState(null);
      const [assistantOpen, setAssistantOpen] = useState(false);
      const [activeAlumnoId, setActiveAlumnoId] = useState('');
      const [borradorDisponible, setBorradorDisponible] = useState(null);
      const debounceTimer = useRef(null);

      const fetchDoc = useCallback(async () => {
        setLoading(true);
        setConflictError(null);
        const t0 = performance.now();
        try {
          const data = await apiRequest(`/api/planeaciones/${docId}`);
          setDoc(data);
          try {
            const draftRaw = localStorage.getItem(`usaer_borrador_plan_${docId}`);
            if (draftRaw) {
              const draft = JSON.parse(draftRaw);
              if (draft && draft.id === docId && draft.metadatos?.titulo) {
                setBorradorDisponible(draft);
              }
            }
          } catch (_) {}
          const t1 = performance.now();
          setMetrics(m => ({ latency: Math.round(t1 - t0), requests: m.requests + 1 }));
        } catch (e) {
          console.error("Error abriendo planeación:", e);
        } finally {
          setLoading(false);
        }
      }, [docId, setMetrics]);

      useEffect(() => {
        fetchDoc();
      }, [fetchDoc]);

      // Alumnos vinculados en la planeación (tolerante a estructuras nulas)
      const alumnosEnPlaneacion = useMemo(() => {
        if (!doc) return [];
        const map = new Map();
        try {
          if (Array.isArray(doc.datos?.Alumnos)) {
            doc.datos.Alumnos.forEach(a => {
              if (!a) return;
              const id = a.ID_Alumno || a.id || a.id_alumno || '';
              const nom = a.Nombre_Completo || a.nombre || a.alumno || id;
              if (id) map.set(id, { id, nombre: nom });
            });
          }
          const tNee = doc.tablas?.nee || doc.tablas?.aprendizajes || doc.tablas?.["Tabla principal"] || [];
          if (Array.isArray(tNee)) {
            tNee.forEach(row => {
              if (!row) return;
              const id = row.id_alumno || row.ID_Alumno || '';
              const nom = row.alumno || row.Alumno || row.nombre_completo || '';
              if (id && !map.has(id)) {
                map.set(id, { id, nombre: nom || id });
              } else if (nom && !map.has(nom)) {
                map.set(nom, { id: id || nom, nombre: nom });
              }
            });
          }
        } catch (err) {
          console.warn("Aviso computando alumnos en planeación:", err);
        }
        return Array.from(map.values());
      }, [doc]);

      useEffect(() => {
        if (alumnosEnPlaneacion.length > 0 && !activeAlumnoId) {
          setActiveAlumnoId(alumnosEnPlaneacion[0].id);
        }
      }, [alumnosEnPlaneacion, activeAlumnoId]);

      const persistir = useCallback(async (docActual) => {
        if (!navigator.onLine) {
          setSaveStatus('offline');
          return;
        }
        setSaveStatus('saving');
        setConflictError(null);
        const t0 = performance.now();
        try {
          const res = await apiRequest('/api/planeaciones', {
            method: 'POST',
            body: JSON.stringify(docActual)
          });
          setSaveStatus('saved');
          try { localStorage.removeItem(`usaer_borrador_plan_${docId}`); } catch (_) {}
          setBorradorDisponible(null);
          const t1 = performance.now();
          setMetrics(m => ({ latency: Math.round(t1 - t0), requests: m.requests + 1 }));
          setDoc(d => ({
            ...d,
            revision: res.revision,
            guardado_en: res.guardado_en,
            firmas_resueltas: res.firmas,
            metadatos: res.metadatos || d.metadatos
          }));
        } catch (e) {
          console.error("Error al persistir:", e);
          if (e.message && e.message.includes('Conflicto de concurrencia')) {
            setSaveStatus('conflict');
            setConflictError(e.message);
          } else {
            setSaveStatus('error');
          }
        }
      }, [setMetrics]);

      const mutarDoc = (updater) => {
        setDoc(prev => {
          const next = typeof updater === 'function' ? updater(prev) : { ...prev, ...updater };
          setSaveStatus('dirty');
          try {
            localStorage.setItem(`usaer_borrador_plan_${docId}`, JSON.stringify(next));
          } catch (_) {}
          return next;
        });
      };

      useEffect(() => {
        if (saveStatus === 'dirty') {
          if (debounceTimer.current) clearTimeout(debounceTimer.current);
          debounceTimer.current = setTimeout(() => {
            persistir(doc);
          }, 1500);
        }
        return () => {
          if (debounceTimer.current) clearTimeout(debounceTimer.current);
        };
      }, [doc, saveStatus, persistir]);

      if (loading || !doc) {
        return (
          <div className="text-center py-24 bg-white rounded-xl border border-slate-200">
            <div className="inline-block animate-spin text-amber-600 text-3xl mb-3">◈</div>
            <p className="text-slate-600 text-sm font-medium">Abriendo planeación oficial...</p>
          </div>
        );
      }

      // Compatibilidad canónica con todas las variantes de Streamlit
      const tablaNEE = doc.tablas?.nee || doc.tablas?.aprendizajes || doc.tablas?.["Tabla principal"] || [];
      const tablaDosificacion = doc.tablas?.dosificacion || [];

      return (
        <div className="space-y-4">
          {borradorDisponible && (
            <div className="bg-amber-50 border border-amber-300 p-3 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between text-xs text-amber-900 gap-2">
              <div>
                <span className="font-bold">⚠️ Borrador local detectado:</span> Tienes una versión previa no sincronizada en este dispositivo.
              </div>
              <div className="flex space-x-2">
                <button
                  onClick={() => { setDoc(borradorDisponible); setBorradorDisponible(null); setSaveStatus('dirty'); }}
                  className="bg-amber-600 text-white px-3 py-1 rounded-lg font-bold hover:bg-amber-700 transition"
                >
                  Restaurar Borrador
                </button>
                <button
                  onClick={() => { try { localStorage.removeItem(`usaer_borrador_plan_${docId}`); } catch(_) {} setBorradorDisponible(null); }}
                  className="bg-slate-200 text-slate-700 px-3 py-1 rounded-lg hover:bg-slate-300 transition"
                >
                  Descartar
                </button>
              </div>
            </div>
          )}
          <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div className="flex items-center space-x-3">
              <button
                onClick={onBack}
                className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-700 text-xs font-semibold transition"
              >
                ← Volver a Mis Documentos
              </button>
              <div>
                <input
                  type="text"

                      <div className="text-xs text-amber-700 uppercase font-bold">Vo. Bo. Dirección USAER</div>
                      <div className="font-bold text-slate-900 text-sm">
                        {doc.firmas_resueltas?.vo_bo || 'Psic. Edgar Adrián Yam Briceño MD'}
                      </div>
                      <div className="text-[11px] text-slate-500">Director USAER 02-E</div>
                    </div>
                  </div>

                  {doc.observaciones_director && (
                    <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs space-y-1">
                      <div className="font-bold text-slate-800">Observaciones del Director:</div>
                      <div className="text-slate-600">{doc.observaciones_director}</div>
                    </div>
                  )}
                </div>
              )}
            </div>

            {assistantOpen && (
              <div className="w-80 md:w-96 bg-white border border-slate-200 rounded-xl shadow-lg p-4 flex flex-col h-[520px]">
                <div className="mb-2 pb-2 border-b border-slate-100 flex items-center justify-between">
                  <span className="text-xs font-bold text-slate-700">Enfoque de Alumno:</span>
                  <select
                    value={activeAlumnoId}
                    onChange={(e) => setActiveAlumnoId(e.target.value)}
                    className="text-xs font-semibold bg-amber-50 border border-amber-300 rounded px-2 py-1 max-w-[200px] truncate"
                  >
                    {alumnosEnPlaneacion.length > 0 ? (
                      alumnosEnPlaneacion.map(a => (
                        <option key={a.id} value={a.id}>{a.nombre}</option>
                      ))
                    ) : (
                      <option value="">(Sin alumno asignado)</option>
                    )}
                  </select>
                </div>
                <PedagogicalChatComponent
                  alumnoId={activeAlumnoId}
                  onInsertProposal={(propuesta) => {
                    mutarDoc(d => {
                      const aluNom = propuesta.alumno || alumnosEnPlaneacion.find(a => a.id === activeAlumnoId)?.nombre || 'Alumno';
                      const nuevaFila = {
                        alumno: aluNom,
                        Alumno: aluNom,
                        id_alumno: activeAlumnoId,
                        barreras_o_necesidades: propuesta.barrera || propuesta.barreras_o_necesidades || 'Barrera identificada',
                        'Necesidades educativas específicas': propuesta.barrera || propuesta.barreras_o_necesidades || 'Barrera identificada',
                        pda: propuesta.pda || propuesta.aprendizaje || '',
                        'Aprendizaje y/u objetivo': propuesta.pda || propuesta.aprendizaje || '',
                        descriptor: propuesta.descriptor || propuesta.descriptor_observable || 'El alumno demuestra desempeño observable.',
                        'Descriptor de logro': propuesta.descriptor || propuesta.descriptor_observable || 'El alumno demuestra desempeño observable.',
                        'Descriptor Observable': propuesta.descriptor || propuesta.descriptor_observable || 'El alumno demuestra desempeño observable.',
                        apoyos: propuesta.apoyos || propuesta.ajustes_razonables || 'Apoyos visuales y estructurados.',
                        'Apoyos y Ajustes': propuesta.apoyos || propuesta.ajustes_razonables || 'Apoyos visuales y estructurados.',
                      };
                      return {
                        ...d,
                        tablas: {
                          ...d.tablas,
                          nee: [...tablaNEE, nuevaFila],
                          aprendizajes: [...tablaNEE, nuevaFila]
                        }
                      };
                    });
                  }}
                />
              </div>
            )}
          </div>
        </div>
      );
    }

    // =============================================================
    // COMPONENTE: ASISTENTE PEDAGÓGICO IA
    // =============================================================
    function PedagogicalChatComponent({ alumnoId, onInsertProposal }) {
      const [messages, setMessages] = useState([
        {
          sender: 'ai',
          text: 'Hola. Soy el Asistente Pedagógico de USAER 02-E. Puedo sugerir descriptores observables para tus alumnos alineados a los 14 indicadores de la Zona 001. ¿En qué aprendizaje o ajuste estás trabajando?'
        }
      ]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [lastProposal, setLastProposal] = useState(null);

      const handleSend = async (e) => {
        if (e) e.preventDefault();
        if (!input.trim()) return;

        const userMsg = input.trim();
        setMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
        setInput('');
        setLoading(true);

        try {
          const res = await apiRequest('/api/ai/chat', {
            method: 'POST',
            body: JSON.stringify({ mensaje: userMsg, alumno_id: alumnoId })
          });
          setMessages(prev => [...prev, { sender: 'ai', text: res.respuesta }]);
          if (res.propuesta_tabla) {
            setLastProposal(res.propuesta_tabla);
          }
        } catch (err) {
          setMessages(prev => [...prev, { sender: 'ai', text: 'Error consultando el motor pedagógico.' }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="flex flex-col h-full space-y-3">
          <div className="flex justify-between items-center border-b border-slate-100 pb-2">
            <div className="flex items-center space-x-2">
              <span className="text-amber-600 font-bold">🤖</span>
              <span className="font-bold text-xs text-slate-800">Asistente Pedagógico Zona 001</span>
            </div>
            <span className="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">Activo</span>
          </div>

          <div className="flex-1 overflow-y-auto space-y-2 text-xs pr-1">
            {messages.map((m, idx) => (
              <div
                key={idx}
                className={`p-2.5 rounded-xl ${
                  m.sender === 'user' ? 'bg-amber-600 text-white ml-6 font-medium' : 'bg-slate-50 text-slate-800 mr-2 border border-slate-200'
                }`}
              >
                <div className="whitespace-pre-wrap">{m.text}</div>
              </div>
            ))}
            {loading && (
              <div className="p-2.5 bg-slate-50 rounded-xl text-slate-400 text-xs italic">
                Elaborando propuesta contextualizada...
              </div>
            )}
          </div>

          {lastProposal && (
            <div className="p-2 bg-amber-50 border border-amber-200 rounded-lg text-xs space-y-1.5">
              <div className="font-bold text-amber-900 text-[11px]">Propuesta lista para insertar:</div>
              <div className="text-slate-600 text-[11px] truncate">"{lastProposal.descriptor}"</div>
              <button
                onClick={() => {
                  onInsertProposal(lastProposal);
                  setLastProposal(null);
                }}
                className="w-full py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded font-bold text-xs shadow-sm transition"
              >
                + Insertar en Planeación (1 Clic)
              </button>
            </div>
          )}

          <form onSubmit={handleSend} className="flex gap-2">
            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              placeholder="Instrucción pedagógica..."
              className="flex-1 px-3 py-2 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-amber-500"
            />
            <button
              type="submit"
              disabled={loading}
              className="px-3 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800 transition disabled:opacity-50"
            >
              Enviar
            </button>
          </form>
        </div>
      );
    }

    // =============================================================
    // VISTA 3: EXPEDIENTES INTEGRALES (307 ALUMNOS, LÍNEA DE TIEMPO)
    // =============================================================
    function ExpedientesView({ initialAlumnoId, onBack, setMetrics }) {
      const [alumnos, setAlumnos] = useState([]);
      const [loadingAlumnos, setLoadingAlumnos] = useState(true);
      const [errorAlumnos, setErrorAlumnos] = useState(null);
      const [busqueda, setBusqueda] = useState('');
      const [filtroMaestra, setFiltroMaestra] = useState('TODAS');
      const [selectedId, setSelectedId] = useState(initialAlumnoId || null);
      const [expediente, setExpediente] = useState(null);
      const [loadingExp, setLoadingExp] = useState(false);
      const [activeExpTab, setActiveExpTab] = useState('resumen');

      useEffect(() => {
        setLoadingAlumnos(true);
        setErrorAlumnos(null);
        apiRequest('/api/alumnos')
          .then(data => {
            const list = Array.isArray(data) ? data : [];
            setAlumnos(list);
            setLoadingAlumnos(false);
            if (!selectedId && list.length > 0) {
              setSelectedId(list[0].id);
            }
          })
          .catch(err => {
            console.error("Error al cargar padrón de alumnos:", err);
            setErrorAlumnos(err.message || 'Error cargando padrón');
            setLoadingAlumnos(false);
          });
      }, []);

      useEffect(() => {
        if (!selectedId) return;
        setLoadingExp(true);
        const t0 = performance.now();
        apiRequest(`/api/expedientes/${selectedId}`)
          .then(exp => {
            setExpediente(exp);
            const t1 = performance.now();
            setMetrics(m => ({ latency: Math.round(t1 - t0), requests: m.requests + 1 }));
            setLoadingExp(false);
          })
          .catch(() => setLoadingExp(false));
      }, [selectedId, setMetrics]);

      const maestrasDisponibles = Array.from(new Set(
        alumnos.map(a => a.maestra_apoyo || a['Maestra de Apoyo']).filter(Boolean)
      )).sort();

      const alumnosFiltrados = alumnos.filter(al => {
        const nom = (al.nombre_completo || al.Nombre_Completo || al.nombre || '').toLowerCase();
        const curp = (al.curp || al.CURP || '').toLowerCase();
        const esc = (al.escuela || al.Nombre_Escuela || al.Escuela || '').toLowerCase();
        const q = (busqueda || '').toLowerCase();
        const matchesBusqueda = !q || nom.includes(q) || curp.includes(q) || esc.includes(q);
        const m = al.maestra_apoyo || al['Maestra de Apoyo'] || '';
        const matchesMaestra = filtroMaestra === 'TODAS' || m === filtroMaestra;
        return matchesBusqueda && matchesMaestra;
      });

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <button onClick={onBack} className="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-700 font-semibold transition">
                ← Volver a Mis Documentos
              </button>
              <h1 className="text-2xl font-bold tracking-tight text-slate-900">Expedientes de Alumnos</h1>
            </div>
            <a
              href={`${API_BASE}/api/alumnos/exportar`}
              className="text-xs px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg border border-slate-300 transition"
            >
              Exportar Padrón CSV 📥
            </a>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Lista Izquierda de Alumnos */}
            <div className="lg:col-span-4 bg-white p-4 rounded-xl border border-slate-200 space-y-3 self-start">
              <div className="flex justify-between items-center">
                <h3 className="font-bold text-xs uppercase text-slate-500 tracking-wider">Matrícula de Atención</h3>
                <span className="text-[11px] font-bold bg-amber-50 text-amber-800 px-2 py-0.5 rounded-full border border-amber-200">
                  {alumnosFiltrados.length} alumnos
                </span>
              </div>

              <input
                type="text"
                placeholder="Buscar por nombre, CURP, escuela..."
                value={busqueda}
                onChange={e => setBusqueda(e.target.value)}
                className="w-full text-xs p-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-1 focus:ring-amber-500"
              />

              {maestrasDisponibles.length > 1 && (
                <div className="space-y-1">
                  <label className="text-[10px] uppercase font-bold text-slate-400">Filtrar por Maestra:</label>
                  <select
                    value={filtroMaestra}
                    onChange={e => setFiltroMaestra(e.target.value)}
                    className="w-full text-xs p-1.5 rounded-lg border border-slate-200 bg-slate-50 font-medium text-slate-700 focus:outline-none"
                  >
                    <option value="TODAS">Todas las maestras de la escuela</option>
                    {maestrasDisponibles.map(m => (
                      <option key={m} value={m}>{m}</option>
                    ))}
                  </select>
                </div>
              )}

              {loadingAlumnos ? (
                <div className="text-center py-8 text-xs text-slate-400">Cargando matrícula de atención...</div>
              ) : errorAlumnos ? (
                <div className="text-center py-6 text-xs text-red-500 bg-red-50 rounded-lg p-3">
                  <div>⚠️ {errorAlumnos}</div>
                  <button onClick={() => location.reload()} className="mt-2 text-[11px] underline font-bold text-amber-700">Reintentar</button>
                </div>
              ) : alumnosFiltrados.length === 0 ? (
                <div className="text-center py-8 text-xs text-slate-400">
                  No se encontraron alumnos para tu escuela o criterio de búsqueda.
                </div>
              ) : (
                <div className="space-y-1.5 max-h-96 overflow-y-auto pr-1">
                  {alumnosFiltrados.map(al => (
                    <div
                      key={al.id}
                      onClick={() => setSelectedId(al.id)}
                      className={`p-2.5 rounded-lg text-xs cursor-pointer transition ${
                        selectedId === al.id ? 'bg-amber-100/70 border border-amber-300 font-bold text-slate-900' : 'hover:bg-slate-50 text-slate-700'
                      }`}
                    >
                      <div>{al.nombre_completo || al.Nombre_Completo}</div>
                      <div className="text-[11px] text-slate-500">{al.grado}° {al.grupo} • {al.escuela}</div>
                      <div className="text-[10px] text-amber-700 font-semibold mt-0.5">👤 {al.maestra_apoyo}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Vista Derecha del Expediente Integral */}
            <div className="lg:col-span-8 bg-white p-6 rounded-xl border border-slate-200 space-y-5">
              {loadingAlumnos ? (
                <div className="text-center py-16 text-slate-500 text-sm">Cargando padrón escolar...</div>
              ) : alumnos.length === 0 ? (
                <div className="text-center py-16 text-slate-500 text-sm">
                  <div className="text-2xl mb-2">📋</div>
                  <div className="font-bold text-slate-700">No hay alumnos asignados a este perfil o escuela.</div>
                  <div className="text-xs text-slate-400 mt-1">Si perteneces a una escuela específica, verifica haber iniciado sesión con tu cuenta correspondiente.</div>
                </div>
              ) : loadingExp || !expediente ? (
                <div className="text-center py-16 text-slate-500 text-sm">Cargando expediente integral desde base relacional...</div>
              ) : (
                <>
                  <div className="border-b border-slate-200 pb-4 flex justify-between items-start">
                    <div>
                      <h2 className="text-xl font-bold text-slate-900">{expediente.alumno?.nombre_completo}</h2>
                      <div className="text-xs text-slate-500 mt-1">
                        <span>ID: {expediente.alumno?.id}</span>
                        <span className="mx-2">•</span>
                        <span>CURP: {expediente.alumno?.curp || 'No registrada'}</span>
                        <span className="mx-2">•</span>
                        <span>{expediente.alumno?.escuela}</span>
                        <span className="mx-2">•</span>
                        <span>Grado: {expediente.alumno?.grado}° {expediente.alumno?.grupo}</span>
                      </div>
                    </div>
                    <span className="text-xs bg-amber-50 text-amber-800 font-bold px-3 py-1 rounded-full border border-amber-200">
                      {expediente.alumno?.condicion || 'Atención USAER'}
                    </span>
                  </div>

                  <div className="flex border-b border-slate-200 space-x-1 text-xs font-bold overflow-x-auto pb-1">
                    {[
                      { id: 'resumen', label: 'Resumen e Historia' },
                      { id: 'epp', label: 'Evaluación Psicopedagógica (EPP)' },
                      { id: 'bap', label: `BAP (${expediente.anexo3_bap?.length || 0})` },
                      { id: 'sugerencias', label: `Sugerencias (${expediente.anexo4_sugerencias?.length || 0})` },
                      { id: 'eventos', label: `Eventos (${expediente.anexo5_eventos?.length || 0})` },
                      { id: 'derivacion', label: 'Derivación y Salud' },
                    ].map(t => (
                      <button
                        key={t.id}
                        onClick={() => setActiveExpTab(t.id)}
                        className={`px-3 py-2 border-b-2 whitespace-nowrap transition ${
                          activeExpTab === t.id ? 'border-amber-600 text-amber-800 bg-amber-50/50' : 'border-transparent text-slate-400 hover:text-slate-700'
                        }`}
                      >
                        {t.label}
                      </button>
                    ))}
                  </div>

                  {activeExpTab === 'resumen' && (
                    <div className="space-y-4">
                      <div className="grid grid-cols-2 gap-4 text-xs">
                        <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-1">
                          <div className="font-bold text-slate-700">Maestra de Apoyo Asignada</div>
                          <div className="text-slate-900">{expediente.alumno?.maestra_apoyo || 'Por asignar'}</div>
                        </div>
                        <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-1">
                          <div className="font-bold text-slate-700">Tipo de Atención</div>
                          <div className="text-slate-900">{expediente.alumno?.tipo_atencion || 'Atención Focalizada'}</div>
                        </div>
                        <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-1">
                          <div className="font-bold text-slate-700">Turno y CCT</div>
                          <div className="text-slate-900">{expediente.alumno?.turno} • {expediente.alumno?.cct}</div>
                        </div>
                        <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-1">
                          <div className="font-bold text-slate-700">Documentos Vinculados</div>
                          <div className="text-amber-700 font-bold">{expediente.total_documentos} registros en expediente</div>
                        </div>
                      </div>

                      {/* Línea de Tiempo del Alumno */}
                      {expediente.linea_tiempo && expediente.linea_tiempo.length > 0 && (
                        <div className="pt-2 space-y-2">
                          <h4 className="text-xs font-bold uppercase text-slate-600">📜 Línea de Tiempo del Expediente ({expediente.linea_tiempo.length})</h4>

                            {expediente.linea_tiempo.map((lt, idx) => (
                              <div key={idx} className="p-2.5 bg-slate-50 rounded-lg border border-slate-200 text-xs flex justify-between items-start">
                                <div>
                                  <div className="font-semibold text-slate-800">{lt.tipo || lt.evento || 'Evento de Expediente'}</div>
                                  <div className="text-slate-600 text-[11px] mt-0.5">{lt.descripcion || lt.detalle || ''}</div>
                                </div>
                                <span className="text-[10px] text-slate-400 font-mono ml-3">{lt.fecha || '2026-2027'}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                    <div className="space-y-3 text-xs">
                      {expediente.epp ? (
                        <div className="space-y-3">
                          <div className="flex justify-between items-center text-slate-500">
                            <span>Ciclo Escolar: {expediente.epp.ciclo}</span>
                            <span>Revisión: {expediente.epp.revision}</span>
                          </div>
                          {Object.entries(expediente.epp.partes || {}).map(([area, datos]) => {
                            if (area === 'META') return null;
                            return (
                              <div key={area} className="p-3.5 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                                <div className="font-bold text-slate-900 uppercase tracking-wider text-[11px] text-amber-700">
                                  Área: {area}
                                </div>
                                {typeof datos === 'object' ? (
                                  Object.entries(datos).map(([k, v]) => (
                                    <div key={k} className="text-slate-700">
                                      <strong className="text-slate-800">{k.replace(/_/g, ' ')}:</strong> {String(v)}
                                    </div>
                                  ))
                                ) : (
                                  <div className="text-slate-700">{String(datos)}</div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      ) : (
                        <div className="text-center py-8 text-slate-500">No hay Evaluación Psicopedagógica cargada para este ciclo.</div>
                      )}
                    </div>
                  )}

                  {activeExpTab === 'bap' && (
                    <div className="space-y-2 text-xs">
                      {expediente.anexo3_bap?.map((b) => (

                            <span className="text-slate-400 font-normal">{b.fecha}</span>
                          </div>

                          {b.actitudinales && <div><strong>Actitudinales:</strong> {b.actitudinales}</div>}

                          {b.organizativas && <div><strong>Organizativas:</strong> {b.organizativas}</div>}

                      ))}

                    <div className="space-y-2 text-xs">

                    </div>
                  )}

                  {activeExpTab === 'eventos' && (
                    <div className="space-y-2 text-xs">
                      {expediente.anexo5_eventos?.map((ev) => (
                        <div key={ev.id} className="p-3 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-start">
