<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USAER 02-E · Sistema Pedagógico Integrado (Piloto SPA)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary: #0F172A;
      --accent: #D97706;
      --bg: #F8FAFC;
    }
    body {
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .badge-status {
      transition: all 0.2s ease-in-out;
    }
    /* Animación sutil de pulso para autoguardado */
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-saving {
      animation: pulse-subtle 1.2s infinite ease-in-out;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // -------------------------------------------------------------
    // SERVICIO API REST LOCAL (SUB-MILISEGUNDO)
    // -------------------------------------------------------------
    const API_BASE = window.location.origin;

    async function fetchAPI(endpoint, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        'X-User-Account': localStorage.getItem('usaer_user') || 'docente.apoyo@usaer2e.edu.mx',
        ...options.headers,
      };
      const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
      if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
      return await res.json();
    }

    // -------------------------------------------------------------
    // COMPONENTE PRINCIPAL APP
    // -------------------------------------------------------------
    function App() {
      const [view, setView] = useState('list'); // 'list' | 'editor'
      const [usuario, setUsuario] = useState({
        nombre: 'Mtra. Cindy Mayanín Burgos González',
        rol: 'MAESTRA DE APOYO',
        cuenta: 'docente.apoyo@usaer2e.edu.mx',
        director: false
      });
      const [planeaciones, setPlaneaciones] = useState([]);
      const [loadingList, setLoadingList] = useState(true);
      const [filtroTexto, setFiltroTexto] = useState('');
      const [currentDoc, setCurrentDoc] = useState(null);
      const [saveStatus, setSaveStatus] = useState('saved'); // 'saved' | 'saving' | 'dirty' | 'error'
      const [assistantOpen, setAssistantOpen] = useState(false);
      const [metrics, setMetrics] = useState({ latency: 0, requests: 0 });

      // Cargar lista de planeaciones al montar
      const loadPlaneaciones = useCallback(async () => {
        setLoadingList(true);
        const t0 = performance.now();
        try {
          const data = await fetchAPI('/api/planeaciones');
          setPlaneaciones(data);
          const t1 = performance.now();
          setMetrics(m => ({ ...m, latency: Math.round(t1 - t0), requests: m.requests + 1 }));
        } catch (err) {
          console.error("Error cargando planeaciones", err);
        } finally {
          setLoadingList(false);
        }
      }, []);

      useEffect(() => {
        loadPlaneaciones();
      }, [loadPlaneaciones]);

      // Abrir una planeación directamente en memoria (< 100ms)
      const openDoc = async (id) => {
        setSaveStatus('saved');
        const t0 = performance.now();
        try {
          const doc = await fetchAPI(`/api/planeaciones/${id}`);
          setCurrentDoc(doc);
          setView('editor');
          const t1 = performance.now();
          setMetrics(m => ({ ...m, latency: Math.round(t1 - t0), requests: m.requests + 1 }));
        } catch (err) {
          alert("Error abriendo documento: " + err.message);
        }
      };

      // Crear nuevo borrador
      const nuevoDoc = () => {
        const idNuevo = `plan-${Date.now().toString(36)}`;
        const docVacio = {
          id: idNuevo,
          formato: 'XXIII',
          estado: 'BORRADOR',
          revision: 'rev-nueva',
          datos: { Escuela: 'Damián Carmona', Grado_Grupo: '2° A', Alumnos: [] },
          metadatos: { titulo: 'Nueva Planeación de Apoyo' },
          tablas: {
            aprendizajes: [{ "Necesidades educativas específicas": "", "Aprendizaje y/u objetivo": "", "Descriptor de logro": "" }],
            dosificacion: [{ "Contextos": "Aula de apoyo", "Actividades": "", "Temporalidad": "Noviembre 2026", "Recursos": "" }]
          },
          textos: { "Evaluación": "", "Observaciones": "" },
          observaciones_director: ""
        };
        setCurrentDoc(docVacio);
        setSaveStatus('dirty');
        setView('editor');
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Cabecera Minimalista */}
          <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setView('list')}>
                <span className="text-amber-500 font-extrabold text-xl">◈</span>
                <span className="font-bold tracking-tight text-slate-100 text-lg">USAER 02-E</span>
                <span className="bg-slate-800 text-slate-400 text-xs px-2 py-0.5 rounded font-medium">Zona 001 · Piloto SPA</span>
              </div>

              <div className="flex items-center space-x-4">
                {/* Métricas de rendimiento en vivo */}
                <div className="hidden sm:flex items-center space-x-2 text-xs bg-slate-800/80 px-2.5 py-1 rounded border border-slate-700/50">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="text-slate-400">Latencia API:</span>
                  <strong className="text-emerald-300 font-mono">{metrics.latency} ms</strong>
                  <span className="text-slate-600">|</span>
                  <span className="text-slate-400">Peticiones:</span>
                  <strong className="text-slate-200 font-mono">{metrics.requests}</strong>
                </div>

                <div className="text-xs text-right">
                  <div className="font-semibold text-slate-200">{usuario.nombre}</div>
                  <div className="text-slate-400">{usuario.rol}</div>
                </div>
              </div>
            </div>
          </header>

          {/* Contenedor Principal */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
            {view === 'list' ? (
              <DocumentListView
                planeaciones={planeaciones}
                loading={loadingList}
                filtro={filtroTexto}
                setFiltro={setFiltroTexto}
                onOpen={openDoc}
                onNuevo={nuevoDoc}
                onRefresh={loadPlaneaciones}
              />
            ) : (
              <EditorView
                doc={currentDoc}
                setDoc={setCurrentDoc}
                saveStatus={saveStatus}
                setSaveStatus={setSaveStatus}
                onBack={() => { setView('list'); loadPlaneaciones(); }}
                assistantOpen={assistantOpen}
                setAssistantOpen={setAssistantOpen}
                setMetrics={setMetrics}
              />
            )}
          </main>

          {/* Pie de página sutil */}
          <footer className="border-t border-slate-200 bg-white py-3 text-center text-xs text-slate-400">
            USAER 02-E · Sistema Integral SPA · Entorno Piloto Seguro · Sin impacto en producción
          </footer>
        </div>
      );
    }

    // -------------------------------------------------------------
    // VISTA 1: LISTADO DE DOCUMENTOS Y MIS PLANEACIONES
    // -------------------------------------------------------------
    function DocumentListView({ planeaciones, loading, filtro, setFiltro, onOpen, onNuevo, onRefresh }) {
      const docsFiltrados = planeaciones.filter(p => {
        const busqueda = filtro.toLowerCase();
        const escuela = (p.datos?.Escuela || '').toLowerCase();
        const titulo = (p.metadatos?.titulo || p.id).toLowerCase();
        const formato = (p.formato || '').toLowerCase();
        return escuela.includes(busqueda) || titulo.includes(busqueda) || formato.includes(busqueda);
      });

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-bold tracking-tight text-slate-900">Mis Planeaciones e Intervención</h1>
              <p className="text-sm text-slate-500">Documentos activos y planes curriculares asignados</p>
            </div>
            <div className="flex items-center space-x-3">
              <button
                onClick={onRefresh}
                className="px-3 py-2 text-sm bg-white border border-slate-200 text-slate-700 rounded-lg hover:bg-slate-50 font-medium shadow-sm transition"
              >
                ↻ Actualizar
              </button>
              <button
                onClick={onNuevo}
                className="px-4 py-2 text-sm bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-semibold shadow-sm transition flex items-center space-x-2"
              >
                <span>+</span>
                <span>Nueva Planeación</span>
              </button>
            </div>
          </div>

          {/* Barra de Búsqueda Rápida en Memoria */}
          <div className="relative">
            <input
              type="text"
              value={filtro}
              onChange={(e) => setFiltro(e.target.value)}
              placeholder="Buscar por escuela, alumno, grado o contenido curricular..."
              className="w-full pl-4 pr-10 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 shadow-sm"
            />
            {filtro && (
              <button
                onClick={() => setFiltro('')}
                className="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-slate-600"
              >
                Limpiar
              </button>
            )}
          </div>

          {/* Tarjetas / Tabla de Documentos */}
          {loading ? (
            <div className="text-center py-16 bg-white rounded-xl border border-slate-200">
              <div className="inline-block animate-spin text-amber-600 text-2xl mb-2">◈</div>
              <p className="text-sm text-slate-500">Cargando documentos en memoria...</p>
            </div>
          ) : docsFiltrados.length === 0 ? (
            <div className="text-center py-16 bg-white rounded-xl border border-slate-200">
              <p className="text-slate-500 text-sm">No se encontraron documentos con el criterio ingresado.</p>
            </div>
          ) : (
            <div className="grid gap-3">
              {docsFiltrados.map((doc) => (
                <div
                  key={doc.id}
                  onClick={() => onOpen(doc.id)}
                  className="bg-white p-4 rounded-xl border border-slate-200 hover:border-amber-500/50 hover:shadow-md transition cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-3 group"
                >
                  <div className="space-y-1">
                    <div className="flex items-center space-x-2">
                      <span className="font-bold text-slate-900 group-hover:text-amber-700 transition">
                        {doc.metadatos?.titulo || `Planeación Anexo ${doc.formato}`}
                      </span>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider ${
                        doc.estado === 'AUTORIZADA' ? 'bg-emerald-100 text-emerald-800' :
                        doc.estado === 'REVISIÓN' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800'
                      }`}>
                        {doc.estado}
                      </span>
                    </div>
                    <div className="text-xs text-slate-500 flex items-center space-x-3">
                      <span>🏫 {doc.datos?.Escuela || 'Escuela sin asignar'}</span>
                      <span>•</span>
                      <span>Grado: {doc.datos?.Grado_Grupo || 'Varios'}</span>
                      <span>•</span>
                      <span>Guardado: {doc.guardado_en || 'Reciente'}</span>
                    </div>
                  </div>

                  <div className="flex items-center space-x-3">
                    {doc.observaciones_director && (
                      <span className="text-xs bg-slate-100 text-slate-700 px-2.5 py-1 rounded-md border border-slate-200 font-medium">
                        💬 Con observaciones
                      </span>
                    )}
                    <span className="text-xs font-semibold text-amber-600 group-hover:translate-x-1 transition-transform flex items-center space-x-1">
                      <span>Abrir editor</span>
                      <span>→</span>
                    </span>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------
    // VISTA 2: EDITOR MINIMALISTA CON AUTOGUARDADO DEBOUNCED
    // -------------------------------------------------------------
    function EditorView({ doc, setDoc, saveStatus, setSaveStatus, onBack, assistantOpen, setAssistantOpen, setMetrics }) {
      const [tab, setTab] = useState('aprendizajes'); // 'aprendizajes' | 'dosificacion' | 'textos' | 'firmas'
      const debounceTimer = useRef(null);

      // Mutación controlada del documento
      const updateDoc = (updater) => {
        setDoc(prev => {
          const next = typeof updater === 'function' ? updater(prev) : { ...prev, ...updater };
          setSaveStatus('dirty');
          return next;
        });
      };

      // Disparador de guardado persistente con debounce
      const persistirCambios = useCallback(async (docToSave) => {
        setSaveStatus('saving');
        const t0 = performance.now();
        try {
          const res = await fetchAPI('/api/planeaciones', {
            method: 'POST',
            body: JSON.stringify(docToSave)
          });
          setSaveStatus('saved');
          const t1 = performance.now();
          setMetrics(m => ({ ...m, latency: Math.round(t1 - t0), requests: m.requests + 1 }));
          // Guardar respaldo local de emergencia
          localStorage.setItem(`planeacion_${docToSave.id}`, JSON.stringify(docToSave));
        } catch (err) {
          console.error("Fallo de guardado:", err);
          setSaveStatus('error');
        }
      }, [setMetrics, setSaveStatus]);

      // Efecto debounce: si hay cambios sucios, guarda automáticamente a los 1.5s
      useEffect(() => {
        if (saveStatus === 'dirty') {
          if (debounceTimer.current) clearTimeout(debounceTimer.current);
          debounceTimer.current = setTimeout(() => {
            persistirCambios(doc);
          }, 1500);
        }
        return () => {
          if (debounceTimer.current) clearTimeout(debounceTimer.current);
        };
      }, [doc, saveStatus, persistirCambios]);

      // Manejadores para edición de celdas
      const updateAprendizaje = (index, field, value) => {
        updateDoc(d => {
          const rows = [...(d.tablas?.aprendizajes || [])];
          rows[index] = { ...rows[index], [field]: value };
          return { ...d, tablas: { ...d.tablas, aprendizajes: rows } };
        });
      };

      const addAprendizajeRow = () => {
        updateDoc(d => {
          const rows = [...(d.tablas?.aprendizajes || []), { "Necesidades educativas específicas": "", "Aprendizaje y/u objetivo": "", "Descriptor de logro": "" }];
          return { ...d, tablas: { ...d.tablas, aprendizajes: rows } };
        });
      };

      const removeAprendizajeRow = (idx) => {
        updateDoc(d => {
          const rows = d.tablas?.aprendizajes?.filter((_, i) => i !== idx) || [];
          return { ...d, tablas: { ...d.tablas, aprendizajes: rows } };
        });
      };

      return (
        <div className="space-y-4">
          {/* Barra superior de control del editor */}
          <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div className="flex items-center space-x-3">
              <button
                onClick={onBack}
                className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600 transition"
                title="Volver a la lista"
              >
                ← Volver
              </button>
              <div>
                <input
                  type="text"
                  value={doc.metadatos?.titulo || ''}
                  onChange={(e) => updateDoc(d => ({ ...d, metadatos: { ...d.metadatos, titulo: e.target.value } }))}
                  className="font-bold text-slate-900 text-lg border-b border-transparent hover:border-slate-300 focus:border-amber-500 focus:outline-none px-1"
                  placeholder="Título de la planeación"
                />
                <div className="text-xs text-slate-500 px-1">
                  <span>Escuela: {doc.datos?.Escuela}</span>
                  <span className="mx-2">•</span>
                  <span>Formato: Anexo {doc.formato}</span>
                </div>
              </div>
            </div>

            <div className="flex items-center space-x-3">
              {/* Indicador visual de guardado */}
              <div className="flex items-center space-x-2 text-xs font-medium px-3 py-1.5 rounded-lg border bg-slate-50 border-slate-200">
                {saveStatus === 'saved' && (
                  <>
                    <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span className="text-slate-600">Guardado en SQL</span>
                  </>
                )}
                {saveStatus === 'saving' && (
                  <>
                    <span className="w-2 h-2 rounded-full bg-amber-500 animate-saving"></span>
                    <span className="text-amber-700">Guardando cambios...</span>
                  </>
                )}
                {saveStatus === 'dirty' && (
                  <>
                    <span className="w-2 h-2 rounded-full bg-slate-400"></span>
                    <span className="text-slate-500">Cambios pendientes (autoguardado)...</span>
                  </>
                )}
                {saveStatus === 'error' && (
                  <>
                    <span className="w-2 h-2 rounded-full bg-rose-500"></span>
                    <span className="text-rose-600">Reintentando conexión...</span>
                  </>
                )}
              </div>

              {/* Botón Asistente IA */}
              <button
                onClick={() => setAssistantOpen(!assistantOpen)}
                className={`px-3 py-1.5 text-xs font-semibold rounded-lg border transition flex items-center space-x-1.5 ${
                  assistantOpen
                    ? 'bg-amber-100 border-amber-300 text-amber-900'
                    : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                }`}
              >
                <span>✨</span>
                <span>Asistente IA</span>
              </button>

              {/* Botón Guardar Forzado */}
              <button
                onClick={() => persistirCambios(doc)}
                className="px-4 py-1.5 text-xs font-semibold bg-slate-900 text-white hover:bg-slate-800 rounded-lg shadow-sm transition"
              >
                Guardar ahora
              </button>
            </div>
          </div>

          {/* Navegación por Pestañas del Documento */}
          <div className="flex border-b border-slate-200 space-x-4 text-sm font-medium">
            <button
              onClick={() => setTab('aprendizajes')}
              className={`pb-2.5 transition border-b-2 ${
                tab === 'aprendizajes' ? 'border-amber-600 text-amber-800 font-bold' : 'border-transparent text-slate-500 hover:text-slate-700'
              }`}
            >
              1. Necesidades y Aprendizajes
            </button>
            <button
              onClick={() => setTab('dosificacion')}
              className={`pb-2.5 transition border-b-2 ${
                tab === 'dosificacion' ? 'border-amber-600 text-amber-800 font-bold' : 'border-transparent text-slate-500 hover:text-slate-700'
              }`}
            >
              2. Dosificación de Actividades
            </button>
            <button
              onClick={() => setTab('textos')}
              className={`pb-2.5 transition border-b-2 ${
                tab === 'textos' ? 'border-amber-600 text-amber-800 font-bold' : 'border-transparent text-slate-500 hover:text-slate-700'
              }`}
            >
              3. Evaluación y Observaciones
            </button>
            <button
              onClick={() => setTab('firmas')}
              className={`pb-2.5 transition border-b-2 ${
                tab === 'firmas' ? 'border-amber-600 text-amber-800 font-bold' : 'border-transparent text-slate-500 hover:text-slate-700'
              }`}
            >
              4. Firmas y Autorización
            </button>
          </div>

          {/* Contenido del Tab Activo */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className={assistantOpen ? "lg:col-span-8 space-y-4" : "lg:col-span-12 space-y-4"}>
              {tab === 'aprendizajes' && (
                <div className="bg-white p-5 rounded-xl border border-slate-200 space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-slate-800 text-sm">Necesidades educativas específicas, aprendizaje y descriptor de logro</h3>
                    <button
                      onClick={addAprendizajeRow}
                      className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-semibold transition"
                    >
                      + Añadir Fila
                    </button>
                  </div>

                  <div className="space-y-3">
                    {(doc.tablas?.aprendizajes || []).map((row, idx) => (
                      <div key={idx} className="p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-2 relative group">
                        <button
                          onClick={() => removeAprendizajeRow(idx)}
                          className="absolute right-2 top-2 text-slate-400 hover:text-rose-600 text-xs opacity-0 group-hover:opacity-100 transition"
                          title="Eliminar fila"
                        >
                          ✕
                        </button>
                        <div>
                          <label className="text-[11px] font-semibold text-slate-500 uppercase tracking-wide">Necesidad Educativa Específica</label>
                          <textarea
                            rows="2"
                            value={row["Necesidades educativas específicas"] || ''}
                            onChange={(e) => updateAprendizaje(idx, "Necesidades educativas específicas", e.target.value)}
                            className="w-full text-xs p-2 bg-white border border-slate-200 rounded-md focus:border-amber-500 focus:outline-none"
                            placeholder="Describa la necesidad u objetivo prioritario..."
                          />
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                          <div>
                            <label className="text-[11px] font-semibold text-slate-500 uppercase tracking-wide">Aprendizaje y/u Objetivo</label>
                            <input
                              type="text"
                              value={row["Aprendizaje y/u objetivo"] || ''}
                              onChange={(e) => updateAprendizaje(idx, "Aprendizaje y/u objetivo", e.target.value)}
                              className="w-full text-xs p-2 bg-white border border-slate-200 rounded-md focus:border-amber-500 focus:outline-none"
                              placeholder="Aprendizaje esperado..."
                            />
                          </div>
                          <div>
                            <label className="text-[11px] font-semibold text-slate-500 uppercase tracking-wide">Descriptor de Logro</label>
                            <input
                              type="text"
                              value={row["Descriptor de logro"] || ''}
                              onChange={(e) => updateAprendizaje(idx, "Descriptor de logro", e.target.value)}
                              className="w-full text-xs p-2 bg-white border border-slate-200 rounded-md focus:border-amber-500 focus:outline-none"
                              placeholder="Evidencia observable..."
                            />
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {tab === 'dosificacion' && (
                <div className="bg-white p-5 rounded-xl border border-slate-200 space-y-4">
                  <h3 className="font-bold text-slate-800 text-sm">Organización de las actividades de aprendizaje</h3>
                  {(doc.tablas?.dosificacion || []).map((row, idx) => (
                    <div key={idx} className="p-3 bg-slate-50 rounded-lg border border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs font-semibold text-slate-600">Contexto</label>
                        <select
                          value={row["Contextos"] || 'Aula de apoyo'}
                          onChange={(e) => {
                            const rows = [...doc.tablas.dosificacion];
                            rows[idx]["Contextos"] = e.target.value;
                            updateDoc(d => ({ ...d, tablas: { ...d.tablas, dosificacion: rows } }));
                          }}
                          className="w-full text-xs p-2 bg-white border border-slate-200 rounded-md mt-1"
                        >
                          <option>Aula de apoyo</option>
                          <option>Aula regular</option>
                          <option>Escuela</option>
                          <option>Familia</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-slate-600">Temporalidad</label>
                        <input
                          type="text"
                          value={row["Temporalidad"] || ''}
                          onChange={(e) => {
                            const rows = [...doc.tablas.dosificacion];
                            rows[idx]["Temporalidad"] = e.target.value;
                            updateDoc(d => ({ ...d, tablas: { ...d.tablas, dosificacion: rows } }));
                          }}
                          className="w-full text-xs p-2 bg-white border border-slate-200 rounded-md mt-1"
                        />
                      </div>
                      <div className="md:col-span-2">
                        <label className="text-xs font-semibold text-slate-600">Actividades</label>
                        <textarea
                          rows="3"
                          value={row["Actividades"] || ''}
                          onChange={(e) => {
                            const rows = [...doc.tablas.dosificacion];
                            rows[idx]["Actividades"] = e.target.value;
                            updateDoc(d => ({ ...d, tablas: { ...d.tablas, dosificacion: rows } }));
                          }}
                          className="w-full text-xs p-2 bg-white border border-slate-200 rounded-md mt-1"
                          placeholder="Secuencia didáctica..."
                        />
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {tab === 'textos' && (
                <div className="bg-white p-5 rounded-xl border border-slate-200 space-y-4">
                  <h3 className="font-bold text-slate-800 text-sm">Evaluación y Observaciones de Seguimiento</h3>
                  <div>
                    <label className="text-xs font-semibold text-slate-600">Evaluación formativa</label>
                    <textarea
                      rows="3"
                      value={doc.textos?.["Evaluación"] || ''}
                      onChange={(e) => updateDoc(d => ({ ...d, textos: { ...d.textos, "Evaluación": e.target.value } }))}
                      className="w-full text-xs p-2 bg-white border border-slate-200 rounded-md mt-1"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600">Observaciones generales</label>
                    <textarea
                      rows="3"
                      value={doc.textos?.["Observaciones"] || ''}
                      onChange={(e) => updateDoc(d => ({ ...d, textos: { ...d.textos, "Observaciones": e.target.value } }))}
                      className="w-full text-xs p-2 bg-white border border-slate-200 rounded-md mt-1"
                    />
                  </div>
                </div>
              )}

              {tab === 'firmas' && (
                <div className="bg-white p-5 rounded-xl border border-slate-200 space-y-4">
                  <h3 className="font-bold text-slate-800 text-sm">Validación Canónica y Firmas Oficiales</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4">
                    <div className="border border-slate-200 rounded-xl p-4 text-center space-y-2">
                      <div className="text-xs text-slate-400 font-medium">Elaboró:</div>
                      <div className="h-16 flex items-end justify-center border-b border-dashed border-slate-300 pb-2">
                        <span className="text-slate-300 text-xs italic">Firma Electrónica Verificada</span>
                      </div>
                      <div className="font-bold text-slate-900 text-sm">
                        {doc.firmas_resueltas?.especialista_nombre || 'Mtra. Cindy Mayanín Burgos González'}
                      </div>
                      <div className="text-xs text-slate-500">
                        {doc.firmas_resueltas?.especialista_cargo || 'Maestra de Apoyo'}
                      </div>
                    </div>

                    <div className="border border-slate-200 rounded-xl p-4 text-center space-y-2">
                      <div className="text-xs text-slate-400 font-medium">Vo. Bo. Dirección:</div>
                      <div className="h-16 flex items-end justify-center border-b border-dashed border-slate-300 pb-2">
                        <span className="text-slate-300 text-xs italic">Sello Digital USAER 02-E</span>
                      </div>
                      <div className="font-bold text-slate-900 text-sm">
                        {doc.firmas_resueltas?.director_nombre || 'Psic. Edgar Adrián Yam Briceño MD'}
                      </div>
                      <div className="text-xs text-slate-500">
                        {doc.firmas_resueltas?.director_cargo || 'Vo. Bo. Director del Servicio de Apoyo'}
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* Panel Lateral: Asistente Pedagógico IA */}
            {assistantOpen && (
              <div className="lg:col-span-4 bg-white p-4 rounded-xl border border-amber-200 shadow-sm space-y-4 self-start">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div className="flex items-center space-x-2">
                    <span className="text-amber-500">✨</span>
                    <h4 className="font-bold text-slate-900 text-sm">Asistente Pedagógico</h4>
                  </div>
                  <button onClick={() => setAssistantOpen(false)} className="text-xs text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <p className="text-xs text-slate-500">
                  Genera propuestas pedagógicas contextualizadas basadas en la evidencia y barreras registradas.
                </p>
                <AssistantTool onApply={(sug) => {
                  updateDoc(d => {
                    const rows = [...(d.tablas?.aprendizajes || [])];
                    rows.push({
                      "Necesidades educativas específicas": sug.motivo || sug.sugerencias,
                      "Aprendizaje y/u objetivo": "Estrategias de acceso sugeridas por IA",
                      "Descriptor de logro": sug.seguimiento || "Evaluación a 30 días"
                    });
                    return { ...d, tablas: { ...d.tablas, aprendizajes: rows } };
                  });
                }} />
              </div>
            )}
          </div>
        </div>
      );
    }

    // Subcomponente de llamada al Asistente IA
    function AssistantTool({ onApply }) {
      const [loading, setLoading] = useState(false);
      const [barrera, setBarrera] = useState('Dificultad en autorregulación y atención');
      const [resultado, setResultado] = useState(null);

      const solicitar = async () => {
        setLoading(true);
        try {
          const res = await fetchAPI('/api/ai/sugerencias', {
            method: 'POST',
            body: JSON.stringify({ necesidad_o_barrera: barrera })
          });
          setResultado(res);
        } catch (e) {
          alert("Error de IA: " + e.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="space-y-3 pt-1">
          <div>
            <label className="text-[11px] font-semibold text-slate-600">Barrera o necesidad a consultar:</label>
            <input
              type="text"
              value={barrera}
              onChange={(e) => setBarrera(e.target.value)}
              className="w-full text-xs p-2 bg-slate-50 border border-slate-200 rounded-md mt-1"
            />
          </div>
          <button
            onClick={solicitar}
            disabled={loading}
            className="w-full py-2 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold text-xs rounded-lg transition"
          >
            {loading ? 'Consultando IA...' : '⚡ Generar Propuesta'}
          </button>
          {resultado && (
            <div className="p-3 bg-amber-50/70 border border-amber-200 rounded-lg text-xs space-y-2">
              <p className="text-slate-700 leading-relaxed">{resultado.sugerencias}</p>
              <button
                onClick={() => onApply(resultado)}
                className="w-full py-1 text-center bg-white border border-amber-300 text-amber-800 font-semibold rounded hover:bg-amber-100 transition"
              >
                + Insertar en la planeación
              </button>
            </div>
          )}
        </div>
      );
    }

    // Renderizado en el DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
