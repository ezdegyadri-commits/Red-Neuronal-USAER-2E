    // =============================================================
    // COMPONENTE: ASISTENTE PEDAGÓGICO IA CONVERSACIONAL
    // =============================================================
    function PedagogicalChatComponent({ alumnoId, onInsertProposal }) {
      const [messages, setMessages] = useState([
        {
          sender: 'ai',
          text: 'Hola. Soy el Asistente Pedagógico de USAER 02-E. Puedo sugerir descriptores observables para tus alumnos alineados a los 14 indicadores de la Zona 001. ¿En qué aprendizaje o ajuste estás trabajando?'
        }
      ]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [lastProposal, setLastProposal] = useState(null);

      const handleSend = async (e) => {
        if (e) e.preventDefault();
        if (!input.trim()) return;

        const userMsg = input.trim();
        setMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
        setInput('');
        setLoading(true);

        try {
          const res = await apiRequest('/api/ai/chat', {
            method: 'POST',
            body: JSON.stringify({
              mensaje: userMsg,
              alumno_id: alumnoId
            })
          });

          setMessages(prev => [...prev, { sender: 'ai', text: res.respuesta }]);
          if (res.propuesta_tabla) {
            setLastProposal(res.propuesta_tabla);
          }
        } catch (err) {
          setMessages(prev => [...prev, { sender: 'ai', text: 'Lo siento, ocurrió un error consultando el motor pedagógico.' }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="flex flex-col h-full space-y-3">
          <div className="flex justify-between items-center border-b border-slate-100 pb-2">
            <div className="flex items-center space-x-2">
              <span className="text-amber-600 font-bold">🤖</span>
              <span className="font-bold text-xs text-slate-800">Asistente Pedagógico Zona 001</span>
            </div>
            <span className="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">Activo</span>
          </div>

          <div className="flex-1 overflow-y-auto space-y-2 text-xs pr-1">
            {messages.map((m, idx) => (
              <div
                key={idx}
                className={`p-2.5 rounded-xl ${
                  m.sender === 'user' ? 'bg-amber-600 text-white ml-6 font-medium' : 'bg-slate-50 text-slate-800 mr-2 border border-slate-200'
                }`}
              >
                <div className="whitespace-pre-wrap">{m.text}</div>
              </div>
            ))}
            {loading && (
              <div className="p-2.5 bg-slate-50 rounded-xl text-slate-400 text-xs italic">
                Elaborando propuesta contextualizada...
              </div>
            )}
          </div>

          {lastProposal && (
            <div className="p-2 bg-amber-50 border border-amber-200 rounded-lg text-xs space-y-1.5">
              <div className="font-bold text-amber-900 text-[11px]">Propuesta lista para insertar:</div>
              <div className="text-slate-600 text-[11px] truncate">"{lastProposal.descriptor}"</div>
              <button
                onClick={() => {
                  onInsertProposal(lastProposal);
                  setLastProposal(null);
                }}
                className="w-full py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded font-bold text-xs shadow-sm transition"
              >
                + Insertar en Planeación (1 Clic)
              </button>
            </div>
          )}

          <form onSubmit={handleSend} className="flex gap-2">
            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              placeholder="Escribe tu instrucción pedagógica..."
              className="flex-1 px-3 py-2 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-amber-500"
            />
            <button
              type="submit"
              disabled={loading}
              className="px-3 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800 transition disabled:opacity-50"
            >
              Enviar
            </button>
          </form>
        </div>
      );
    }

    // =============================================================
    // VISTA 3: EXPEDIENTES INTEGRALES DE ALUMNOS (CON HISTORIA Y EPP)
    // =============================================================
    function InstrumentoDigitalEPP({ base, query, doc, area, valor, onGuardado }) {
      const [catalogo, setCatalogo] = useState({});
      const [codigo, setCodigo] = useState('');
      const [captura, setCaptura] = useState(null);
      const [revisada, setRevisada] = useState(false);
      const [ocupado, setOcupado] = useState(false);
      const [mensaje, setMensaje] = useState('');
      useEffect(() => {
        let vigente = true;
        apiRequest(base + '/instrumentos').then(datos => { if (vigente) setCatalogo(datos); })
          .catch(e => { if (vigente) setMensaje(e.message); });
        return () => { vigente = false; };
      }, [base]);
      const disponibles = Object.entries(catalogo).filter(([, d]) => d.area === area);
      const definicion = catalogo[codigo];
      async function guardar(incorporar) {
        setOcupado(true); setMensaje('');
        try {
          const acuse = await apiRequest(base + '/instrumentos/' + codigo + query, {
            method: 'PUT', body: JSON.stringify({ revision: doc.revision, captura, incorporar, revisada })
          });
          await onGuardado();
          setRevisada(false);
          setMensaje(`${incorporar ? 'Resultados incorporados' : 'Borrador confirmado'}. Respondidos: ${acuse.resultado.respondidos}/${acuse.resultado.total_registros}.`);
        } catch (e) { setMensaje(e.message); }
        finally { setOcupado(false); }
      }
      if (!disponibles.length) return mensaje ? <p role="alert">{mensaje}</p> : null;
      function cambiar(id, campo, texto) {
        setRevisada(false);
        setCaptura(c => ({ ...c, respuestas: { ...c.respuestas, [id]: { ...c.respuestas[id], [campo]: texto } } }));
      }
      return <details className="border rounded p-2">
        <summary>Aplicar instrumento digital</summary>
        <fieldset disabled={ocupado} className="space-y-2">
          <label>Protocolo <select value={codigo} className="border rounded" onChange={e => {
            const seleccionado = e.target.value;
            setCodigo(seleccionado); setRevisada(false); setMensaje('');
            setCaptura(valor.aplicaciones_en_curso?.[seleccionado] || catalogo[seleccionado]?.plantilla || null);
          }}><option value="">Elegir protocolo</option>
            {disponibles.map(([k, d]) => <option key={k} value={k}>{d.nombre}</option>)}
          </select></label>
          {captura && definicion && <>
            <p>{definicion.fuente} · pp. {definicion.paginas}. «No observado» queda pendiente.</p>
            <label>Fecha de aplicación del protocolo <input type="date" className="border rounded" value={captura.fecha}
              onChange={e => { setRevisada(false); setCaptura({ ...captura, fecha: e.target.value }); }} /></label>
            {definicion.items.map(item => <fieldset key={item.id} className="rounded border p-2">
              <legend>{item.id}. {item.texto}</legend>
              <label>Respuesta {item.id} {item.opciones.length
                ? <select className="border rounded" value={captura.respuestas[item.id].respuesta}
                  onChange={e => cambiar(item.id, 'respuesta', e.target.value)}>
                  {item.opciones.map(o => <option key={o}>{o}</option>)}</select>
                : <input className="border rounded" maxLength={500} value={captura.respuestas[item.id].respuesta}
                  onChange={e => cambiar(item.id, 'respuesta', e.target.value)} />}</label>
              <label className="block">Observaciones {item.id}
                <input className="border rounded" maxLength={500} value={captura.respuestas[item.id].observaciones}
                  onChange={e => cambiar(item.id, 'observaciones', e.target.value)} /></label>
            </fieldset>)}
            <button type="button" className="underline" onClick={() => guardar(false)}>Guardar borrador de aplicación</button>
            <label className="block"><input type="checkbox" checked={revisada} onChange={e => setRevisada(e.target.checked)} />
              Revisé las respuestas y corresponden a este expediente</label>
            <button type="button" disabled={!revisada} className="underline disabled:opacity-50"
              onClick={() => guardar(true)}>Incorporar resultados al informe</button>
          </>}
          {mensaje && <p role="status">{mensaje}</p>}
        </fieldset>
      </details>;
    }

    function EvaluacionExterna({ alumnoId, base, query, doc, area, valor, onGuardado }) {
      const [archivos, setArchivos] = useState(null);
      const [entrada, setEntrada] = useState({ adjunto_id: '', nombre: '', fecha: '', resultados: '', revisada: false });
      const [mensaje, setMensaje] = useState('');
      const [ocupado, setOcupado] = useState(false);
      const ruta = '/api/expedientes/' + encodeURIComponent(alumnoId) + '/adjuntos';
      async function cargar(e) {
        if (!e.currentTarget.open || archivos !== null) return;
        try { setArchivos(await apiRequest(ruta)); }
        catch (error) { setMensaje(error.message); }
      }
      function cambiar(k, v) { setEntrada(e => ({ ...e, revisada: false, [k]: v })); }
      async function guardar() {
        setOcupado(true); setMensaje('');
        try {
          await apiRequest(base + '/externa/' + encodeURIComponent(area) + query, {
            method: 'PUT', body: JSON.stringify({ ...entrada, revision: doc.revision })
          });
          await onGuardado();
          setEntrada(e => ({ ...e, revisada: false }));
          setMensaje('Evaluación externa guardada.');
        } catch (error) { setMensaje(error.message); }
        finally { setOcupado(false); }
      }
      const adjunto = archivos?.find(a => a.id === entrada.adjunto_id);
      return <details onToggle={cargar} className="border rounded p-2">
        <summary>Vincular evaluación externa</summary>
        <p>Usa el PDF original del archivo del expediente y registra solo los hallazgos cotejados.</p>
        {archivos && !archivos.length && <p>Adjunta primero el PDF en el resumen del expediente.</p>}
        <fieldset disabled={ocupado} className="space-y-2">
          <label>PDF del expediente <select className="border rounded" value={entrada.adjunto_id} onChange={e => {
            const id = e.target.value;
            const anterior = valor.evaluaciones.find(r => r.adjunto_id === id);
            setEntrada({ adjunto_id: id, nombre: anterior?.nombre || '', fecha: anterior?.fecha || '',
              resultados: anterior?.resultados || '', revisada: false });
          }}><option value="">Elegir archivo</option>{(archivos || []).map(a => <option key={a.id} value={a.id}>{a.nombre}</option>)}</select></label>
          {adjunto && <>
            <button type="button" className="underline" onClick={() => descargarArchivo(ruta + '/' + adjunto.id, adjunto.nombre)}>Descargar original</button>
            <label className="block">Instrumento externo <input className="border rounded" maxLength={255}
              value={entrada.nombre} onChange={e => cambiar('nombre', e.target.value)} /></label>
            <label className="block">Fecha de evaluación externa <input type="date" className="border rounded"
              value={entrada.fecha} onChange={e => cambiar('fecha', e.target.value)} /></label>
            <label className="block">Resultados externos cotejados <textarea className="block w-full border rounded" maxLength={11000}
              value={entrada.resultados} onChange={e => cambiar('resultados', e.target.value)} /></label>
            <label className="block"><input type="checkbox" checked={entrada.revisada} onChange={e => cambiar('revisada', e.target.checked)} />
              Verifiqué que el original y los resultados corresponden al alumno</label>
            <button type="button" className="underline disabled:opacity-50"
              disabled={!entrada.revisada || !entrada.nombre.trim() || !entrada.fecha || !entrada.resultados.trim()}
              onClick={guardar}>Guardar evaluación externa</button>
          </>}
          {mensaje && <p role="status">{mensaje}</p>}
        </fieldset>
      </details>;
    }

    function AnexoEvaluacion({ alumnoId }) {
      const [ciclo, setCiclo] = useState('2026-2027');
      const [doc, setDoc] = useState(null);
      const [area, setArea] = useState('Aprendizaje');
      const [valor, setValor] = useState(null);
      const [fundamentos, setFundamentos] = useState({});
      const [mensaje, setMensaje] = useState('');
      const [historial, setHistorial] = useState(null);
      const [guardando, setGuardando] = useState(false);
      const base = `/api/epp/${alumnoId}`;
      const query = `?ciclo=${encodeURIComponent(ciclo)}`;

      function abrir(datos, nombre) {
        setDoc(datos);
        setArea(nombre);
        setValor(datos.partes[nombre].contenido);
        setFundamentos(Object.fromEntries((datos.partes[nombre].nee_confirmadas || []).map(r => [r.texto, r])));
      }

      async function cargar() {
        setMensaje('');
        setHistorial(null);
        try {
          const datos = await apiRequest(base + '/anexo' + query);
          abrir(datos, datos.editables[0] && datos.partes[datos.editables[0]] ? datos.editables[0] : 'Aprendizaje');
        } catch (error) {
          setMensaje(error.message);
        }
      }

      async function guardar(event) {
        event.preventDefault();
        setGuardando(true);
        setMensaje('');
        try {
          const nee = area === 'Conclusión' && valor.validada
            ? valor.nee.filter(r => r.NEE?.trim()).map(r => ({ texto: r.NEE.trim(), ...fundamentos[r.NEE.trim()] }))
            : [];
          await apiRequest(base + '/anexo/' + encodeURIComponent(area) + query, {
            method: 'PUT', body: JSON.stringify({ revision: doc.revision, valor, nee })
          });
          abrir(await apiRequest(base + '/anexo' + query), area);
          setMensaje('Apartado guardado.');
        } catch (error) {
          setMensaje(error.message);
        } finally {
          setGuardando(false);
        }
      }

      const editable = !!doc?.editables.includes(area);
      const cambiarFila = (tabla, i, campo, texto) => setValor(v => ({
        ...v, [tabla]: v[tabla].map((r, j) => j === i ? { ...r, [campo]: texto } : r)
      }));
      const tablaOficial = (tabla, titulo) => !!valor[tabla]?.length && <details>
        <summary>{titulo}</summary>
        {valor[tabla].map((fila, i) => <fieldset key={i} className="border p-2">
          {Object.entries(fila).map(([campo, texto]) => <label className="block" key={campo}>{campo}
            <textarea readOnly={!editable} className="block w-full border rounded" value={texto}
              onChange={e => cambiarFila(tabla, i, campo, e.target.value)} />
          </label>)}
          {tabla === 'nee' && fila.NEE?.trim() && <div className="grid gap-2">
            {[['fundamento', 'Fundamento documental', 'text'], ['desde', 'Vigente desde', 'date'], ['hasta', 'Vigente hasta', 'date']].map(([k, etiqueta, tipo]) =>
              <label key={k}>{etiqueta}<input readOnly={!editable} className="block border" type={tipo}
                value={fundamentos[fila.NEE.trim()]?.[k] || ''} onChange={e => {
                  const texto = e.target.value;
                  const id = fila.NEE.trim();
                  setFundamentos(f => ({ ...f, [id]: { ...f[id], [k]: texto } }));
                }} /></label>)}
          </div>}
        </fieldset>)}
      </details>;

      return <details className="bg-white border rounded p-3">
        <summary className="font-bold">Anexo XVII · Evaluación interdisciplinaria</summary>
        <div className="flex gap-2 my-2">
          <label>Ciclo escolar <input className="border rounded" value={ciclo} disabled={guardando}
            onChange={e => { setCiclo(e.target.value); setDoc(null); }} /></label>
          <button type="button" onClick={cargar} className="underline">Abrir ciclo</button>
        </div>
        {doc && valor && <form onSubmit={guardar} className="space-y-3">
          <fieldset disabled={guardando} className="space-y-3">
            <label>Área <select className="border rounded" value={area} onChange={e => abrir(doc, e.target.value)}>
              {Object.keys(doc.partes).map(nombre => <option key={nombre}>{nombre}</option>)}
            </select></label>
            <p>{doc.partes[area].autor ? `Último guardado: ${doc.partes[area].autor}` : 'Apartado sin captura'}</p>
            {area === 'Conclusión' && <p>{doc.conclusion_vigente ? 'Conclusión vigente' : 'Conclusión pendiente o desactualizada'}</p>}
            {Object.entries(valor.campos || {}).map(([campo, texto]) => <label key={campo} className="block">{campo}
              <textarea readOnly={!editable} className="block w-full border rounded" value={texto} onChange={e => {
                const nuevo = e.target.value;
                setValor(v => ({ ...v, campos: { ...v.campos, [campo]: nuevo } }));
              }} />
            </label>)}
            {area !== 'Conclusión' && <>
              {editable && (valor === doc.partes[area].contenido
                ? <React.Fragment key={area + ciclo}>
                    <InstrumentoDigitalEPP base={base} query={query} doc={doc} area={area} valor={valor}
                      onGuardado={async () => abrir(await apiRequest(base + '/anexo' + query), area)} />
                    <EvaluacionExterna alumnoId={alumnoId} base={base} query={query} doc={doc} area={area} valor={valor}
                      onGuardado={async () => abrir(await apiRequest(base + '/anexo' + query), area)} />
                  </React.Fragment>
                : <p>Guarda los cambios del apartado antes de aplicar un instrumento.</p>)}
              <label className="block">Síntesis de resultados
                <textarea readOnly={!editable} className="block w-full border rounded" value={valor.sintesis}
                  onChange={e => { const sintesis = e.target.value; setValor(v => ({ ...v, sintesis })); }} />
              </label>
              <details><summary>Instrumentos aplicados y resultados</summary>
                {valor.evaluaciones.map((r, i) => <fieldset key={r.id} className="border p-2">
                  {[['nombre', 'Instrumento', 'text'], ['fecha', 'Fecha de aplicación', 'date'], ['texto', 'Resultados', 'text']].map(([k, etiqueta, tipo]) =>
                    <label className="block" key={k}>{etiqueta}<input readOnly={!editable || r.entrada === 'EXTERNA_REVISADA'} className="block border w-full"
                      type={tipo} value={r[k] || ''} onChange={e => cambiarFila('evaluaciones', i, k, e.target.value)} /></label>)}
                  {editable && r.entrada !== 'EXTERNA_REVISADA' && <button type="button" onClick={() => setValor(v => ({
                    ...v, evaluaciones: v.evaluaciones.filter((_, j) => j !== i)
                  }))}>Quitar instrumento</button>}
                </fieldset>)}
                {editable && <button type="button" className="underline" onClick={() => setValor(v => ({
                  ...v, evaluaciones: [...v.evaluaciones, { id: crypto.randomUUID(), nombre: '', fecha: '', texto: '' }]
                }))}>Agregar instrumento aplicado</button>}
              </details>
            </>}
            {area === 'Aprendizaje' && <details><summary>Datos generales</summary>
              {Object.entries(valor.generales || {}).map(([campo, texto]) => <label key={campo} className="block">{campo}
                <input readOnly={!editable} className="block border rounded w-full" value={texto} onChange={e => {
                  const nuevo = e.target.value;
                  setValor(v => ({ ...v, generales: { ...v.generales, [campo]: nuevo },
                    generales_editados: [...new Set([...(v.generales_editados || []), campo])] }));
                }} />
              </label>)}
            </details>}
            {Object.entries(doc.columnas || {}).filter(([tabla]) => Array.isArray(valor[tabla])).map(([tabla, columnas]) =>
              <details key={tabla}><summary>{tabla === 'familia' ? 'Composición familiar' : 'Historia escolar'}</summary>
                {tablaOficial(tabla, 'Registros')}
                {editable && <button type="button" className="underline" onClick={() => setValor(v => ({
                  ...v, [tabla]: [...v[tabla], Object.fromEntries(columnas.map(k => [k, '']))]
                }))}>Agregar registro</button>}
              </details>)}
            {tablaOficial('nee', 'Necesidades educativas especiales')}
            {tablaOficial('bap', 'Barreras para el aprendizaje y la participación')}
            {editable && <>
              <label className="block"><input type="checkbox" checked={valor.validada}
                onChange={e => { const validada = e.target.checked; setValor(v => ({ ...v, validada })); }} />
                {area === 'Conclusión' ? 'Confirmar conclusión y NEE' : 'Validar hallazgos del área'}
              </label>
              <button type="submit" className="px-3 py-2 rounded bg-slate-800 text-white">Guardar apartado</button>
            </>}
            <button type="button" className="underline ml-2" onClick={() => descargarArchivo(base + '/pdf' + query, 'EPP-Anexo-XVII.pdf')}>Exportar Anexo XVII</button>
            <button type="button" className="underline ml-2" onClick={async () => {
              try { setHistorial(await apiRequest(base + '/historial' + query)); }
              catch (error) { setMensaje(error.message); }
            }}>Historial del ciclo</button>
          </fieldset>
          {historial && <ul>{historial.map(r => <li key={r.revision}>{r.fecha} · {r.autor}</li>)}</ul>}
        </form>}
        <p role="status">{mensaje}</p>
      </details>;
    }

    function EditorEPP({ alumnoId }) {
      const [doc, setDoc] = useState(null);
      const [mensaje, setMensaje] = useState('');
      const [guardando, setGuardando] = useState(false);

      useEffect(() => {
        let vigente = true;
        apiRequest(`/api/epp/${alumnoId}`)
          .then(data => { if (vigente) setDoc(data); })
          .catch(error => { if (vigente) setMensaje(error.message); });
        return () => { vigente = false; };
      }, [alumnoId]);

      async function guardar(event) {
        event.preventDefault();
        setGuardando(true);
        try {
          const acuse = await apiRequest('/api/epp', { method: 'POST', body: JSON.stringify(doc) });
          setDoc(actual => ({ ...actual, revision: acuse.revision }));
          setMensaje('EPP guardada.');
        } catch (error) {
          setMensaje(error.message);
        } finally {
          setGuardando(false);
        }
      }

      if (!doc) return <p role="status">{mensaje || 'Abriendo EPP…'}</p>;

      return (
        <form onSubmit={guardar}>
          <p>Ciclo escolar {doc.ciclo}</p>
          <fieldset disabled={guardando} className="space-y-3">
            {Object.entries(doc.partes || {}).filter(([area]) => area !== 'META').map(([area, datos]) => (
              <section key={area} className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                <h3 className="font-bold">{area.replaceAll('_', ' ')}</h3>
                {Object.entries(datos || {}).map(([campo, valor]) => (
                  <label key={campo} className="block">
                    {campo.replaceAll('_', ' ')}
                    {typeof valor === 'string' ? (
                      <textarea readOnly={!doc.areas_editables?.includes(area)} className="block w-full border rounded p-2" value={valor} onChange={event => {
                        const texto = event.target.value;
                        setMensaje('Cambios pendientes.');
                        setDoc(actual => ({ ...actual, partes: {
                          ...actual.partes, [area]: { ...actual.partes[area], [campo]: texto }
                        } }));
                      }} />
                    ) : <pre>{JSON.stringify(valor, null, 2)}</pre>}
                  </label>
                ))}
              </section>
            ))}
            <button type="submit" className="px-3 py-2 rounded bg-slate-800 text-white">Guardar EPP</button>
          </fieldset>
          <p role="status">{mensaje}</p>
        </form>
      );
    }

    const FORMULARIOS_ANEXOS = {
      3: [['fecha','Fecha','date'], ['bap_fisicas','Barreras físicas'], ['bap_actitudinales','Barreras actitudinales'],
          ['bap_pedagogicas','Barreras pedagógicas'], ['bap_organizativas','Barreras organizativas']],
      4: [['fecha_elaboracion','Fecha de elaboración','date'], ['ciclo_escolar','Ciclo escolar','text'],
          ['trimestre','Trimestre','text'], ['motivo','Motivo'], ['sugerencias','Sugerencias'],
          ['fecha_seguimiento','Fecha de seguimiento','date'], ['nivel_cumplimiento_resultados','Resultados de seguimiento'],
          ['observaciones','Observaciones']],
      5: [['fecha','Fecha','date'], ['evento','Evento significativo']]
    };

    function AdjuntosExpediente({ alumnoId }) {
      const url = `/api/expedientes/${alumnoId}/adjuntos`;
      const [archivos, setArchivos] = useState([]);
      const [mensaje, setMensaje] = useState('');
      const [enviando, setEnviando] = useState(false);
      useEffect(() => {
        apiRequest(url).then(setArchivos).catch(e => setMensaje(e.message));
      }, [url]);
      async function enviar(event) {
        event.preventDefault();
        const formulario = event.currentTarget;
        const archivo = new FormData(formulario).get('pdf');
        if (!archivo?.size) return;
        setEnviando(true);
        try {
          await apiRequest(url + '?nombre=' + encodeURIComponent(archivo.name), {
            method: 'POST', headers: { 'Content-Type': 'application/pdf' }, body: archivo
          });
          setArchivos(await apiRequest(url));
          formulario.reset();
          setMensaje('PDF adjuntado.');
        } catch (error) {
          setMensaje(error.message);
        } finally {
          setEnviando(false);
        }
      }
      return <details className="border rounded p-3">
        <summary className="font-bold">Archivos del expediente</summary>
        <form onSubmit={enviar} className="my-2">
          <label>Adjuntar PDF <input name="pdf" type="file" accept="application/pdf,.pdf" required /></label>
          <button disabled={enviando} className="underline ml-2">Guardar PDF</button>
        </form>
        <p role="status">{mensaje}</p>
        <ul>{archivos.map(a => <li key={a.id}>
          <button type="button" className="underline" onClick={() => descargarArchivo(url + '/' + a.id, a.nombre)}>{a.nombre}</button>
          <span> · {a.autor} · {Math.ceil(a.bytes / 1024)} KiB</span>
        </li>)}</ul>
      </details>;
    }

    function EditorAnexos({ alumnoId, numero, onGuardado }) {
      const [registros, setRegistros] = useState([]);
      const [borrador, setBorrador] = useState(null);
      const [historial, setHistorial] = useState(null);
      const [buscar, setBuscar] = useState('');
      const [desde, setDesde] = useState('');
      const [mensaje, setMensaje] = useState('');
      const [ocupado, setOcupado] = useState(false);
      const campos = FORMULARIOS_ANEXOS[numero];
      const url = `/api/expedientes/${alumnoId}/anexos/${numero}`;
      const visibles = registros.filter(r =>
        (!desde || (r.campos[campos[0][0]] || '') >= desde) &&
        Object.values(r.campos).some(v => v.toLowerCase().includes(buscar.toLowerCase())));

      useEffect(() => {
        let activo = true;
        apiRequest(url).then(datos => { if (activo) setRegistros(datos); })
          .catch(e => { if (activo) setMensaje(e.message); });
        return () => { activo = false; };
      }, [url]);

      async function guardar(event) {
        event.preventDefault();
        setOcupado(true);
        setMensaje('');
        try {
          const id = borrador.id;
          await apiRequest(url + (id ? '/' + id : ''), {
            method: id ? 'PUT' : 'POST',
            body: JSON.stringify({ campos: borrador.campos, revision: borrador.revision })
          });
          setRegistros(await apiRequest(url));
          setBorrador(null);
          setMensaje('Anexo guardado.');
          onGuardado();
        } catch (error) {
          setMensaje(error.message);
        } finally {
          setOcupado(false);
        }
      }

      return <section className="space-y-3">
        <div className="flex flex-wrap gap-3">
          <button type="button" className="underline" onClick={() => {
            setHistorial(null); setBorrador({ campos: numero === 4 ? { ciclo_escolar: '2026-2027', trimestre: '1' } : {} });
          }}>Nuevo registro</button>
          <button type="button" className="underline" disabled={!registros.length}
            onClick={() => descargarArchivo(url + '/pdf', `Anexo-${numero}.pdf`)}>Exportar anexo</button>
          <label>Buscar <input className="border rounded" value={buscar} onChange={e => setBuscar(e.target.value)} /></label>
          <label>Desde <input className="border rounded" type="date" value={desde} onChange={e => setDesde(e.target.value)} /></label>
        </div>
        {borrador && <form onSubmit={guardar}>
          <fieldset disabled={ocupado} className="space-y-2 border rounded p-3">
            {campos.map(([k, titulo, tipo]) => <label key={k} className="block">{titulo}
              {tipo ? <input type={tipo} aria-label={titulo} className="block border rounded" value={borrador.campos[k] || ''}
                  onChange={e => { const v = e.target.value; setBorrador(d => ({ ...d, campos: { ...d.campos, [k]: v } })); }} />
                : <textarea aria-label={titulo} className="block w-full border rounded p-2" value={borrador.campos[k] || ''}
                  onChange={e => { const v = e.target.value; setBorrador(d => ({ ...d, campos: { ...d.campos, [k]: v } })); }} />}
            </label>)}
            <button type="submit" className="px-3 py-2 rounded bg-slate-800 text-white">Guardar anexo</button>
            <button type="button" className="ml-2" onClick={() => setBorrador(null)}>Cancelar</button>
          </fieldset>
        </form>}
        <p role="status">{mensaje}</p>
        {visibles.map(r => <article key={r.id} className="p-3 border rounded space-y-2">
          {campos.map(([k, titulo]) => r.campos[k] && <p key={k} className="whitespace-pre-wrap"><strong>{titulo}</strong> {r.campos[k]}</p>)}
          {r.autor && <p>Autoría: {r.autor}</p>}
          <div className="flex gap-3">
            {r.editable && <button type="button" className="underline" onClick={() => { setBorrador(r); setHistorial(null); }}>Editar</button>}
            <button type="button" className="underline" onClick={async () => {
              try { setHistorial({ id: r.id, cambios: await apiRequest(url + '/' + r.id + '/historial') }); }
              catch (error) { setMensaje(error.message); }
            }}>Historial</button>
            <button type="button" className="underline" onClick={() => descargarArchivo(
              url + '/pdf?registro=' + encodeURIComponent(r.id), `Anexo-${numero}.pdf`)}>Descargar PDF</button>
          </div>
          {historial?.id === r.id && <ul>{historial.cambios.map(c => <li key={c.revision}>
            <details><summary>{c.fecha} · {c.autor}</summary>
              {campos.map(([k, titulo]) => c.documento.campos[k] && <p key={k}>{titulo}: {c.documento.campos[k]}</p>)}
            </details>
          </li>)}</ul>}
        </article>)}
      </section>;
    }

    function ImportacionPadron({ onConfirmado }) {
      const [permitido, setPermitido] = useState(false);
      const [archivo, setArchivo] = useState(null);
      const [vista, setVista] = useState(null);
      const [confirmado, setConfirmado] = useState(false);
      const [ocupado, setOcupado] = useState(false);
      const [mensaje, setMensaje] = useState('');
      const [error, setError] = useState('');
      useEffect(() => {
        apiRequest('/api/alumnos/importar-excel/permisos').then(r => setPermitido(r.permitido)).catch(() => {});
      }, []);
      if (!permitido) return null;

      async function procesar(confirmar) {
        setOcupado(true);
        setError('');
        setMensaje('');
        if (!confirmar) { setVista(null); setConfirmado(false); }
        try {
          const respuesta = await apiRequest('/api/alumnos/importar-excel', {
            method: 'POST', body: archivo,
            headers: { 'Content-Type': 'application/octet-stream',
              ...(confirmar ? { 'X-USAER-Revision': vista.revision } : {}) },
          });
          if (confirmar) {
            setVista(null);
            setConfirmado(false);
            setMensaje(`Importación confirmada: ${respuesta.altas} altas y ${respuesta.actualizados} actualizaciones.`);
            onConfirmado();
          } else {
            setVista(respuesta);
          }
        } catch (e) {
          let detalle;
          try { detalle = JSON.parse(e.message).detail; } catch {}
          setError(typeof detalle === 'string' ? detalle : e.message);
        } finally {
          setOcupado(false);
        }
      }

      return <details className="rounded-xl border bg-white p-4 text-sm space-y-3">
        <summary className="cursor-pointer font-semibold">Importar padrón desde Excel</summary>
        <p>La conciliación usa la CURP. Se conservan los expedientes y los campos vacíos no reemplazan los datos existentes.</p>
        <label className="block">Archivo del padrón (.xlsx)
          <input type="file" accept=".xlsx" disabled={ocupado} className="block mt-1"
            onChange={e => {
              setArchivo(e.target.files[0] || null); setVista(null); setConfirmado(false); setMensaje(''); setError('');
            }} />
        </label>
        <button type="button" className="px-3 py-2 border rounded-lg disabled:opacity-50"
          disabled={!archivo || ocupado} onClick={() => procesar(false)}>Revisar archivo y cambios</button>
        {error && <p role="alert" className="text-red-700">{error}</p>}
        {mensaje && <p role="status">{mensaje}</p>}
        {vista && <div className="space-y-2">
          <p>Hoja: {vista.hoja} · {vista.filas.length} registros revisados</p>
          {!!vista.encabezados_no_reconocidos.length &&
            <p>Encabezados omitidos: {vista.encabezados_no_reconocidos.join(', ')}</p>}
          {!!vista.errores.length && <ul role="alert" className="text-red-700 list-disc pl-5">
            {vista.errores.map((e, i) => <li key={i}>{e}</li>)}
          </ul>}
          <ul className="max-h-64 overflow-y-auto divide-y border rounded-lg">
            {vista.filas.map((fila, i) => <li key={i} className="p-2">
              <strong>{fila.accion} · {fila.alumno}</strong>
              {Object.entries(fila.cambios).map(([campo, valor]) =>
                <div key={campo}>{campo}: {valor.anterior || '—'} → {valor.nuevo}</div>)}
            </li>)}
          </ul>
          <label className="flex items-center gap-2">
            <input type="checkbox" checked={confirmado} disabled={ocupado}
              onChange={e => setConfirmado(e.target.checked)} /> Revisé y confirmo estas altas y actualizaciones
          </label>
          <button type="button" className="px-3 py-2 rounded-lg bg-amber-700 text-white disabled:opacity-50"
            disabled={ocupado || !confirmado || !!vista.errores.length || !vista.filas.length}
            onClick={() => procesar(true)}>Confirmar importación</button>
        </div>}
      </details>;
    }

    function FichaPadron({ alumnoId, onGuardado }) {
      const ruta = '/api/alumnos/' + encodeURIComponent(alumnoId);
      const [ficha, setFicha] = useState(null);
      const [campos, setCampos] = useState({});
      const [mov, setMov] = useState({ accion: 'baja', motivo: '' });
      const [destinos, setDestinos] = useState([]);
      const [historial, setHistorial] = useState(null);
      const [mensaje, setMensaje] = useState('');
      const [error, setError] = useState('');
      const [ocupado, setOcupado] = useState(false);
      const etiquetas = { Nombre_Completo: 'Nombre completo', CURP: 'CURP', Edad_1_Septiembre: 'Edad al 1 de septiembre',
        Sexo: 'Sexo', Situacion_Alumno: 'Situación', Nivel_Educativo: 'Nivel educativo', Grado: 'Grado',
        Grupo: 'Grupo', Condicion_Discapacidad: 'Condición o discapacidad', Tipo_Atencion: 'Tipo de atención',
        Lengua_Indigena_Mayahablante: 'Lengua indígena', Afrodescendiente: 'Afrodescendiente', Migrante: 'Migrante',
        Fecha_Nacimiento: 'Fecha de nacimiento', Fecha_Derivacion: 'Fecha de derivación',
        Condiciones_Adicionales: 'Condiciones adicionales' };
      function recibir(datos) {
        setFicha(datos);
        setCampos(datos.campos);
        const activo = datos.estatus.trim().toUpperCase() === 'ACTIVO';
        setMov({ accion: activo ? 'baja' : 'reactivacion', motivo: '', grado: datos.campos.Grado, grupo: datos.campos.Grupo });
      }
      async function abrir() {
        setError(''); setMensaje(''); setOcupado(true);
        try { recibir(await apiRequest(ruta + '/ficha')); }
        catch (e) { setError(e.message); }
        finally { setOcupado(false); }
      }
      async function guardar(evento, movimiento) {
        evento.preventDefault();
        setOcupado(true); setError(''); setMensaje('');
        try {
          const cambios = Object.fromEntries(Object.entries(campos).filter(([k, v]) => v !== ficha.campos[k]));
          const datos = movimiento ? mov : { campos: cambios };
          await apiRequest(ruta + (movimiento ? '/movimientos' : '/ficha'), {
            method: movimiento ? 'POST' : 'PUT', body: JSON.stringify({ ...datos, revision: ficha.revision })
          });
          setHistorial(null);
          if (movimiento && mov.accion === 'traslado') { setFicha(null); onGuardado(true); }
          else { recibir(await apiRequest(ruta + '/ficha')); onGuardado(false); }
          setMensaje('Cambios guardados en el padrón.');
        } catch (e) { setError(e.message); }
        finally { setOcupado(false); }
      }
      const opcionesDestino = destinos.find(e => e.id === mov.escuela)?.responsables || [];
      const activo = ficha?.estatus.trim().toUpperCase() === 'ACTIVO';
      return <section className="rounded-lg border p-3 text-sm space-y-3">
        <button type="button" disabled={ocupado} className="font-semibold underline" onClick={abrir}>Abrir ficha del padrón</button>
        {mensaje && <p role="status">{mensaje}</p>}
        {error && <p role="alert" className="text-red-700">{error}</p>}
        {ficha && <>
          <p>Estatus: <strong>{ficha.estatus}</strong></p>
          <form onSubmit={e => guardar(e, false)}>
            <fieldset disabled={ocupado} className="grid sm:grid-cols-2 gap-2">
              {Object.entries(etiquetas).map(([k, etiqueta]) => <label key={k}>{etiqueta}
                {ficha.catalogos[k] ? <select className="block w-full border rounded p-1" value={campos[k]}
                  onChange={e => setCampos({ ...campos, [k]: e.target.value })}>
                  {[...new Set(['', campos[k], ...ficha.catalogos[k]])].map(v => <option key={v} value={v}>{v || 'Sin dato'}</option>)}
                </select> : <input className="block w-full border rounded p-1" value={campos[k]}
                  onChange={e => setCampos({ ...campos, [k]: e.target.value })} />}
              </label>)}
              <button className="rounded border p-2 font-semibold" type="submit">Guardar ficha nominal</button>
            </fieldset>
          </form>
          <form onSubmit={e => guardar(e, true)}>
            <fieldset disabled={ocupado} className="grid gap-2 border-t pt-3">
              <legend className="font-semibold">Movimientos del padrón</legend>
              <label>Acción <select value={mov.accion} className="border rounded" onChange={async e => {
                const accion = e.target.value;
                setMov({ ...mov, accion });
                if (accion === 'traslado') {
                  try { setDestinos(await apiRequest(ruta + '/destinos')); } catch (err) { setError(err.message); }
                }
              }}>
                {activo ? <><option value="baja">Baja recuperable</option><option value="traslado">Traslado</option></>
                  : <option value="reactivacion">Reactivar</option>}
              </select></label>
              {mov.accion === 'traslado' && <>
                <label>Escuela de destino <select required className="border rounded" value={mov.escuela || ''}
                  onChange={e => setMov({ ...mov, escuela: e.target.value, cuenta_destino: '' })}>
                  <option value="">Elegir escuela</option>{destinos.map(e => <option key={e.id} value={e.id}>{e.nombre}</option>)}
                </select></label>
                <label>Responsable de destino <select required className="border rounded" value={mov.cuenta_destino || ''}
                  onChange={e => setMov({ ...mov, cuenta_destino: e.target.value })}>
                  <option value="">Elegir responsable</option>{opcionesDestino.map(e => <option key={e.id} value={e.id}>{e.nombre}</option>)}
                </select></label>
                {['grado', 'grupo'].map(k => <label key={k}>{k === 'grado' ? 'Grado de destino' : 'Grupo de destino'}
                  <input required className="block border rounded" value={mov[k]} onChange={e => setMov({ ...mov, [k]: e.target.value })} />
                </label>)}
              </>}
              <label>Motivo del movimiento <textarea required minLength={8} maxLength={500} className="block w-full border rounded"
                value={mov.motivo} onChange={e => setMov({ ...mov, motivo: e.target.value })} /></label>
              <button className="rounded border p-2 font-semibold" type="submit">Confirmar movimiento</button>
            </fieldset>
          </form>
          <button type="button" className="underline" onClick={async () => {
            try { setHistorial(await apiRequest(ruta + '/movimientos')); } catch (e) { setError(e.message); }
          }}>Ver historial del padrón</button>
          {historial && <ul className="divide-y">{historial.map(r => <li key={r.revision} className="py-2">
            <strong>{r.documento.accion}</strong> · {r.fecha.split('T')[0]} · {r.autor}
            {r.documento.motivo && <p>{r.documento.motivo}</p>}
            {Object.entries(r.documento.despues).map(([k, v]) => <p key={k}>
              {etiquetas[k] || k}: {r.documento.antes[k] || '—'} → {v || '—'}
            </p>)}
          </li>)}</ul>}
        </>}
      </section>;
    }

          if (!selectedId && data.length > 0) {

    function EditorOficio({ listado, onGuardado }) {
      const [oficio, setOficio] = useState(null);
      const [historial, setHistorial] = useState(null);
      const [ocupado, setOcupado] = useState(false);
      const [mensaje, setMensaje] = useState('');
      const [error, setError] = useState('');
      const campos = [
        ['fecha_emision', 'Fecha de emisión', 'date'], ['fecha_comision', 'Fecha de comisión', 'date'],
        ['escuela', 'Escuela destinataria'], ['director_escuela', 'Dirección destinataria'],
        ['maestra_apoyo', 'Personal comisionado'], ['asunto', 'Asunto'], ['destino', 'Destino o actividad'],
        ['horario', 'Horario'],
      ];
      async function ejecutar(tarea) {
        setOcupado(true); setError(''); setMensaje('');
        try { await tarea(); } catch (e) { setError(e.message); }
        finally { setOcupado(false); }
      }
      async function guardar(e) {
        e.preventDefault();
        await ejecutar(async () => {
          const ruta = '/api/oficios' + (oficio.id ? '/' + encodeURIComponent(oficio.id) : '');
          setOficio(await apiRequest(ruta, { method: oficio.id ? 'PUT' : 'POST', body: JSON.stringify(oficio) }));
          setHistorial(null); setMensaje('Oficio guardado.');
          await onGuardado();
        });
      }
      return <section className="space-y-3">
        <button type="button" className="underline" disabled={ocupado} onClick={() => {
          setOficio({ clave_operacion: crypto.randomUUID() }); setHistorial(null); setMensaje(''); setError('');
        }}>Nuevo oficio de comisión</button>
        {error && <p role="alert" className="text-red-700">{error}</p>}
        {mensaje && <p role="status">{mensaje}</p>}
        {oficio && <form onSubmit={guardar} className="bg-white border rounded-xl p-3">
          <fieldset disabled={ocupado} className="grid gap-2">
            <legend className="font-semibold">{oficio.folio ? 'Oficio ' + oficio.folio : 'Nuevo oficio'}</legend>
            {campos.map(([k, etiqueta, tipo]) => <label key={k}>{etiqueta}
              <input type={tipo || 'text'} className="block w-full border rounded" value={oficio[k] || ''}
                required={['fecha_comision', 'escuela', 'maestra_apoyo', 'asunto', 'destino'].includes(k)}
                onChange={e => setOficio({ ...oficio, [k]: e.target.value })} />
            </label>)}
            <button type="submit" className="underline">Guardar oficio</button>
            {oficio.id && <>
              <button type="button" className="underline" onClick={() =>
                descargarArchivo('/api/oficios/' + oficio.id + '/pdf', 'Oficio-Comision.pdf')}>Exportar oficio PDF</button>
              <button type="button" className="underline" onClick={() => ejecutar(async () => {
                setHistorial(await apiRequest('/api/oficios/' + oficio.id + '/historial'));
              })}>Historial del oficio</button>
            </>}
          </fieldset>
        </form>}
        {historial && <ul className="divide-y">{historial.map(r => <li key={r.revision}>
          <details><summary>{r.fecha} · {r.autor}</summary>
            {campos.map(([k, etiqueta]) => <p key={k}>{etiqueta}: {r.documento[k]}</p>)}
          </details>
        </li>)}</ul>}
        {listado.map(o => <div key={o.ID_Oficio} className="p-4 bg-white rounded-xl border text-sm">
          <strong>Folio {o.Folio} · {o.Asunto}</strong>
          <p>{o.Escuela} · {o.Maestra_Apoyo} · {o.Fecha_Comision}</p>
          <button type="button" className="underline" disabled={ocupado} onClick={() => ejecutar(async () => {
            setOficio(await apiRequest('/api/oficios/' + encodeURIComponent(o.ID_Oficio))); setHistorial(null);
          })}>Abrir oficio {o.Folio}</button>
        </div>)}
      </section>;
    }

    function ActasYOficiosView({ onBack, setMetrics }) {
      const [visitas, setVisitas] = useState([]);
      const [oficios, setOficios] = useState([]);
      const [subTab, setSubTab] = useState('visitas'); // 'visitas' | 'oficios'

      const [acta, setActa] = useState(null);
      const [actaError, setActaError] = useState('');
      const [guardandoActa, setGuardandoActa] = useState(false);
      const [historialActa, setHistorialActa] = useState(null);
      const [alumnosActa, setAlumnosActa] = useState([]);
      const camposActa = [
        ['tipo_acta','Tipo de acta'], ['fecha','Fecha'], ['escuela','Escuela o sede'], ['lugar','Lugar'],
        ['personal','Personal'], ['motivo','Motivos y actividades'], ['observaciones','Observaciones'],
        ['acuerdos','Acuerdos'], ['responsable','Responsable'], ['seguimiento','Seguimiento']
      ];

      async function abrirActa(id) {
        setActaError('');
        setHistorialActa(null);
        try { setActa(await apiRequest('/api/visitas/' + id)); }
        catch (error) { setActaError(error.message); }
      }

      async function guardarActa(event) {
        event.preventDefault();
        setGuardandoActa(true);
        setActaError('');
        try {
          const acuse = await apiRequest('/api/visitas' + (acta.id ? '/' + acta.id : ''), {
            method: acta.id ? 'PUT' : 'POST', body: JSON.stringify(acta)
          });
          await abrirActa(acuse.id);
          setVisitas(await apiRequest('/api/visitas'));
        } catch (error) {
          setActaError(error.message);
        } finally {
          setGuardandoActa(false);
        }
      }

      useEffect(() => {
        const t0 = performance.now();
        Promise.all([
          apiRequest('/api/visitas'),
          apiRequest('/api/oficios'),
          apiRequest('/api/alumnos')
        ]).then(([v, o, alumnos]) => {
          setVisitas(v);
          setOficios(o);
          setAlumnosActa(alumnos);
          const t1 = performance.now();
          setMetrics(m => ({ latency: Math.round(t1 - t0), requests: m.requests + 2 }));
        });
      }, [setMetrics]);

      return (
        <div className="space-y-6">
          <div className="flex items-center space-x-3">
            <button onClick={onBack} className="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-700 font-semibold transition">
              ← Volver
            </button>
            <h1 className="text-2xl font-bold tracking-tight text-slate-900">Actas de Visita y Oficios de Comisión</h1>
          </div>

          <div className="flex border-b border-slate-200 space-x-2 text-xs font-bold">
            <button
              onClick={() => setSubTab('visitas')}
              className={`px-4 py-2 border-b-2 transition ${
                subTab === 'visitas' ? 'border-amber-600 text-amber-800 bg-amber-50/50' : 'border-transparent text-slate-500'
              }`}
            >
              📋 Actas de Visita de Acompañamiento ({visitas.length})
            </button>
            <button
              onClick={() => setSubTab('oficios')}
              className={`px-4 py-2 border-b-2 transition ${
                subTab === 'oficios' ? 'border-amber-600 text-amber-800 bg-amber-50/50' : 'border-transparent text-slate-500'
              }`}
            >
              📜 Oficios de Comisión ({oficios.length})
            </button>
          </div>

          {subTab === 'visitas' && (
            <div className="space-y-3">
                              <button className="underline" type="button" onClick={() => {
                  setActa({ tipo_acta: 'Acta de visita' }); setActaError(''); setHistorialActa(null);
                }}>Nueva acta</button>
                {actaError && <p role="alert">{actaError}</p>}
                {acta && <form onSubmit={guardarActa} className="p-4 bg-white border rounded space-y-2">
                  <fieldset disabled={guardandoActa} className="grid gap-2">
                    <label>Vincular a un expediente
                      <select className="block w-full border rounded" value={acta.alumno_id || ''}
                        onChange={e => {
                          const id = e.target.value;
                          const alumno = alumnosActa.find(a => a.id === id);
                          setActa(d => ({ ...d, alumno_id: id, escuela: alumno?.escuela || d.escuela }));
                        }}>
                        <option value="">Sin expediente vinculado</option>
                        {alumnosActa.map(a => <option key={a.id} value={a.id}>{a.nombre_completo} · {a.escuela}</option>)}
                      </select>
                    </label>
                    {camposActa.map(([k, etiqueta]) => <label key={k}>{etiqueta}
                      {['motivo', 'observaciones', 'acuerdos', 'seguimiento'].includes(k) ?
                        <textarea className="block w-full border rounded" value={acta[k] || ''} onChange={e => {
                          const valor = e.target.value; setActa(d => ({ ...d, [k]: valor }));
                        }} /> :
                        <input type={k === 'fecha' ? 'date' : 'text'} className="block w-full border rounded"
                          readOnly={k === 'escuela' && !!acta.alumno_id}
                          value={acta[k] || ''} onChange={e => {
                            const valor = e.target.value; setActa(d => ({ ...d, [k]: valor }));
                          }} />}
                    </label>)}
                    <button type="submit" className="underline">Guardar acta</button>
                    <button type="button" onClick={() => setActa(null)}>Cerrar</button>
                    {acta.id && <>
                      <button type="button" className="underline" onClick={() =>
                        descargarArchivo('/api/visitas/' + acta.id + '/pdf', 'Acta-USAER.pdf')}>Exportar PDF</button>
                      <button type="button" className="underline" onClick={async () => {
                        try { setHistorialActa(await apiRequest('/api/visitas/' + acta.id + '/historial')); }
                        catch (e) { setActaError(e.message); }
                      }}>Ver historial</button>
                    </>}
                  </fieldset>
                  {historialActa && <ul>{historialActa.map(r => <li key={r.revision}>
                    <details><summary>{r.fecha} · {r.autor}</summary>
                      {camposActa.map(([k, etiqueta]) => r.documento[k] &&
                        <p key={k} className="whitespace-pre-wrap">{etiqueta} {r.documento[k]}</p>)}
                    </details>
                  </li>)}</ul>}
                </form>}
{visitas.map((v, i) => (
                <div key={i} className="p-4 bg-white rounded-xl border border-slate-200 text-xs space-y-1 shadow-sm">
                  <div className="flex justify-between items-center">
                    <span className="font-bold text-slate-900 text-sm">Escuela: {v.Escuela}</span>
                    <span className="text-slate-400">{v.Fecha}</span>
                  </div>
                  <div><strong>Personal de Acompañamiento:</strong> {v.Personal}</div>
                  <div><strong>Motivo:</strong> {v.Motivo}</div>
                  {v.Observaciones && <div className="text-slate-600"><strong>Observaciones:</strong> {v.Observaciones}</div>}
                    <button type="button" className="underline" onClick={() => abrirActa(v.ID_Visita)}>Abrir acta</button>
                </div>
              ))}
            </div>
          )}

          {subTab === 'oficios' && (
            <EditorOficio listado={oficios} onGuardado={async () => setOficios(await apiRequest('/api/oficios'))} />
          )}
        </div>
      );
    }

    // =============================================================
    // INFORMES EDUCATIVOS — EDITOR DIRECTO CON HISTORIAL SQL
    // =============================================================
    function InformesView({ initialAlumnoId, onBack }) {
      const [alumnos, setAlumnos] = useState([]);
      const [alumnoId, setAlumnoId] = useState(initialAlumnoId || '');
      const [lista, setLista] = useState([]);
      const [actual, setActual] = useState(null);
      const [estado, setEstado] = useState('');
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);
      const campos = ['antecedentes','avances','dificultades','intervenciones','recomendaciones'];
      const labels = {antecedentes:'Antecedentes', avances:'Avances', dificultades:'Dificultades', intervenciones:'Intervenciones', recomendaciones:'Recomendaciones'};
      const [ciclo,setCiclo] = useState('2026-2027');
      const [versionLista, recargarLista] = useState(0);
      useEffect(() => { apiRequest('/api/alumnos').then(rows => setAlumnos(rows)).catch(e => setError(e.message)); }, []);
      useEffect(() => {
        if (!alumnoId) return;
        let vigente = true;
        apiRequest('/api/informes?alumno_id=' + encodeURIComponent(alumnoId))
          .then(rows => { if (vigente) setLista(rows); })
          .catch(e => { if (vigente) setError(e.message); });
        return () => { vigente = false; };
      }, [alumnoId, versionLista]);
      const nuevo = () => {
        if (!alumnoId) return;
        setActual({alumno_id:alumnoId,ciclo,tipo:'seguimiento',titulo:'Informe de seguimiento',
          antecedentes:'',avances:'',dificultades:'',intervenciones:'',recomendaciones:'',revision:null});
        setEstado('Nuevo informe sin guardar');
      };
      const guardar = async () => {
        if (!actual || busy) return;
        setBusy(true); setEstado('Guardando…');
        try {
          const esNuevo = !actual.id;
          const r = await apiRequest(esNuevo ? '/api/informes' : '/api/informes/' + actual.id,
            {method:esNuevo ? 'POST':'PUT',body:JSON.stringify(actual)});
          const actualizado = {...actual,id:r.id,revision:r.revision};
          setActual(actualizado); recargarLista(n => n + 1);
          setEstado('Guardado confirmado'); setError('');
        } catch(e) { setEstado('Cambios no guardados'); setError(e.message); }
        finally { setBusy(false); }
      };
      return <div className="space-y-4">
        <div className="flex gap-3 items-center"><button onClick={onBack} className="px-3 py-2 bg-slate-100 rounded-lg">← Volver</button><h1 className="text-2xl font-bold">Informes educativos</h1></div>
        <div className="bg-white rounded-xl border p-4 flex flex-wrap gap-3 items-end">
          <label className="flex-1 min-w-56 text-sm">Alumno
            <select disabled={busy} value={alumnoId} onChange={e=>{
              setAlumnoId(e.target.value); setActual(null); setLista([]); setError(''); setEstado('');
            }}
              className="mt-1 w-full border rounded-lg p-2"><option value="">Seleccionar alumno</option>
              {alumnos.map(a=><option key={a.id} value={a.id}>{a.nombre_completo}</option>)}
            </select>
          </label>
          <label className="text-sm">Ciclo<input value={ciclo} onChange={e=>setCiclo(e.target.value)} className="block mt-1 border rounded-lg p-2 w-32"/></label>
          <button disabled={!alumnoId || busy} onClick={nuevo} className="px-4 py-2 bg-amber-600 disabled:opacity-50 text-white rounded-lg">+ Nuevo informe</button>
        </div>
        {error && <div role="alert" className="bg-red-50 text-red-700 p-3 rounded-lg">{error}</div>}
        {lista.length>0 && <div className="bg-white rounded-xl border p-3"><strong>Informes existentes</strong><div className="flex flex-wrap gap-2 mt-2">
          {lista.map(inf=><button key={inf.id} disabled={busy} onClick={()=>{setActual(inf);setEstado('Informe recuperado');}} className="border rounded-lg px-3 py-2 text-sm hover:bg-slate-50">{inf.titulo} · {inf.ciclo}</button>)}
        </div></div>}
        {actual && <fieldset disabled={busy} className="bg-white rounded-xl border p-5 space-y-4">
          <div className="grid md:grid-cols-2 gap-3">
            <label className="text-sm">Título<input value={actual.titulo} onChange={e=>{setActual({...actual,titulo:e.target.value});setEstado('Cambios pendientes');}} className="block border rounded-lg p-2 w-full mt-1"/></label>
            <label className="text-sm">Tipo<select value={actual.tipo} onChange={e=>{setActual({...actual,tipo:e.target.value});setEstado('Cambios pendientes');}} className="block border rounded-lg p-2 w-full mt-1">
              <option value="seguimiento">Seguimiento</option><option value="evaluacion">Evaluación</option><option value="intervencion">Intervención</option><option value="otro">Otro</option></select></label>
          </div>
          {campos.map(k=><label key={k} className="block font-semibold text-sm">{labels[k]}
            <textarea value={actual[k]||''} onChange={e=>{setActual({...actual,[k]:e.target.value});setEstado('Cambios pendientes');}} rows="3" className="block w-full mt-1 border rounded-lg p-2 font-normal"/>
          </label>)}
          <div className="flex items-center flex-wrap gap-3"><button disabled={busy} onClick={guardar} className="bg-emerald-700 text-white px-4 py-2 rounded-lg disabled:opacity-50">{busy?'Guardando…':'Guardar informe'}</button>
            {actual.id && <button onClick={() => descargarArchivo('/api/informes/' + actual.id + '/pdf', 'Informe-USAER-2E.pdf').catch(e => setError(e.message))}
              className="border rounded-lg px-4 py-2">Exportar PDF</button>}
            <span role="status" className="text-sm text-slate-500">{estado}</span></div>
        </fieldset>}
      </div>;
    }

    // =============================================================
    // VISTA 5: ESTADÍSTICAS INSTITUCIONALES DE ZONA
    // =============================================================
    function EstadisticasView({ director, onBack, setMetrics }) {
      const [stats, setStats] = useState(null);
      const [escuela, setEscuela] = useState('');
      const [bajas, setBajas] = useState(false);
      const [ciclo, setCiclo] = useState('2026-2027');
      const [error, setError] = useState('');
      const [gestion, setGestion] = useState(null);
      useEffect(() => {
        if (director) apiRequest('/api/estadisticas/zona').then(setGestion).catch(() => {});
      }, [director]);

      useEffect(() => {
        let vigente = true;
        const t0 = performance.now();
        const consulta = new URLSearchParams({ escuela, incluir_bajas: bajas, ciclo });
        apiRequest('/api/estadisticas/padron?' + consulta).then(data => {
          if (!vigente) return;
          setStats(data);
          setError('');
          const t1 = performance.now();
          setMetrics(m => ({ latency: Math.round(t1 - t0), requests: m.requests + 1 }));
        }).catch(e => { if (vigente) { setStats(null); setError(e.message); } });
        return () => { vigente = false; };
      }, [escuela, bajas, ciclo, setMetrics]);

      return (
        <div className="space-y-6">
          <div className="flex items-center space-x-3">
            <button onClick={onBack} className="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-700 font-semibold transition">
              ← Volver
            </button>
            <h1 className="text-2xl font-bold tracking-tight text-slate-900">Estadísticas de Zona 001</h1>
          </div>
          <div className="flex flex-wrap items-center gap-4 text-sm">
            <label>Escuela <select value={escuela} onChange={e => setEscuela(e.target.value)} className="border rounded p-1">
              <option value="">Todas las escuelas autorizadas</option>
              {(stats?.escuelas || []).map(e => <option key={e.id} value={e.id}>{e.nombre}</option>)}
            </select></label>
            <label>Ciclo EPP <select value={ciclo} onChange={e => setCiclo(e.target.value)} className="border rounded p-1">
              {['2024-2025', '2025-2026', '2026-2027', '2027-2028'].map(c => <option key={c}>{c}</option>)}
            </select></label>
            <label><input type="checkbox" checked={bajas} onChange={e => setBajas(e.target.checked)} /> Incluir bajas</label>
          </div>
          {error && <p role="alert" className="text-red-700">{error}</p>}
          {!stats && !error && <p>Calculando indicadores relacionales…</p>}
          {stats && <>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="p-4 bg-white rounded-xl border border-slate-200 shadow-sm">
              <div className="text-slate-500 text-xs font-semibold">Total Alumnos en Padrón</div>
              <div className="text-2xl font-black text-slate-900 mt-1">{stats.total_alumnos}</div>
              <div className="text-[11px] text-emerald-600 mt-1">{stats.alumnos_activos} activos</div>
            </div>
            <div className="p-4 bg-white rounded-xl border border-slate-200 shadow-sm">
              <div className="text-slate-500 text-xs font-semibold">Escuelas de la Zona</div>
              <div className="text-2xl font-black text-amber-600 mt-1">{stats.total_escuelas}</div>
              <div className="text-[11px] text-slate-400 mt-1">Primarias públicas</div>
            </div>
            <div className="p-4 bg-white rounded-xl border border-slate-200 shadow-sm">
              <div className="text-slate-500 text-xs font-semibold">Alumnado activo con EPP registrada</div>
              <div className="text-2xl font-black text-emerald-600 mt-1">{stats.cumplimiento_epp}</div>
              <div className="text-[11px] text-slate-400 mt-1">Avance curricular</div>
            </div>
            <div className="p-4 bg-white rounded-xl border border-slate-200 shadow-sm">
              <div className="text-slate-500 text-xs font-semibold">Edad promedio al 1 de septiembre</div>
              <div className="text-2xl font-black text-slate-900 mt-1">{stats.edad?.media ?? '—'}</div>
              {stats.edad && <div className="text-[11px] text-slate-400 mt-1">Mín. {stats.edad.minima} · Máx. {stats.edad.maxima}</div>}
            </div>
          </div>
          <p className="text-sm">Hombres: {stats.sexo.hombres} · Mujeres: {stats.sexo.mujeres} · Sin dato: {stats.sexo.sin_dato}</p>
          {director && gestion && <p className="text-sm">Totales de zona · Actas: {gestion.visitas_registradas} · Oficios: {gestion.oficios_emitidos}</p>}

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="p-5 bg-white rounded-xl border border-slate-200 space-y-3">
              <h3 className="font-bold text-slate-800 text-sm">Distribución por Condición o Discapacidad</h3>
              <div className="space-y-2 text-xs">
                {Object.entries(stats.distribucion_condicion || {}).map(([cond, count]) => (
                  <div key={cond} className="flex justify-between items-center py-1 border-b border-slate-100">
                    <span className="text-slate-700">{cond}</span>
                    <span className="font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded">{count}</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="p-5 bg-white rounded-xl border border-slate-200 space-y-3">
              <h3 className="font-bold text-slate-800 text-sm">Matrícula por Escuela</h3>
              <div className="space-y-2 text-xs">
                {Object.entries(stats.distribucion_escuela || {}).map(([esc, count]) => (
                  <div key={esc} className="flex justify-between items-center py-1 border-b border-slate-100">
                    <span className="text-slate-700">{esc}</span>
                    <span className="font-bold text-slate-800 bg-slate-100 px-2 py-0.5 rounded">{count}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
          </>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
