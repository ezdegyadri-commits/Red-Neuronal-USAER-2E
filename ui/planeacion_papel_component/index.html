<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#fff;color:#000;font:16px/1.35 'Times New Roman',serif}button{font:13px Arial,sans-serif;cursor:pointer;border:1px solid #aaa;border-radius:3px;background:white;color:#222;padding:6px 9px}button:hover{background:#eef4f4}.tools{display:flex;gap:5px;flex-wrap:wrap;padding:6px 0 12px;font:13px Arial,sans-serif}.page{padding:22px 18px;border:1px solid #ddd;min-width:850px;box-sizing:border-box}.scroll{overflow-x:auto}h1{font-size:19px;text-align:center;margin:0 0 14px;font-weight:bold}table{border-collapse:collapse;width:100%;table-layout:fixed;margin:0 0 14px}td,th{border:1px solid #000;padding:8px;vertical-align:top;text-align:left;overflow-wrap:anywhere;white-space:pre-wrap}th{font-weight:bold;font-size:15px;background:white}td.header{font-size:15px}td.editable{min-height:85px}.cell{min-height:70px;white-space:pre-wrap;outline:none}.cell[contenteditable=true]:focus{outline:2px solid #477d86;outline-offset:3px}.referente{font-size:14px;white-space:pre-wrap;margin-bottom:10px}.hint{font:11px Arial,sans-serif;color:#555;margin:4px 0}.rowtools{border:0;width:30px;padding:3px}.rowtools button{padding:3px;color:#855;font-size:12px}.title{font-weight:bold;text-align:center;background:white}label{font-weight:bold}section{border:1px solid #000;margin:12px 0;padding:8px}.signature{display:flex;justify-content:space-around;margin-top:45px;text-align:center;font-size:15px}.status{font:12px Arial,sans-serif;color:#555;min-height:16px}.preview{font-size:13px;max-width:1180px;margin:auto}@media print{.tools,.rowtools,.hint,.status{display:none}.page{border:0;padding:0}body{font-size:12pt}}
.cell{min-height:28px}.revision{font:14px Arial,sans-serif;margin:12px 0;padding:10px;background:#f4f7f8}.revision a{display:block;color:#164c60;margin:8px 0}details>summary{cursor:pointer}section:has(.cell:empty){padding:5px}
.tools{position:sticky;top:0;z-index:2;align-items:center;background:#f3f8f9;gap:8px;padding:12px;border:1px solid #d5e1e4;border-radius:12px;margin-bottom:8px}.tools button{font:14px/1.3 Arial,sans-serif;padding:10px 14px;border-radius:8px;border-color:#b1c8cd;color:#173e48;transition:background .18s,transform .18s}.tools button:hover{background:#e0eff1}.tools button:active{transform:scale(.98)}.tools button:focus-visible{outline:3px solid #147d88;outline-offset:2px}.tools .primary{background:#174b58;color:white;border-color:#174b58}.tools .primary:hover{background:#226172}.tools details{font:13px Arial,sans-serif;padding:8px}.tools details[open]{background:white;border:1px solid #c8d7dc;border-radius:8px}.tools details button{display:block;margin:6px 0;width:100%;text-align:left}.page{box-shadow:0 5px 22px #173e480d;border-color:#ccd9de;border-radius:3px;padding:24px}.cell[contenteditable=true]:hover{background:#f4f9fa}.cell[contenteditable=true]:focus{background:#f7fbfc}.context-help{font:12px Arial,sans-serif;border:0;color:#15556a;padding:3px 0;background:none;display:block;margin-top:5px}@media(prefers-reduced-motion:reduce){.tools button{transition:none;transform:none!important}}@media print{.context-help{display:none}}
</style></head><body><div class="preview"><div class="tools" id="tools"></div><div class="status" id="status" role="status" aria-live="polite">Preparando tu formato… Tu planeación guardada se conserva.</div><div class="scroll"><article class="page" id="page"></article></div></div>
<script>
(()=>{'use strict';let args=null,dirty={},serial=0,busy=false,timer=null,queued=null,lastAction=null,flight=null,watchdog=null,recovery={},backupConflict=false,blocked=false;const root=document.getElementById('page'),status=document.getElementById('status');
// El saludo no contiene datos. El primer render del padre directo fija su origen;
// ninguna edición ni respaldo se transmite con un destino comodín.
let parentOrigin=null;
const send=(type,extra={})=>{if(type==='streamlit:setComponentValue'&&!parentOrigin)return;parent.postMessage({isStreamlitMessage:true,type,...extra},parentOrigin||'*')};
const resize=()=>send('streamlit:setFrameHeight',{height:Math.max(180,Math.min(12000,document.documentElement.scrollHeight+20))});
const text=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value||'';if(cls)e.className=cls;return e};
function editable(enabled){for(const e of root.querySelectorAll('[data-cell]')){const c=args?.cells[e.dataset.cell];if(['SELECT','INPUT'].includes(e.tagName))e.disabled=!enabled||!c?.editable;else e.contentEditable=String(enabled&&c?.editable)}}
function transmit(){if(!flight)return;send('streamlit:setComponentValue',{dataType:'json',value:{...flight.value,reintento:flight.retry++}});clearTimeout(watchdog);watchdog=setTimeout(()=>{if(!flight)return;busy=false;editable(['guardar','autoguardar'].includes(flight.value.accion));status.textContent=['guardar','autoguardar'].includes(flight.value.accion)?'La confirmación está tardando. Tu texto se conserva en esta pestaña; puedes seguir editando. Se reintentará sin duplicar el cambio.':'La operación está tardando. Tu texto se conserva; se reintentará la misma operación sin duplicarla.';guardarLocal();send('streamlit:componentReady',{apiVersion:1});transmit()},15000)}
function emit(accion='guardar',extra={}){if(!args)return;if(flight){if(accion!=='autoguardar')queued={accion,extra};return}clearTimeout(timer);busy=true;lastAction=accion;guardarLocal();flight={schema:args,retry:0,value:{nonce:Date.now()+'-'+(++serial),documento:args.documento,huella:args.huella,cambios:{...dirty},accion,...extra}};editable(['guardar','autoguardar'].includes(accion));status.textContent=accion==='autoguardar'||accion==='guardar'?'Guardando… Puedes seguir escribiendo.':'Guardando antes de abrir esta opción…';transmit()}
function drain(){if(flight||blocked)return;if(queued&&!busy){const next=queued;queued=null;queueMicrotask(()=>emit(next.accion,next.extra))}else if(Object.keys(dirty).length){clearTimeout(timer);timer=setTimeout(()=>emit('autoguardar'),4000)}}
function calendarValue(value){return /^\d{2}\/\d{2}\/\d{4}$/.test(value)?value.split('/').reverse().join('-'):value}
function cell(c){const wrap=document.createElement('div');if(c.tipo==='fecha'){const input=document.createElement('input');input.type='date';input.id='celda-'+c.id;input.dataset.cell=c.id;input.disabled=!c.editable;input.setAttribute('aria-label',c.label);input.value=c.fecha_iso||'';input.addEventListener('change',()=>{dirty[c.id]=input.value;guardarLocal();clearTimeout(timer);timer=setTimeout(()=>emit('autoguardar'),1000)});wrap.append(input);return wrap}if(c.opciones){const select=document.createElement('select');select.id='celda-'+c.id;select.dataset.cell=c.id;select.disabled=!c.editable;select.setAttribute('aria-label',c.label+' · '+c.id);for(const v of c.opciones){const o=text('option',v);o.value=v;select.append(o)}select.value=c.value;select.addEventListener('change',()=>{dirty[c.id]=select.value;guardarLocal();clearTimeout(timer);timer=setTimeout(()=>emit('autoguardar'),1000)});wrap.append(select);return wrap}const e=text('div',c.value,'cell');e.id='celda-'+c.id;e.setAttribute('role','textbox');e.setAttribute('aria-label',c.label+' · '+c.id);e.contentEditable=String(c.editable);e.dataset.cell=c.id;
e.addEventListener('input',()=>{blocked=false;dirty[c.id]=e.innerText;status.textContent='Cambios en esta hoja: se transmitirán tras una pausa al escribir.';clearTimeout(timer);timer=setTimeout(()=>emit('autoguardar'),4000);resize()});
e.addEventListener('paste',ev=>{ev.preventDefault();const value=(ev.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,value)});wrap.append(e);if(c.nota)wrap.append(text('p',c.nota,'hint'));return wrap}
function button(label,action){const b=text('button',label);b.type='button';b.addEventListener('click',action);return b}
const cacheKey=()=> 'usaer-hoja:'+(args.cache_id||args.documento);
function datosRespaldo(){return {tipo:'usaer-texto-pendiente-v2',documento:args.documento,cache_id:args.cache_id,colaborativa:args.colaborativa,huella:args.huella,cambios:{...dirty},por_destino:{...recovery},celdas:Object.entries(dirty).filter(([id])=>args.cells[id]?.editable).map(([id,valor])=>{const c=args.cells[id];return {destinatario:c.destinatario||'',label:c.label,target:c.target,base:c.value,valor}})}}
function guardarLocal(){if(!args)return;for(const [id,value] of Object.entries(dirty)){const c=args.cells[id];if(c?.editable)recovery[JSON.stringify(c.target)]=value}try{if(!backupConflict)sessionStorage.setItem(cacheKey(),JSON.stringify(datosRespaldo()))}catch(_){status.textContent='No se pudo guardar el respaldo de esta pestaña. Usa «Respaldar texto sin conexión» y espera la confirmación del servidor.'}}
root.addEventListener('input',guardarLocal);
function confirmarLocal(){if(backupConflict)return;recovery={};try{sessionStorage.removeItem(cacheKey())}catch(_){}}
// Actualizar únicamente valores mantiene el mismo nodo editable, selección y
// cursor. Nunca se aplica un aporte remoto encima de texto local pendiente.
function compatible(next){return args&&args.documento===next.documento&&JSON.stringify(Object.entries(args.cells).map(([k,c])=>[k,c.target,c.editable,c.opciones,c.destinatario,c.tipo]))===JSON.stringify(Object.entries(next.cells).map(([k,c])=>[k,c.target,c.editable,c.opciones,c.destinatario,c.tipo]))}
function patchCells(next){for(const [id,c] of Object.entries(next.cells)){const e=document.getElementById('celda-'+id);if(!e||c.editable&&id in dirty)continue;if(['SELECT','INPUT'].includes(e.tagName)){const value=e.type==='date'?calendarValue(c.value):c.value;if(e.value!==value)e.value=value}else if(e.textContent!==c.value)e.textContent=c.value}for(const [i,row] of next.header.entries())for(const [j,v] of row.entries()){const e=document.getElementById('encabezado-'+i+'-'+j);if(e&&typeof v==='string'&&e.textContent!==v)e.textContent=v}args=next;resize()}
function respaldo(){let anterior=null;try{anterior=sessionStorage.getItem(cacheKey())}catch(_){}const blob=new Blob([JSON.stringify({...datosRespaldo(),respaldo_anterior:anterior},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='texto-pendiente-planeacion.json';a.click();URL.revokeObjectURL(a.href)}
function render(next,acknowledged=false){const focused=document.activeElement?.dataset.cell;clearTimeout(timer);args=next;busy=false;dirty={};status.textContent=acknowledged?'Cambios aplicados al borrador. Puedes continuar editando.':'Escribe directamente en el formato. Puedes borrar el texto de una celda; los datos de identidad se cambian mediante la selección de alumnos.';root.replaceChildren();document.getElementById('tools').replaceChildren();
const toolbar=document.getElementById('tools');
if(!args.colaborativa){const help=button('Ayúdame a planear',()=>emit('ia'));help.className='primary';toolbar.append(help)}
toolbar.append(button('Guardar planeación',()=>emit('guardar')));
if(!args.colaborativa)toolbar.append(button('Descargar',()=>emit('pdf')));
const volver=button('Regresar al inicio del módulo',()=>emit('inicio'));volver.className='navigation';volver.style.border='0';volver.style.background='transparent';volver.style.textDecoration='underline';toolbar.append(volver);
const mas=document.createElement('details');mas.append(text('summary','Más opciones'));
mas.append(button('Respaldar texto sin conexión',respaldo));
if(args.grupal&&!args.colaborativa)mas.append(button('Actualizar aportes del equipo',()=>emit('equipo')));
if(!args.colaborativa){
for(const [label,action] of [['Consultar expediente y NEE','antecedentes'],['Elegir contenidos y PDA','referentes'],['Apoyos DUA','dua'],['Completar solo los apartados vacíos','apartados']])mas.append(button(label,()=>emit(action)));
for(const [label,action] of [['Cambiar alumnos / grado','alumnos'],['Detalle y sesiones','detalle'],['Descargas, historial y eliminación','opciones'],['Enviar a Dirección','enviar']])mas.append(button(label,()=>emit(action)));
}
toolbar.append(mas);
if(args.pendientes?.length){const revision=document.createElement('details');revision.className='revision';revision.append(text('summary','Revisar antes de entregar · '+args.pendientes.length+' pendientes'));for(const p of args.pendientes){const a=text('a',p.mensaje+' → Corregir');a.href=p.celda?'#celda-'+p.celda:'#';a.addEventListener('click',ev=>{ev.preventDefault();if(p.celda){const e=document.getElementById('celda-'+p.celda);if(!e)return;for(let n=e.parentElement;n;n=n.parentElement)if(n.tagName==='DETAILS')n.open=true;e.scrollIntoView({behavior:'smooth',block:'center'});e.focus({preventScroll:true});resize()}else emit('corregir',{panel:p.panel})});revision.append(a)}root.append(revision)}
root.append(text('h1',args.titulo));const header=document.createElement('table');if(args.header[1]?.length===3){const cols=document.createElement('colgroup');for(const width of [50,15,35]){const c=document.createElement('col');c.style.width=width+'%';cols.append(c)}header.append(cols)}for(const [i,row] of args.header.entries()){const tr=document.createElement('tr');for(const [j,v] of row.entries()){const td=text('td',typeof v==='object'?'':v,'header');td.id='encabezado-'+i+'-'+j;if(typeof v==='object'){td.append(text('label',v.label+':'),cell(v))}if(i===0&&j===0&&args.header[1]?.length===3)td.colSpan=2;tr.append(td)}header.append(tr)}root.append(header);
for(const t of args.tables){let mount=root;if(t.collapsed){mount=document.createElement('details');mount.append(text('summary',t.collapsed));root.append(mount)}const table=document.createElement('table');const colgroup=document.createElement('colgroup');for(let i=0;i<t.headers.length;i++){const col=document.createElement('col');if(t.widths?.[i])col.style.width=t.widths[i]+'%';colgroup.append(col)}table.append(colgroup);
if(t.title){const tr=document.createElement('tr'),td=text('td',t.title,'title');td.colSpan=t.headers.length;tr.append(td);table.append(tr)}const th=document.createElement('tr');for(const h of t.headers){const head=text('th',h);if(!args.colaborativa){const help=h==='Necesidades educativas específicas'?['Ver antecedentes','antecedentes']:h.startsWith('PDA:')||h==='Aprendizaje y/u objetivo'?['Consultar referentes','referentes']:h==='Actividades'?['Proponer actividades','ia']:h==='Apoyos y/o ajustes razonables'?['Consultar apoyos','dua']:null;if(help){const b=button(help[0],()=>emit(help[1]));b.className='context-help';head.append(b)}}th.append(head)}table.append(th);
for(const [i,row] of t.rows.entries()){const ri=t.indices?.[i]??i;const tr=document.createElement('tr');for(const c of row){const td=document.createElement('td');td.append(cell(c));tr.append(td)}if(t.delete&&!t.protected?.includes(ri)){const tools=document.createElement('span');tools.className='rowtools';tools.append(button('×',()=>{if(confirm('Retirar esta fila de la planeación actual? Las versiones anteriores se conservan.'))emit('retirar',{tabla:t.id,fila:ri,confirmado:true})}));tr.lastChild.append(tools)}table.append(tr)}mount.append(table);if(t.add){let alumno=null;if(t.alumnos){alumno=document.createElement('select');alumno.setAttribute('aria-label','Alumno para añadir un indicador');for(const a of t.alumnos){const option=text('option',a.nombre);option.value=a.id;alumno.append(option)}mount.append(alumno)}mount.append(button(t.alumnos?'+ Añadir indicador al alumno elegido':'+ Añadir fila',()=>emit('agregar',{tabla:t.id,...(alumno?{alumno:alumno.value}:{})})))}}
for(const c of args.textos){const section=document.createElement('section');if(!c.value){const detail=document.createElement('details');detail.append(text('summary','Completar '+c.label));detail.append(cell(c));section.append(detail)}else{section.append(text('label',c.label));section.append(cell(c))}root.append(section)}const firmas=document.createElement('div');firmas.className='signature';firmas.append(text('div','____________________________\n'+args.firma),text('div','____________________________\n'+args.vobo));root.append(firmas);if(focused){const e=[...root.querySelectorAll('[data-cell]')].find(x=>x.dataset.cell===focused);if(e&&e.isContentEditable){e.focus({preventScroll:true});const range=document.createRange();range.selectNodeContents(e);range.collapse(false);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range)}}resize()}
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='streamlit:render'||!/^https?:\/\/[^/]+$/.test(event.origin)||(parentOrigin&&event.origin!==parentOrigin))return;const next=event.data.args?.hoja;if(!next)return;parentOrigin=event.origin;clearInterval(readyTimer);const confirmado=event.data.args.guardado;const ack=!!flight&&event.data.args.aceptado_nonce===flight.value.nonce;const rejected=!!flight&&event.data.args.rechazado===flight.value.nonce;
if(rejected){clearTimeout(watchdog);clearTimeout(timer);flight=null;busy=false;queued=null;blocked=true;editable(true);status.textContent=(event.data.args.error||'No se pudo aplicar el cambio.')+' Tu texto sigue en esta pestaña: descarga su respaldo antes de actualizar.';guardarLocal();return}
let remaining={};if(ack){clearTimeout(watchdog);for(const [id,value] of Object.entries(dirty))if(!(id in flight.value.cambios)||flight.value.cambios[id]!==value)remaining[id]=value;flight=null;busy=false}
if(args&&compatible(next)&&(args.huella===next.huella||ack)){if(ack){dirty=remaining;blocked=false}patchCells(next);if(!flight&&!blocked){editable(true);if(confirmado&&!Object.keys(dirty).length)confirmarLocal();else guardarLocal();status.textContent=Object.keys(dirty).length?'Tu texto más reciente se conserva y se autoguardará.':confirmado?'Guardado confirmado · '+confirmado:'Texto recibido; falta confirmar el guardado recuperable. Puedes continuar.';drain()}return}
if(Object.keys(dirty).length&&args&&next.documento===args.documento&&!ack){blocked=true;status.textContent='La versión cambió. Tu texto pendiente se conserva en esta pestaña; descarga su respaldo antes de actualizar.';guardarLocal();return}
const previous=args;render(next,ack);
if(ack){recovery={};for(const [id,value] of Object.entries(remaining)){const old=previous.cells[id];const key=Object.keys(next.cells).find(k=>next.cells[k].editable&&(old?.destinatario?next.cells[k].destinatario===old.destinatario&&next.cells[k].label===old.label:!next.cells[k].destinatario&&JSON.stringify(next.cells[k].target)===JSON.stringify(old?.target)));if(key)dirty[key]=value;else backupConflict=true}guardarLocal()}
else{recovery={};backupConflict=false;try{const backup=JSON.parse(sessionStorage.getItem(cacheKey())||'null');if(backup&&backup.huella===next.huella){recovery=backup.por_destino||{};dirty={...(backup.cambios||{})};for(const [id,c] of Object.entries(next.cells))if(c.editable&&JSON.stringify(c.target) in recovery)dirty[id]=recovery[JSON.stringify(c.target)]}else if(backup)backupConflict=true}catch(_){}}
for(const [id,value] of Object.entries(dirty)){const e=document.getElementById('celda-'+id);if(e&&args.cells[id]?.editable){if(['SELECT','INPUT'].includes(e.tagName))e.value=e.type==='date'?calendarValue(value):value;else e.textContent=value}}
if(backupConflict)status.textContent='Hay un respaldo local de otra revisión. Descárgalo con «Respaldar texto sin conexión» antes de actualizar; no se sobrescribió.';
else if(confirmado&&!Object.keys(dirty).length){confirmarLocal();status.textContent='Guardado confirmado · '+confirmado}else if(ack)status.textContent='Texto recibido; falta confirmar el guardado recuperable. Puedes continuar.';drain()});
window.addEventListener('beforeunload',event=>{if(Object.keys(dirty).length||Object.keys(recovery).length||flight||backupConflict){event.preventDefault();event.returnValue=''}});
// El clic de la cabecera llega antes del debounce de escritura. No permitir
// cerrar una sesión con texto que Python todavía no ha recibido/confirmado.
window.addEventListener('click',event=>{const b=event.target?.closest?.('button');if(!b||!/^\s*(Cerrar sesi[oó]n|Guardar cambios y cerrar sesi[oó]n)\s*$/i.test(b.textContent||''))return;if(Object.keys(dirty).length||Object.keys(recovery).length||flight||backupConflict){event.preventDefault();event.stopImmediatePropagation();if(!backupConflict&&!blocked)emit('guardar');status.textContent='Hay texto sin confirmación en esta hoja. Se solicitó guardarlo antes de cerrar. Espera el estado Guardado confirmado; si falla, descarga el respaldo en Más opciones.'}},true);
const ready=()=>{if(!args){send('streamlit:componentReady',{apiVersion:1});resize()}};const readyTimer=setInterval(ready,5000);ready();new ResizeObserver(resize).observe(root);
})();
</script></body></html>
