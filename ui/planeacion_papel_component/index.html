<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#fff;color:#000;font:16px/1.35 'Times New Roman',serif}button{font:13px Arial,sans-serif;cursor:pointer;border:1px solid #aaa;border-radius:3px;background:white;color:#222;padding:6px 9px}button:hover{background:#eef4f4}.tools{display:flex;gap:5px;flex-wrap:wrap;padding:6px 0 12px;font:13px Arial,sans-serif}.page{padding:22px 18px;border:1px solid #ddd;min-width:850px;box-sizing:border-box}.scroll{overflow-x:auto}h1{font-size:19px;text-align:center;margin:0 0 14px;font-weight:bold}table{border-collapse:collapse;width:100%;table-layout:fixed;margin:0 0 14px}td,th{border:1px solid #000;padding:8px;vertical-align:top;text-align:left;overflow-wrap:anywhere;white-space:pre-wrap}th{font-weight:bold;font-size:15px;background:white}td.header{font-size:15px}td.editable{min-height:85px}.cell{min-height:70px;white-space:pre-wrap;outline:none}.cell[contenteditable=true]:focus{outline:2px solid #477d86;outline-offset:3px}.referente{font-size:14px;white-space:pre-wrap;margin-bottom:10px}.hint{font:11px Arial,sans-serif;color:#555;margin:4px 0}.rowtools{border:0;width:30px;padding:3px}.rowtools button{padding:3px;color:#855;font-size:12px}.title{font-weight:bold;text-align:center;background:white}label{font-weight:bold}section{border:1px solid #000;margin:12px 0;padding:8px}.signature{display:flex;justify-content:space-around;margin-top:45px;text-align:center;font-size:15px}.status{font:12px Arial,sans-serif;color:#555;min-height:16px}.preview{font-size:13px;max-width:1180px;margin:auto}@media print{.tools,.rowtools,.hint,.status{display:none}.page{border:0;padding:0}body{font-size:12pt}}
</style></head><body><div class="preview"><div class="tools" id="tools"></div><div class="status" id="status" role="status" aria-live="polite"></div><div class="scroll"><article class="page" id="page"></article></div></div>
<script>
(()=>{'use strict';let args=null,dirty={},serial=0,busy=false,timer=null,queued=null;const root=document.getElementById('page'),status=document.getElementById('status');
const origin=(()=>{try{return new URL(document.referrer).origin}catch(_){return location.origin}})();
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},origin);
const resize=()=>send('streamlit:setFrameHeight',{height:Math.min(12000,document.documentElement.scrollHeight+20)});
const text=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value||'';if(cls)e.className=cls;return e};
function emit(accion='guardar',extra={}){if(!args)return;if(busy){if(accion!=='autoguardar')queued={accion,extra};return}clearTimeout(timer);busy=true;for(const e of root.querySelectorAll('[data-cell]'))e.contentEditable='false';status.textContent='Aplicando cambios al borrador…';send('streamlit:setComponentValue',{dataType:'json',value:{nonce:Date.now()+'-'+(++serial),documento:args.documento,huella:args.huella,cambios:{...dirty},accion,...extra}})}
function drain(){if(queued&&!busy){const next=queued;queued=null;queueMicrotask(()=>emit(next.accion,next.extra))}}
function cell(c){const wrap=document.createElement('div');if(c.referente){wrap.append(text('div',c.referente,'referente'));wrap.append(text('p','Adaptación docente / objetivo de trabajo (editable):','hint'))}const e=text('div',c.value,'cell');e.setAttribute('role','textbox');e.setAttribute('aria-label',c.label+' · '+c.id);e.contentEditable=String(c.editable);e.dataset.cell=c.id;
e.addEventListener('input',()=>{dirty[c.id]=e.innerText;status.textContent='Cambios en esta hoja: se transmitirán tras una pausa al escribir.';clearTimeout(timer);timer=setTimeout(()=>emit('autoguardar'),4000);resize()});
e.addEventListener('paste',ev=>{ev.preventDefault();const value=(ev.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,value)});wrap.append(e);if(c.nota)wrap.append(text('p',c.nota,'hint'));return wrap}
function button(label,action){const b=text('button',label);b.type='button';b.addEventListener('click',action);return b}
function render(next){const focused=document.activeElement?.dataset.cell;clearTimeout(timer);args=next;busy=false;dirty={};status.textContent='Escribe directamente en el formato. Puedes borrar el texto de una celda; los datos de identidad se cambian mediante la selección de alumnos.';root.replaceChildren();document.getElementById('tools').replaceChildren();
const toolbar=document.getElementById('tools');toolbar.append(button('Guardar cambios de la hoja',()=>emit('guardar')),button('Ver PDF de esta hoja',()=>emit('pdf')));
const conexiones=document.createElement('details');conexiones.append(text('summary','Conectar antecedentes, PDA y DUA'));
for(const [label,action] of [['Antecedentes y documentos','antecedentes'],['Contenidos y PDA','referentes'],['Apoyos DUA','dua']])conexiones.append(button(label,()=>emit(action)));
toolbar.append(conexiones,button('Completar apartados vacíos con mis datos',()=>emit('apartados')),button('Proponer actividades con IA',()=>emit('ia')));
const mas=document.createElement('details');mas.append(text('summary','Alumnos y otras opciones'));
for(const [label,action] of [['Cambiar alumnos / grado','alumnos'],['Detalle y sesiones','detalle'],['Enviar a Dirección','enviar']])mas.append(button(label,()=>emit(action)));
mas.append(button('Respaldar texto sin conexión',()=>{const blob=new Blob([JSON.stringify({documento:args.documento,huella:args.huella,cambios:dirty},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='texto-pendiente-planeacion.json';a.click();URL.revokeObjectURL(a.href)}));toolbar.append(mas);
root.append(text('h1',args.titulo));const header=document.createElement('table');if(args.header[1]?.length===3){const cols=document.createElement('colgroup');for(const width of [50,15,35]){const c=document.createElement('col');c.style.width=width+'%';cols.append(c)}header.append(cols)}for(const [i,row] of args.header.entries()){const tr=document.createElement('tr');for(const [j,v] of row.entries()){const td=text('td',v,'header');if(i===0&&j===0&&args.header[1]?.length===3)td.colSpan=2;tr.append(td)}header.append(tr)}root.append(header);
for(const t of args.tables){const table=document.createElement('table');const colgroup=document.createElement('colgroup');for(let i=0;i<t.headers.length;i++){const col=document.createElement('col');if(t.widths?.[i])col.style.width=t.widths[i]+'%';colgroup.append(col)}table.append(colgroup);
if(t.title){const tr=document.createElement('tr'),td=text('td',t.title,'title');td.colSpan=t.headers.length;tr.append(td);table.append(tr)}const th=document.createElement('tr');for(const h of t.headers)th.append(text('th',h));table.append(th);
for(const [i,row] of t.rows.entries()){const tr=document.createElement('tr');for(const c of row){const td=document.createElement('td');td.append(cell(c));tr.append(td)}if(t.delete&&!t.protected?.includes(i)){const tools=document.createElement('span');tools.className='rowtools';tools.append(button('×',()=>{if(confirm('Retirar esta fila de la planeación actual? Las versiones anteriores se conservan.'))emit('retirar',{tabla:t.id,fila:i,confirmado:true})}));tr.lastChild.append(tools)}table.append(tr)}root.append(table);if(t.add)root.append(button('+ Añadir fila',()=>emit('agregar',{tabla:t.id})))}
for(const c of args.textos){const section=document.createElement('section');section.append(text('label',c.label));section.append(cell(c));root.append(section)}const firmas=document.createElement('div');firmas.className='signature';firmas.append(text('div','____________________________\n'+args.firma),text('div','____________________________\n'+args.vobo));root.append(firmas);if(focused){const e=[...root.querySelectorAll('[data-cell]')].find(x=>x.dataset.cell===focused);if(e&&e.isContentEditable){e.focus({preventScroll:true});const range=document.createRange();range.selectNodeContents(e);range.collapse(false);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range)}}resize()}
window.addEventListener('message',event=>{if(event.source!==parent||event.origin!==origin||event.data?.type!=='streamlit:render')return;const next=event.data.args.hoja;if(!next)return;if(args&&args.huella===next.huella){busy=false;for(const e of root.querySelectorAll('[data-cell]'))e.contentEditable=String(args.cells[e.dataset.cell].editable);drain();return}if(Object.keys(dirty).length&&args&&next.documento===args.documento&&!event.data.args.aceptado){status.textContent='La versión cambió. Respalda tu texto pendiente antes de recargar.';busy=false;queued=null;return}render(next);drain()});
window.addEventListener('beforeunload',event=>{if(Object.keys(dirty).length){event.preventDefault();event.returnValue=''}});
send('streamlit:componentReady',{apiVersion:1});new ResizeObserver(resize).observe(root);
})();
</script></body></html>
