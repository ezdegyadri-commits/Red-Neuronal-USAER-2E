[server]
enableStaticServing = true
# Conserva la sesión 24 horas si el navegador pierde temporalmente la conexión.
disconnectedSessionTTL = 86400
# Relatorías de reuniones pueden usar archivos de hasta 400 MB.
maxUploadSize = 400
maxMessageSize = 400

[theme]
base = "light"
primaryColor = "#1B4958"
backgroundColor = "#F8FAFB"
secondaryBackgroundColor = "#F0F4F6"
textColor = "#1E333C"
font = "sans serif"
